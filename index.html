            const root = document.getElementById('modal-root');
            root.innerHTML = `
                <div class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn">
                    <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 max-w-sm w-full border border-slate-200 dark:border-slate-800 shadow-2xl space-y-4">
                        <div class="flex items-center justify-between">
                            <h3 class="font-bold text-base text-slate-900 dark:text-white">Add New User</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <form onsubmit="handleAddNewUser(event)" class="space-y-3.5 w-full">
                            <div class="w-full">
                                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Full Name</label>
                                <input type="text" id="new-user-name" required placeholder="e.g., Priya Sharma" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white">
                            </div>
                            <div class="w-full">
                                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Username</label>
                                <input type="text" id="new-user-username" required placeholder="user3" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white">
                            </div>
                            <div class="w-full">
                                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Password</label>
                                <input type="password" id="new-user-password" required placeholder="••••••••" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white">
                            </div>
                            <div class="w-full">
                                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Role</label>
                                <select id="new-user-role" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white">
                                    <option value="user">Regular User</option>
                                    <option value="admin">Administrator</option>
                                </select>
                            </div>
                            <div class="pt-2 w-full">
                                <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-2xl shadow-md shadow-indigo-500/20 transition text-sm">
                                    Create User Account
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function handleAddNewUser(e) {
            e.preventDefault();
            const name = document.getElementById('new-user-name').value.trim();
            const username = document.getElementById('new-user-username').value.trim().toLowerCase();
            const password = document.getElementById('new-user-password').value;
            const role = document.getElementById('new-user-role').value;

            if (!name || !username || !password) {
                showToast('Please fill in all user details.', 'error');
                return;
            }

            if (state.users.some(u => u.username.toLowerCase() === username)) {
                showToast('Username already exists. Choose another.', 'error');
                return;
            }

            const newUser = {
                id: 'usr_' + Date.now(),
                name,
                username,
                password,
                role,
                email: `${username}@clickfactory.com`
            };

            state.users.push(newUser);
            saveState();
            closeModal();
            showToast(`User ${name} added successfully!`, 'success');
            render();
        }

        function confirmRemoveUser(userId, userName) {
            showConfirmModal(
                'Remove User',
                `Are you sure you want to remove user "${userName}"? Their recorded expenses will also be removed.`,
                () => {
                    state.users = state.users.filter(u => u.id !== userId);
                    state.expenses = state.expenses.filter(e => e.userId !== userId);
                    saveState();
                    showToast(`User ${userName} removed.`, 'success');
                    render();
                }
            );
        }

        function renderUserAnalyticsTab() {
            const userExpenses = state.expenses.filter(e => e.userId === state.currentUser.id);
            const total = userExpenses.reduce((s, e) => s + e.amount, 0);
            const office = userExpenses.filter(e => e.category === 'Office').reduce((s, e) => s + e.amount, 0);
            const shoot = userExpenses.filter(e => e.category === 'Shoot').reduce((s, e) => s + e.amount, 0);

            const monthlyMap = {};
            userExpenses.forEach(exp => {
                const monthKey = exp.date ? exp.date.substring(0, 7) : 'Unknown';
                if (!monthlyMap[monthKey]) monthlyMap[monthKey] = { office: 0, shoot: 0, total: 0 };
                if (exp.category === 'Office') monthlyMap[monthKey].office += exp.amount;
                if (exp.category === 'Shoot') monthlyMap[monthKey].shoot += exp.amount;
                monthlyMap[monthKey].total += exp.amount;
            });
            const months = Object.keys(monthlyMap).sort().reverse();

            return `
                <div class="space-y-4 animate-fadeIn w-full max-w-full">
                    <div class="bg-gradient-to-br from-violet-600 to-indigo-700 rounded-3xl p-5 sm:p-6 text-white shadow-xl w-full">
                        <p class="text-violet-200 text-xs font-semibold uppercase tracking-wider">My Expense Summary</p>
                        <h2 class="text-2xl sm:text-3xl font-bold tracking-tight mt-0.5 break-all">${formatCurrency(total)}</h2>
                        
                        <div class="grid grid-cols-2 gap-3 mt-4 pt-4 border-t border-white/15">
                            <div class="min-w-0">
                                <span class="text-xs text-violet-200 truncate block">Office Expense</span>
                                <p class="font-bold text-sm sm:text-base break-all">${formatCurrency(office)}</p>
                            </div>
                            <div class="min-w-0">
                                <span class="text-xs text-violet-200 truncate block">Shoot Expense</span>
                                <p class="font-bold text-sm sm:text-base break-all">${formatCurrency(shoot)}</p>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-3 w-full">
                        <div class="flex items-center justify-between px-1">
                            <h3 class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Monthly Breakdown</h3>
                            <button onclick="exportUserCSV('${state.currentUser.id}', '${state.currentUser.name}')" class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline flex items-center space-x-1 shrink-0">
                                <i class="fa-solid fa-download"></i><span>Export CSV</span>
                            </button>
                        </div>

                        ${months.length === 0 ? `
                            <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 text-center border border-slate-200 dark:border-slate-800 w-full">
                                <p class="text-xs text-slate-400">No expense records found.</p>
                            </div>
                        ` : ''}

                        ${months.map(m => `
                            <div class="bg-white dark:bg-slate-900 rounded-2xl p-4.5 border border-slate-200 dark:border-slate-800 shadow-sm space-y-2 w-full">
                                <div class="flex items-center justify-between">
                                    <span class="font-bold text-sm text-slate-900 dark:text-white truncate pr-2">${formatMonthName(m)}</span>
                                    <span class="font-bold text-sm text-indigo-600 dark:text-indigo-400 shrink-0">${formatCurrency(monthlyMap[m].total)}</span>
                                </div>
                                <div class="flex justify-between text-xs text-slate-500 dark:text-slate-400 pt-2 border-t border-slate-100 dark:border-slate-800">
                                    <span class="truncate pr-1">Office: ${formatCurrency(monthlyMap[m].office)}</span>
                                    <span class="truncate pl-1 text-right">Shoot: ${formatCurrency(monthlyMap[m].shoot)}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderProfileTab() {
            return `
                <div class="space-y-4 animate-fadeIn w-full max-w-full">
                    <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-7 border border-slate-200 dark:border-slate-800 shadow-sm text-center w-full">
                        <div class="w-20 h-20 bg-white dark:bg-slate-800 rounded-2xl p-2 flex items-center justify-center mx-auto mb-3 shadow-md border border-slate-200 dark:border-slate-700 overflow-hidden">
                            <img src="https://clickfactoryphotography.com/wp-content/uploads/2022/04/crop-logo.gif" alt="Click Factory Logo" class="w-full h-full object-contain" onerror="this.src='https://placehold.co/80x80/4f46e5/ffffff?text=CF'">
                        </div>
                        <h2 class="font-bold text-lg text-slate-900 dark:text-white truncate">${state.currentUser.name}</h2>
                        <p class="text-xs text-slate-500 dark:text-slate-400 mb-2 truncate">@${state.currentUser.username}</p>
                        <span class="inline-block px-3.5 py-1 rounded-full text-xs font-semibold ${state.currentUser.role === 'admin' ? 'bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 border border-indigo-200/50 dark:border-indigo-800' : 'bg-emerald-50 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-400 border border-emerald-200/50 dark:border-emerald-800'}">
                            ${state.currentUser.role === 'admin' ? 'Administrator' : 'Regular User'}
                        </span>
                    </div>

                    ${state.currentUser.role === 'admin' ? `
                    <div class="bg-white dark:bg-slate-900 rounded-3xl p-4.5 sm:p-5 border border-slate-200 dark:border-slate-800 shadow-sm space-y-3 w-full">
                        <h3 class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider px-1">Admin Security</h3>
                        <button onclick="openChangePasswordModal()" class="w-full py-3 px-4 rounded-2xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 text-xs font-semibold transition flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-key"></i>
                            <span>Change Admin Password</span>
                        </button>
                    </div>
                    ` : ''}

                    <!-- Developer Attribution -->
                    <div class="text-center py-2 w-full">
                        <p class="text-[11px] font-medium text-slate-400 dark:text-slate-500">
                            Click Factory Expense Tracker • Developed by <span class="font-bold text-indigo-600 dark:text-indigo-400">SK Techmedia</span>
                        </p>
                    </div>
                </div>
            `;
        }

        function openChangePasswordModal() {
            const root = document.getElementById('modal-root');
            root.innerHTML = `
                <div class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn">
                    <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 max-w-sm w-full border border-slate-200 dark:border-slate-800 shadow-2xl space-y-4">
                        <div class="flex items-center justify-between">
                            <h3 class="font-bold text-base text-slate-900 dark:text-white">Change Admin Password</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <form onsubmit="handlePasswordChange(event)" class="space-y-3.5 w-full">
                            <div class="w-full">
                                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Current Password</label>
                                <input type="password" id="current-pass" required class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white">
                            </div>
                            <div class="w-full">
                                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">New Password</label>
                                <input type="password" id="new-pass" required class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white">
                            </div>
                            <div class="pt-2 w-full">
                                <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-2xl shadow-md transition text-sm">Update Password</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function handlePasswordChange(e) {
            e.preventDefault();
            const current = document.getElementById('current-pass').value;
            const newPass = document.getElementById('new-pass').value;

            if (current !== state.adminPassword) {
                showToast('Current password incorrect.', 'error');
                return;
            }

            if (!newPass || newPass.length < 4) {
                showToast('Password must be at least 4 characters long.', 'error');
                return;
            }

            state.adminPassword = newPass;
            const adminUser = state.users.find(u => u.role === 'admin');
            if (adminUser) adminUser.password = newPass;
            saveState();
            closeModal();
            showToast('Admin password updated successfully!', 'success');
        }

        function exportUserCSV(userId, userName) {
            const userExpenses = state.expenses.filter(e => e.userId === userId);
            downloadCSV(userExpenses, `${userName.replace(/\s+/g, '_')}_expenses.csv`);
        }

        function exportFilteredCSV() {
            let filtered = state.expenses.filter(exp => {
                if (state.filterUser !== 'All' && exp.userId !== state.filterUser) return false;
                if (state.filterCategory !== 'All' && exp.category !== state.filterCategory) return false;
                if (state.filterMonth !== 'All' && !exp.date.startsWith(state.filterMonth)) return false;
                return true;
            });
            downloadCSV(filtered, 'filtered_expenses_report.csv');
        }

        function exportAllCSV() {
            downloadCSV(state.expenses, 'all_company_expenses.csv');
        }

        function downloadCSV(dataArray, filename) {
            if (dataArray.length === 0) {
                showToast('No records available to export.', 'error');
                return;
            }

            const headers = ['ID', 'User', 'Title', 'Category', 'Client & Place', 'Amount (INR)', 'Date', 'Notes', 'Has Bill'];
            const rows = dataArray.map(e => [
                e.id,
                `"${e.userName || ''}"`,
                `"${(e.title || '').replace(/"/g, '""')}"`,
                e.category,
                `"${(e.clientNamePlace || '').replace(/"/g, '""')}"`,
                e.amount,
                e.date,
                `"${(e.notes || '').replace(/"/g, '""')}"`,
                e.billAttachment ? 'Yes' : 'No'
            ]);

            const csvContent = 'data:text/csv;charset=utf-8,' + 
                [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
            
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement('a');
            link.setAttribute('href', encodedUri);
            link.setAttribute('download', filename);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            showToast(`Successfully exported ${dataArray.length} records to CSV!`, 'success');
        }

        function showConfirmModal(title, message, onConfirm) {
            const root = document.getElementById('modal-root');
            root.innerHTML = `
                <div class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn">
                    <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 max-w-sm w-full border border-slate-200 dark:border-slate-800 shadow-2xl space-y-4">
                        <div class="w-12 h-12 rounded-2xl bg-rose-500/10 text-rose-600 flex items-center justify-center text-xl mx-auto">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                        </div>
                        <div class="text-center">
                            <h3 class="font-bold text-base text-slate-900 dark:text-white mb-1">${title}</h3>
                            <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">${message}</p>
                        </div>
                        <div class="grid grid-cols-2 gap-3 pt-2">
                            <button onclick="closeModal()" class="py-3 px-4 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs font-semibold">
                                Cancel
                            </button>
                            <button id="modal-confirm-btn" class="py-3 px-4 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold shadow-md">
                                Confirm
                            </button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('modal-confirm-btn').onclick = () => {
                closeModal();
                onConfirm();
            };
        }

        function closeModal() {
            if (window.activeCameraStream) {
                window.activeCameraStream.getTracks().forEach(track => track.stop());
                window.activeCameraStream = null;
            }
            document.getElementById('modal-root').innerHTML = '';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Initialize App on load
        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
