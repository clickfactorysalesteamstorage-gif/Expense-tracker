<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Click Factory Expense Tracker</title>
    <!-- Web App Manifest & Home Screen Icons -->
    <link rel="icon" type="image/gif" href="https://clickfactoryphotography.com/wp-content/uploads/2022/04/crop-logo.gif">
    <link rel="apple-touch-icon" href="https://clickfactoryphotography.com/wp-content/uploads/2022/04/crop-logo.gif">
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Expense%20tracker%22%2C%22short_name%22%3A%22ExpenseTracker%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f172a%22%2C%22theme_color%22%3A%22%234f46e5%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fclickfactoryphotography.com%2Fwp-content%2Fuploads%2F2022%2F04%2Fcrop-logo.gif%22%2C%22sizes%22%3A%22192x192%20512x512%22%2C%22type%22%3A%22image%2Fgif%22%7D%5D%7D">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        *, ::before, ::after { box-sizing: border-box; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            margin: 0; padding: 0; width: 100vw;
            overflow-x: hidden; word-wrap: break-word; overflow-wrap: break-word;
            background-color: #0f172a;
        }
        input[type="date"], select { appearance: none; -webkit-appearance: none; min-height: 48px; }
        .app-container {
            width: 100%; max-width: 100%; min-height: 100vh;
            background-color: #f8fafc; display: flex; flex-direction: column;
            padding-top: max(env(safe-area-inset-top), 12px);
        }
        @media (min-width: 640px) {
            .app-container {
                max-width: 520px; min-height: 92vh; margin: 4vh auto;
                border-radius: 2.5rem; overflow: hidden;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
                border: 8px solid #1e293b; padding-top: 0;
            }
        }
        .logo-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            object-position: center;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 dark:text-slate-100 flex flex-col justify-center items-center h-full selection:bg-indigo-500 selection:text-white">

    <div id="app" class="app-container w-full flex flex-col relative dark:bg-slate-950 transition-colors duration-200">
        <!-- Loader during Firebase initialization with brand logo -->
        <div class="flex-1 flex flex-col items-center justify-center p-6 text-center animate-fadeIn">
            <div class="relative w-28 h-28 flex items-center justify-center mx-auto mb-6 logo-container">
                <div class="absolute inset-0 rounded-3xl bg-indigo-500/20 dark:bg-indigo-500/10 animate-ping"></div>
                <img src="https://clickfactoryphotography.com/wp-content/uploads/2022/04/crop-logo.gif" alt="Click Factory Logo" class="relative w-24 h-24 object-contain drop-shadow-md animate-pulse" onerror="this.src='https://placehold.co/96x96/4f46e5/ffffff?text=CF'">
            </div>
            
            <div class="flex items-center space-x-2 mb-3">
                <div class="w-2 h-2 rounded-full bg-indigo-600 animate-bounce [animation-delay:-0.3s]"></div>
                <div class="w-2 h-2 rounded-full bg-indigo-600 animate-bounce [animation-delay:-0.15s]"></div>
                <div class="w-2 h-2 rounded-full bg-indigo-600 animate-bounce"></div>
            </div>

            <h2 class="font-bold text-base text-slate-800 dark:text-white tracking-tight">Click Factory</h2>
            <p class="text-xs font-medium text-slate-500 dark:text-slate-400 mt-1">Loading Expense Tracker...</p>
        </div>
    </div>

    <!-- Notification Toast Container -->
    <div id="toast-container" class="fixed top-12 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none w-11/12 max-w-sm"></div>

    <!-- Firebase SDK Modular Imports via ESM CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, setDoc, doc, deleteDoc, updateDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref as storageRef, uploadString, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDguDaGIQ8dbwLoqbXKDD4ixfPg7y3VCpg",
            authDomain: "expensetracker-ec267.firebaseapp.com",
            projectId: "expensetracker-ec267",
            storageBucket: "expensetracker-ec267.firebasestorage.app",
            messagingSenderId: "789003178398",
            appId: "1:789003178398:web:1579e411ad728268c6468f"
        };

        const firebaseApp = initializeApp(firebaseConfig);
        const db = getFirestore(firebaseApp);
        const storage = getStorage(firebaseApp);

        // Expose Firebase tools globally for app execution
        window.FB = { db, storage, collection, getDocs, setDoc, doc, deleteDoc, updateDoc, onSnapshot, query, orderBy, storageRef, uploadString, getDownloadURL, deleteObject };

        // Seed Default Data if Firestore is empty on boot
        async function initializeFirestoreData() {
            try {
                const usersSnap = await getDocs(collection(db, 'users'));
                if (usersSnap.empty) {
                    const defaultUsers = [
                        { id: 'usr_adm', name: 'Admin Manager', username: 'admin', password: 'adminpassword', role: 'admin', email: 'admin@clickfactory.com' },
                        { id: 'usr_1', name: 'User One', username: 'user1', password: 'password', role: 'user', email: 'user1@clickfactory.com' },
                        { id: 'usr_2', name: 'User Two', username: 'user2', password: 'password', role: 'user', email: 'user2@clickfactory.com' }
                    ];
                    for (const u of defaultUsers) {
                        await setDoc(doc(db, 'users', u.id), u);
                    }
                    await setDoc(doc(db, 'settings', 'admin_pass'), { password: 'adminpassword' });
                }
            } catch (err) {
                console.error("Firestore initialization warning:", err);
            }
        }

        initializeFirestoreData().then(() => {
            window.startAppListeners();
        });
    </script>

    <script>
        const LOCAL_STORAGE_KEY = 'click_factory_current_user_v23';

        let state = {
            currentUser: null,
            adminPassword: 'adminpassword',
            users: [],
            expenses: [],
            recycleBin: [],
            passwordRequests: [],
            activeTab: 'home',
            filterCategory: 'All',
            filterMonth: 'All',
            filterUser: 'All',
            searchQuery: '',
            darkMode: true,
            editingExpenseId: null,
            tempBillData: null,
            tempFormCache: null,
            authView: 'login'
        };

        // Restore active user session from local storage
        const savedUser = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (savedUser) {
            try { state.currentUser = JSON.parse(savedUser); } catch(e) {}
        }

        window.startAppListeners = function() {
            const { db, collection, onSnapshot } = window.FB;

            // Real-time Users Listener
            onSnapshot(collection(db, 'users'), (snapshot) => {
                state.users = snapshot.docs.map(docSnap => docSnap.data());
                render();
            }, (err) => console.error("Users listener error:", err));

            // Real-time Expenses Listener
            onSnapshot(collection(db, 'expenses'), (snapshot) => {
                state.expenses = snapshot.docs.map(docSnap => docSnap.data());
                render();
            }, (err) => console.error("Expenses listener error:", err));

            // Real-time Recycle Bin Listener
            onSnapshot(collection(db, 'recycleBin'), (snapshot) => {
                state.recycleBin = snapshot.docs.map(docSnap => docSnap.data());
                render();
            }, (err) => console.error("Recycle bin listener error:", err));

            // Real-time Password Requests Listener
            onSnapshot(collection(db, 'passwordRequests'), (snapshot) => {
                state.passwordRequests = snapshot.docs.map(docSnap => docSnap.data());
                render();
            }, (err) => console.error("Requests listener error:", err));
        };

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-600 text-white' : type === 'error' ? 'bg-rose-600 text-white' : 'bg-slate-800 text-white';
            const icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-info';
            
            toast.className = `${bgClass} px-4 py-3 rounded-2xl shadow-xl flex items-center space-x-3 text-sm font-medium transform transition-all duration-300 translate-y-[-20px] opacity-0 pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-lg shrink-0"></i><span class="flex-1 break-words">${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-[-20px]', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-[-20px]', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function formatCurrency(amount) {
            return '₹' + Number(amount).toLocaleString('en-IN');
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            return new Date(dateString).toLocaleDateString('en-IN', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function formatMonthName(yearMonth) {
            if (!yearMonth || yearMonth === 'All') return 'All Months';
            const [year, month] = yearMonth.split('-');
            return new Date(year, month - 1, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
        }

        function updateFormCache() {
            const clientInput = document.getElementById('expense-client');
            const amountInput = document.getElementById('expense-amount');
            const titleInput = document.getElementById('expense-title');
            const dateInput = document.getElementById('expense-date');
            const notesInput = document.getElementById('expense-notes');
            const categoryInput = document.getElementById('expense-category');

            state.tempFormCache = {
                category: categoryInput ? categoryInput.value : 'Office',
                clientNamePlace: clientInput ? clientInput.value : '',
                amount: amountInput ? amountInput.value : '',
                title: titleInput ? titleInput.value : '',
                date: dateInput ? dateInput.value : new Date().toISOString().split('T')[0],
                notes: notesInput ? notesInput.value : ''
            };
        }

        function render() {
            const app = document.getElementById('app');
            if (!app) return;
            
            if (state.darkMode) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }

            if (!state.currentUser) {
                app.innerHTML = state.authView === 'forgot' ? renderForgotPasswordPage() : renderLoginPage();
                return;
            }

            const isAdmin = state.currentUser.role === 'admin';

            app.innerHTML = `
                <header class="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 sm:px-6 pt-3 pb-3 flex items-center justify-between w-full shadow-sm">
                    <div class="flex items-center space-x-3 min-w-0 flex-1 pr-2">
                        <div class="w-10 h-10 flex items-center justify-center overflow-hidden shrink-0 logo-container">
                            <img src="https://clickfactoryphotography.com/wp-content/uploads/2022/04/crop-logo.gif" alt="Click Factory Logo" class="w-full h-full object-contain" onerror="this.src='https://placehold.co/40x40/4f46e5/ffffff?text=CF'">
                        </div>
                        <div class="min-w-0 flex-1">
                            <h1 class="font-bold text-sm sm:text-base leading-tight tracking-tight text-slate-900 dark:text-white truncate">Click Factory</h1>
                            <p class="text-[11px] text-slate-500 dark:text-slate-400 font-medium truncate">
                                ${isAdmin ? '<span class="text-indigo-600 dark:text-indigo-400 font-semibold"><i class="fa-solid fa-shield-halved mr-1"></i>Admin</span>' : 'Cloud Expense Tracker'}
                            </p>
                        </div>
                    </div>
                    
                    <div class="flex items-center space-x-2 shrink-0">
                        <button onclick="toggleDarkMode()" class="w-10 h-10 rounded-2xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition">
                            <i class="fa-solid ${state.darkMode ? 'fa-sun text-amber-400' : 'fa-moon text-slate-600'} text-sm"></i>
                        </button>
                        <button onclick="confirmLogout()" class="w-10 h-10 rounded-2xl bg-rose-50 dark:bg-rose-950/50 flex items-center justify-center text-rose-600 dark:text-rose-400 hover:bg-rose-100 transition border border-rose-200/50 dark:border-rose-800/50" title="Logout">
                            <i class="fa-solid fa-arrow-right-from-bracket text-sm"></i>
                        </button>
                    </div>
                </header>

                <main class="flex-1 overflow-y-auto pb-36 pt-4 px-4 sm:px-6 w-full max-w-full">
                    ${renderActiveTabContent()}
                </main>

                ${state.activeTab !== 'add' ? `
                <button onclick="switchTab('add')" class="fixed sm:absolute bottom-20 right-5 z-40 w-14 h-14 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white rounded-full shadow-2xl flex items-center justify-center text-xl transition transform hover:scale-105 active:scale-95" title="Add New Expense">
                    <i class="fa-solid fa-plus"></i>
                </button>
                ` : ''}

                <nav class="fixed sm:absolute bottom-0 left-0 right-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 px-2 py-2.5 flex items-center justify-around shadow-2xl w-full">
                    <button onclick="switchTab('home')" class="flex flex-col items-center justify-center flex-1 py-1 transition ${state.activeTab === 'home' ? 'text-indigo-600 dark:text-indigo-400 font-semibold' : 'text-slate-400 dark:text-slate-500 hover:text-slate-600'}">
                        <i class="fa-solid fa-house text-base mb-1"></i>
                        <span class="text-[10px] tracking-tight">Expenses</span>
                    </button>

                    ${isAdmin ? `
                    <button onclick="switchTab('admin')" class="flex flex-col items-center justify-center flex-1 py-1 transition ${state.activeTab === 'admin' ? 'text-indigo-600 dark:text-indigo-400 font-semibold' : 'text-slate-400 dark:text-slate-500 hover:text-slate-600'}">
                        <i class="fa-solid fa-chart-pie text-base mb-1"></i>
                        <span class="text-[10px] tracking-tight">Summary</span>
                    </button>
                    <button onclick="switchTab('recycle')" class="flex flex-col items-center justify-center flex-1 py-1 transition relative ${state.activeTab === 'recycle' ? 'text-indigo-600 dark:text-indigo-400 font-semibold' : 'text-slate-400 dark:text-slate-500 hover:text-slate-600'}">
                        <i class="fa-solid fa-trash-can text-base mb-1"></i>
                        <span class="text-[10px] tracking-tight">Bin</span>
                        ${state.recycleBin.length > 0 ? `<span class="absolute top-1 right-3 w-2 h-2 rounded-full bg-amber-500"></span>` : ''}
                    </button>
                    <button onclick="switchTab('requests')" class="flex flex-col items-center justify-center flex-1 py-1 transition relative ${state.activeTab === 'requests' ? 'text-indigo-600 dark:text-indigo-400 font-semibold' : 'text-slate-400 dark:text-slate-500 hover:text-slate-600'}">
                        <i class="fa-solid fa-key text-base mb-1"></i>
                        <span class="text-[10px] tracking-tight">Requests</span>
                        ${state.passwordRequests.filter(r => r.status === 'pending').length > 0 ? `<span class="absolute top-1 right-3 w-2 h-2 rounded-full bg-rose-500"></span>` : ''}
                    </button>
                    <button onclick="switchTab('users')" class="flex flex-col items-center justify-center flex-1 py-1 transition ${state.activeTab === 'users' ? 'text-indigo-600 dark:text-indigo-400 font-semibold' : 'text-slate-400 dark:text-slate-500 hover:text-slate-600'}">
                        <i class="fa-solid fa-users text-base mb-1"></i>
                        <span class="text-[10px] tracking-tight">Users</span>
                    </button>
                    ` : `
                    <button onclick="switchTab('analytics')" class="flex flex-col items-center justify-center flex-1 py-1 transition ${state.activeTab === 'analytics' ? 'text-indigo-600 dark:text-indigo-400 font-semibold' : 'text-slate-400 dark:text-slate-500 hover:text-slate-600'}">
                        <i class="fa-solid fa-chart-column text-base mb-1"></i>
                        <span class="text-[10px] tracking-tight">Summary</span>
                    </button>
                    `}

                    <button onclick="switchTab('profile')" class="flex flex-col items-center justify-center flex-1 py-1 transition ${state.activeTab === 'profile' ? 'text-indigo-600 dark:text-indigo-400 font-semibold' : 'text-slate-400 dark:text-slate-500 hover:text-slate-600'}">
                        <i class="fa-solid fa-user-circle text-base mb-1"></i>
                        <span class="text-[10px] tracking-tight">Profile</span>
                    </button>
                </nav>

                <div id="modal-root"></div>
            `;
        }

        function renderLoginPage() {
            return `
                <div class="flex-1 flex flex-col justify-center px-4 py-8 animate-fadeIn max-w-sm mx-auto w-full">
                    <div class="text-center mb-6">
                        <div class="w-20 h-20 flex items-center justify-center mx-auto mb-2 logo-container">
                            <img src="https://clickfactoryphotography.com/wp-content/uploads/2022/04/crop-logo.gif" alt="Click Factory Logo" class="w-full h-full object-contain" onerror="this.src='https://placehold.co/80x80/4f46e5/ffffff?text=CF'">
                        </div>
                        <h2 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Click Factory</h2>
                        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Expense Management Portal</p>
                    </div>

                    <div class="bg-white dark:bg-slate-900 py-8 px-6 shadow-xl rounded-3xl border border-slate-200 dark:border-slate-800 space-y-5 w-full">
                        <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
                            <div class="w-full">
                                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Username</label>
                                <div class="relative w-full">
                                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                        <i class="fa-solid fa-user text-sm"></i>
                                    </span>
                                    <input type="text" id="login-username" required placeholder="Enter username" class="w-full pl-10 pr-4 py-3.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white">
                                </div>
                            </div>

                            <div class="w-full">
                                <div class="flex items-center justify-between mb-1.5">
                                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider">Password</label>
                                    <button type="button" onclick="setAuthView('forgot')" class="text-xs text-indigo-600 dark:text-indigo-400 font-semibold hover:underline">Forgot Password?</button>
                                </div>
                                <div class="relative w-full">
                                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                        <i class="fa-solid fa-lock text-sm"></i>
                                    </span>
                                    <input type="password" id="login-password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-3.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white">
                                </div>
                            </div>

                            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-semibold rounded-2xl shadow-lg shadow-indigo-500/25 transition text-sm flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-right-to-bracket"></i>
                                <span>Sign In</span>
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderForgotPasswordPage() {
            return `
                <div class="flex-1 flex flex-col justify-center px-4 py-8 animate-fadeIn max-w-sm mx-auto w-full">
                    <div class="text-center mb-6">
                        <div class="w-16 h-16 bg-indigo-50 dark:bg-indigo-950/60 rounded-3xl flex items-center justify-center mx-auto mb-4 text-indigo-600 dark:text-indigo-400 text-2xl shadow-sm border border-indigo-200 dark:border-indigo-800">
                            <i class="fa-solid fa-key"></i>
                        </div>
                        <h2 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Password Recovery</h2>
                        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Request a recovery code from Admin</p>
                    </div>

                    <div class="bg-white dark:bg-slate-900 py-8 px-6 shadow-xl rounded-3xl border border-slate-200 dark:border-slate-800 space-y-4 w-full">
                        <form onsubmit="handleForgotPasswordSubmit(event)" class="space-y-4">
                            <div class="w-full">
                                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Username</label>
                                <input type="text" id="forgot-username" required placeholder="Enter your username" class="w-full px-4 py-3.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white">
                            </div>

                            <div class="w-full">
                                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Admin Auth Code (6-digit)</label>
                                <input type="text" id="forgot-auth-code" maxlength="6" placeholder="Enter code provided by Admin" class="w-full px-4 py-3.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm tracking-widest text-center font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white">
                            </div>

                            <div class="w-full">
                                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">New Password</label>
                                <input type="password" id="forgot-new-password" required placeholder="Enter new password" class="w-full px-4 py-3.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white">
                            </div>

                            <div class="flex flex-col gap-2.5 pt-1 w-full">
                                <button type="button" onclick="requestAdminAuthCode()" class="w-full py-3 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-indigo-600 dark:text-indigo-400 font-semibold rounded-2xl transition text-xs border border-slate-200 dark:border-slate-700">
                                    <i class="fa-solid fa-paper-plane mr-1.5"></i> Request Code from Admin
                                </button>
                                <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-2xl shadow-lg shadow-indigo-500/25 transition text-sm">
                                    Reset Password with Code
                                </button>
                            </div>
                        </form>

                        <div class="text-center pt-2">
                            <button type="button" onclick="setAuthView('login')" class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline">
                                <i class="fa-solid fa-arrow-left mr-1"></i> Back to Sign In
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function setAuthView(view) {
            state.authView = view;
            render();
        }

        async function requestAdminAuthCode() {
            const usernameInput = document.getElementById('forgot-username');
            const username = usernameInput ? usernameInput.value.trim().toLowerCase() : '';
            if (!username) {
                showToast('Please enter your username first.', 'error');
                return;
            }

            const user = state.users.find(u => u.username.toLowerCase() === username);
            if (!user) {
                showToast('Username not found in system.', 'error');
                return;
            }

            let existingReq = state.passwordRequests.find(r => r.username.toLowerCase() === username && r.status === 'pending');
            let code = existingReq ? existingReq.code : Math.floor(100000 + Math.random() * 900000).toString();
            const reqId = existingReq ? existingReq.id : 'req_' + Date.now();

            const reqObj = {
                id: reqId,
                username: user.username,
                name: user.name,
                code: code,
                status: 'pending',
                createdAt: existingReq ? existingReq.createdAt : new Date().toISOString()
            };

            const { db, doc, setDoc } = window.FB;
            await setDoc(doc(db, 'passwordRequests', reqId), reqObj);
            showToast('Code requested successfully! Contact Admin for your 6-digit code.', 'success');
        }

        async function handleForgotPasswordSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('forgot-username').value.trim().toLowerCase();
            const authCode = document.getElementById('forgot-auth-code').value.trim();
            const newPassword = document.getElementById('forgot-new-password').value;

            const user = state.users.find(u => u.username.toLowerCase() === username);
            if (!user) {
                showToast('Username not found.', 'error');
                return;
            }

            const req = state.passwordRequests.find(r => r.username.toLowerCase() === username && r.status === 'pending');
            if (!req || req.code !== authCode) {
                showToast('Invalid or unapproved code.', 'error');
                return;
            }

            if (!newPassword || newPassword.length < 4) {
                showToast('Password must be at least 4 characters.', 'error');
                return;
            }

            const { db, doc, updateDoc } = window.FB;
            user.password = newPassword;
            await updateDoc(doc(db, 'users', user.id), { password: newPassword });
            await updateDoc(doc(db, 'passwordRequests', req.id), { status: 'approved' });

            showToast('Password reset successfully! Please sign in.', 'success');
            setAuthView('login');
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim().toLowerCase();
            const password = document.getElementById('login-password').value;

            const foundUser = state.users.find(u => u.username.toLowerCase() === username && u.password === password);
            if (foundUser) {
                state.currentUser = foundUser;
                state.activeTab = 'home';
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(foundUser));
                showToast(`Welcome back, ${foundUser.name}!`, 'success');
                render();
            } else {
                showToast('Invalid username or password.', 'error');
            }
        }

        function confirmLogout() {
            showConfirmModal(
                'Sign Out',
                'Are you sure you want to sign out from your account?',
                () => {
                    handleLogout();
                }
            );
        }

        function handleLogout() {
            state.currentUser = null;
            state.tempFormCache = null;
            localStorage.removeItem(LOCAL_STORAGE_KEY);
            showToast('Logged out successfully.', 'info');
            render();
        }

        function renderActiveTabContent() {
            switch(state.activeTab) {
                case 'home': return renderHomeTab();
                case 'add': return renderAddEditTab();
                case 'admin': return state.currentUser.role === 'admin' ? renderAdminTab() : renderHomeTab();
                case 'recycle': return state.currentUser.role === 'admin' ? renderRecycleBinTab() : renderHomeTab();
                case 'requests': return state.currentUser.role === 'admin' ? renderPasswordRequestsTab() : renderHomeTab();
                case 'users': return state.currentUser.role === 'admin' ? renderUserManagementTab() : renderHomeTab();
                case 'analytics': return renderUserAnalyticsTab();
                case 'profile': return renderProfileTab();
                default: return renderHomeTab();
            }
        }

        function switchTab(tab) {
            state.activeTab = tab;
            state.editingExpenseId = null;
            state.tempBillData = null;
            state.tempFormCache = null;
            render();
        }

        function toggleDarkMode() {
            state.darkMode = !state.darkMode;
            render();
        }

        function renderHomeTab() {
            const isAdmin = state.currentUser.role === 'admin';
            
            let filtered = state.expenses.filter(exp => {
                if (!isAdmin && exp.userId !== state.currentUser.id) return false;
                if (isAdmin && state.filterUser !== 'All' && exp.userId !== state.filterUser) return false;
                if (state.filterCategory !== 'All' && exp.category !== state.filterCategory) return false;
                if (state.filterMonth !== 'All' && !exp.date.startsWith(state.filterMonth)) return false;
                if (state.searchQuery.trim() !== '') {
                    const q = state.searchQuery.toLowerCase();
                    const matchTitle = exp.title.toLowerCase().includes(q);
                    const matchNotes = exp.notes && exp.notes.toLowerCase().includes(q);
                    const matchUser = exp.userName.toLowerCase().includes(q);
                    const matchClient = exp.clientNamePlace && exp.clientNamePlace.toLowerCase().includes(q);
                    if (!matchTitle && !matchNotes && !matchUser && !matchClient) return false;
                }
                return true;
            });

            filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

            const totalAmount = filtered.reduce((sum, e) => sum + e.amount, 0);
            const officeTotal = filtered.filter(e => e.category === 'Office').reduce((sum, e) => sum + e.amount, 0);

                        <div class="grid grid-cols-2 gap-3 mt-4 pt-4 border-t border-white/15">

                            <button onclick="setFilterCategory('Shoot')" class="px-4 py-2 rounded-2xl text-xs font-medium whitespace-nowrap transition shrink-0 ${state.filterCategory === 'Shoot' ? 'bg-indigo-600 text-white shadow-md' : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800'}">Shoot Expense</button>

                                            <i class="fa-solid ${isOffice ? 'fa-briefcase' : 'fa-clapperboard'}"></i>

                                                <span><i class="fa-regular fa-calendar mr-1"></i>${formatDate(exp.date)}</span>
                                                <span>•</span>
                                                <span class="font-medium text-indigo-600 dark:text-indigo-400">${exp.category}</span>
                                                <span>•</span>
                                                <span class="italic text-slate-600 dark:text-slate-300 break-all">${escapeHtml(exp.userName)}</span>
                                            </div>

                                            ${!isOffice && exp.clientNamePlace ? `

                                                        </button>

                                                        <button onclick="confirmDeleteExpense('${exp.id}', '${exp.billAttachment || ''}')" class="w-8 h-8 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-rose-50 hover:text-rose-600 transition flex items-center justify-center text-xs" title="Delete"><i class="fa-solid fa-trash"></i></button>
                                                    </div>
                                                ` : ''}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            `;

                    </div>
                </div>
            `;
        }

            const input = document.getElementById('search-input');
            const cursorPos = input ? input.selectionStart : 0;
            render();
            const newInput = document.getElementById('search-input');
            if (newInput) {
                newInput.focus();
                newInput.setSelectionRange(cursorPos, cursorPos);
            }
        }

        function clearSearch() {
            state.searchQuery = '';
            render();
        }

        function setFilterMonth(month) { state.filterMonth = month; render(); }
        function setFilterUser(userId) { state.filterUser = userId; render(); }

                            <input type="hidden" id="expense-category" value="${expense.category}">

                            <div class="relative w-full">
                                <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400"><i class="fa-solid fa-location-dot text-sm"></i></span>
                                <input type="text" id="expense-client" value="${escapeHtml(expense.clientNamePlace || '')}" oninput="updateFormCache()" placeholder="e.g., Acme Corp / Studio Location" class="w-full pl-10 pr-4 py-3.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white">
                            </div>
                        </div>

                        <div class="w-full">
                            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2.5">Amount (₹)</label>
                            <div class="relative w-full">
                                <span class="absolute inset-y-0 left-0 pl-4 flex items-center font-bold text-slate-400">₹</span>
                                <input type="number" id="expense-amount" value="${expense.amount}" oninput="updateFormCache()" required min="1" step="any" placeholder="0.00" class="w-full pl-9 pr-4 py-3.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-base font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white">
                            </div>
                        </div>

                        <div class="w-full">
                            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2.5">Title / Description</label>
                            <input type="text" id="expense-title" value="${escapeHtml(expense.title)}" oninput="updateFormCache()" required placeholder="e.g., Studio Rent, Camera Rental" class="w-full px-4 py-3.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white">

        function handleBillUpload(event) {
            updateFormCache();
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(uploadEvent) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const maxDim = 800;

                    if (width > height && width > maxDim) {
                        height = Math.round((height * maxDim) / width);
                        width = maxDim;
                    } else if (height > maxDim) {
                        width = Math.round((width * maxDim) / height);
                        height = maxDim;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    state.tempBillData = canvas.toDataURL('image/jpeg', 0.8);
                    showToast('Bill attached successfully!', 'success');
                    render();
                };
                img.src = uploadEvent.target.result;
            };
            reader.readAsDataURL(file);
        }

            `;

            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
                .then(stream => {
                    window.activeCameraStream = stream;
                    document.getElementById('camera-stream').srcObject = stream;
                })
                .catch(err => {
                    showToast('Unable to access device camera.', 'error');

        function takeSnapshot() {
            const videoElement = document.getElementById('camera-stream');
            const canvasElement = document.getElementById('camera-canvas');
            if (!videoElement) return;

            let width = videoElement.videoWidth || 640;
            let height = videoElement.videoHeight || 480;
            const maxDim = 800;

            if (width > height && width > maxDim) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
            } else if (height > maxDim) {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
            }

            canvasElement.width = width;
            canvasElement.height = height;
            canvasElement.getContext('2d').drawImage(videoElement, 0, 0, width, height);

            state.tempBillData = canvasElement.toDataURL('image/jpeg', 0.8);
            if (window.activeCameraStream) {
                window.activeCameraStream.getTracks().forEach(track => track.stop());
                window.activeCameraStream = null;
            }
            closeModal();
            showToast('Bill captured!', 'success');
            render();
        }

        async function handleExpenseSubmit(event) {
            event.preventDefault();
            const category = document.getElementById('expense-category').value;
            const amount = parseFloat(document.getElementById('expense-amount').value);
            const title = document.getElementById('expense-title').value.trim();
            const date = document.getElementById('expense-date').value;
            const clientNamePlace = category === 'Shoot' ? document.getElementById('expense-client').value.trim() : '';
            const notes = document.getElementById('expense-notes').value.trim();

            if (!title || isNaN(amount) || amount <= 0 || !date) {
                showToast('Please fill in all required fields.', 'error');
                return;
            }

            showToast('Uploading bill and syncing with Database...', 'info');
            const { db, storage, doc, setDoc, storageRef, uploadString, getDownloadURL } = window.FB;

            let expenseId = state.editingExpenseId || ('exp_' + Date.now());
            let billUrl = null;

            try {
                if (state.tempBillData !== null) {
                    if (state.tempBillData.startsWith('data:image')) {
                        try {
                            const fileRef = storageRef(storage, `bills/${expenseId}.jpg`);
                            await uploadString(fileRef, state.tempBillData, 'data_url');
                            billUrl = await getDownloadURL(fileRef);
                        } catch (storageErr) {
                            console.warn("Storage upload restricted or failed, falling back to direct base64 storage:", storageErr);
                            billUrl = state.tempBillData;
                        }
                    } else {
                        billUrl = state.tempBillData;
                    }
                } else if (state.editingExpenseId) {
                    const existing = state.expenses.find(e => e.id === expenseId);
                    billUrl = existing ? existing.billAttachment : null;
                }

                const expenseData = {
                    id: expenseId,
                    userId: state.currentUser.id,
                    userName: state.currentUser.name,
                    title,
                    amount,
                    category,
                    date,
                    clientNamePlace,
                    notes,
                    billAttachment: billUrl,
                    createdAt: state.editingExpenseId ? (state.expenses.find(e => e.id === expenseId)?.createdAt || new Date().toISOString()) : new Date().toISOString()
                };

                await setDoc(doc(db, 'expenses', expenseId), expenseData);

                state.editingExpenseId = null;
                state.tempBillData = null;
                state.tempFormCache = null;
                showToast('Expense saved !', 'success');
                switchTab('home');
            } catch (error) {
                console.error("Failed:", error);
                showToast('Failed to save. Please check connection.', 'error');
            }
        }

        function exportFilteredCSV() {
            let filtered = state.expenses.filter(exp => {
                if (state.filterUser !== 'All' && exp.userId !== state.filterUser) return false;
                if (state.filterCategory !== 'All' && exp.category !== state.filterCategory) return false;

                return true;
            });
            downloadCSV(filtered, 'filtered_expenses_report.csv');

        function downloadCSV(dataArray, filename) {
            if (dataArray.length === 0) {
                showToast('No records available to export.', 'error');
                return;
            }
            const headers = ['ID', 'User', 'Title', 'Category', 'Client & Place', 'Amount (INR)', 'Date', 'Notes', 'Has Bill'];
            const rows = dataArray.map(e => [
                e.id, `"${e.userName || ''}"`, `"${(e.title || '').replace(/"/g, '""')}"`, e.category,
                `"${(e.clientNamePlace || '').replace(/"/g, '""')}"`, e.amount, e.date, `"${(e.notes || '').replace(/"/g, '""')}"`, e.billAttachment ? 'Yes' : 'No'
            ]);
            const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
            const link = document.createElement('a');
            link.setAttribute('href', encodeURI(csvContent));
            link.setAttribute('download', filename);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast(`Exported ${dataArray.length} records!`, 'success');
        }

            const root = document.getElementById('modal-root');
            root.innerHTML = `
                <div class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn">
                    <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 max-w-sm w-full border border-slate-200 dark:border-slate-800 shadow-2xl space-y-4">
                        <div class="w-12 h-12 rounded-2xl bg-rose-500/10 text-rose-600 flex items-center justify-center text-xl mx-auto"><i class="fa-solid fa-triangle-exclamation"></i></div>
                        <div class="text-center"><h3 class="font-bold text-base text-slate-900 dark:text-white mb-1">${escapeHtml(title)}</h3><p class="text-xs text-slate-500 dark:text-slate-400">${escapeHtml(message)}</p></div>
                        <div class="grid grid-cols-2 gap-3 pt-2">
                            <button onclick="closeModal()" class="py-3 px-4 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs font-semibold">Cancel</button>
                            <button id="modal-confirm-btn" class="py-3 px-4 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold shadow-md">Confirm</button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('modal-confirm-btn').onclick = () => { closeModal(); onConfirm(); };
        }

        function closeModal() {
            if (window.activeCameraStream) {
                window.activeCameraStream.getTracks().forEach(track => track.stop());
                window.activeCameraStream = null;
            }
            const root = document.getElementById('modal-root');
            if (root) root.innerHTML = '';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
