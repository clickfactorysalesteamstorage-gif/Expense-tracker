                            700: '#4338ca',

        };

        (function() {
            const savedTheme = localStorage.getItem('click_factory_theme_v1') || 'system';
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = savedTheme === 'dark' || (savedTheme === 'system' && prefersDark);
            if (isDark) {
                document.documentElement.classList.add('dark');
                document.getElementById('meta-theme-color')?.setAttribute('content', '#020617');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('meta-theme-color')?.setAttribute('content', '#f8fafc');
            }
        })();

    <style>
        *, ::before, ::after { box-sizing: border-box; }
        
        @media (min-width: 769px) and (hover: hover) {
            * {
                scrollbar-width: thin;
                scrollbar-color: rgba(148, 163, 184, 0.35) transparent;
            }
            .dark * {
                scrollbar-color: rgba(99, 102, 241, 0.35) transparent;
            }
            ::-webkit-scrollbar {
                width: 6px;
                height: 6px;
            }
            ::-webkit-scrollbar-track {
                background: transparent;
                margin: 6px 0;
            }
            ::-webkit-scrollbar-thumb {
                background-color: rgba(148, 163, 184, 0.4);
                border-radius: 9999px;
                border: 1.5px solid transparent;
                background-clip: content-box;
                transition: background-color 0.2s ease;
            }
            ::-webkit-scrollbar-thumb:hover {
                background-color: rgba(99, 102, 241, 0.75);
            }
            .dark ::-webkit-scrollbar-thumb {
                background-color: rgba(148, 163, 184, 0.25);
            }
            .dark ::-webkit-scrollbar-thumb:hover {
                background-color: rgba(129, 140, 248, 0.65);
            }
        }

        @media (max-width: 768px), (hover: none) {
            * {
                -ms-overflow-style: none !important;
                scrollbar-width: none !important;
            }
            *::-webkit-scrollbar {
                display: none !important;
                width: 0 !important;
                height: 0 !important;
            }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none !important;
        }
        .no-scrollbar {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }

        html, body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            margin: 0; padding: 0; width: 100%;
            height: 100%; height: 100dvh;
            overflow: hidden; word-wrap: break-word; overflow-wrap: break-word;
            background-color: #f8fafc;
            transition: background-color 0.25s ease, color 0.25s ease;
        }
        html.dark, .dark body {
            background-color: #020617;
        }
        input[type="date"], select { appearance: none; -webkit-appearance: none; }
        
        .app-container {
            width: 100%; max-width: 100%;
            flex: 1; min-height: 0;
            overflow: hidden;
            background-color: #f8fafc; display: flex; flex-direction: column;
            padding-top: 0;
            transition: background-color 0.25s ease, color 0.25s ease;
        }
        .dark .app-container {
            background-color: #020617;
        }

        /* Top Header Styles */
        .ios-header {
            flex-shrink: 0;
            padding-top: calc(env(safe-area-inset-top, 0px) + 16px);
            padding-bottom: 12px;
            background-color: #f8fafc;
            position: relative;
            z-index: 45;
            transition: background-color 0.25s ease;
        }
        .dark .ios-header {
            background-color: #020617;
        }

        /* Main Content Viewport */
        #main-content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
            position: relative;
            padding-top: 8px;
        }

        /* Pull-to-Refresh Container Fixed Above Scroll View */
        #ptr-container {
            position: absolute;
            top: -45px;
            left: 0;
            right: 0;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10;
            pointer-events: none;
        }
        #ptr-icon {
            font-size: 14px;
            color: #6366f1;
            opacity: 0;
            transform: rotate(0deg);
            transition: opacity 0.2s ease;
        }
        #ptr-icon.is-spinning {
            animation: simple-spin 0.8s linear infinite;
        }
        #ptr-text {
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        /* Repositioned Bottom Toast Notification Container */
        #toast-container {
            position: fixed;
            bottom: 92px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 70;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            width: 90%;

        .logo-container img {
            width: auto; height: auto; max-width: 100%; max-height: 100%;

        }

        }
        .dark .custom-date-wrapper {
            background: #1e293b;
        }
        .custom-date-wrapper input[type="date"] {
            position: relative; color: transparent; width: 100%;
        }
        .custom-date-wrapper input[type="date"]:focus,
        .custom-date-wrapper input[type="date"]:valid {
            color: inherit;
        }
        .custom-date-placeholder {
            position: absolute; left: 10px; top: 50%;
            transform: translateY(-50%); pointer-events: none;
            color: #94a3b8; font-size: 11px;
        }
        .custom-date-wrapper input[type="date"]:focus + .custom-date-placeholder,
        .custom-date-wrapper input[type="date"]:valid + .custom-date-placeholder {
            display: none;
        }

        @keyframes simple-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .simple-spinner {
            border: 3px solid rgba(99, 102, 241, 0.15);
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: simple-spin 0.8s linear infinite;
        }

        }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.7); }

        }

        }

            100% { transform: translateX(0); opacity: 1; }

        @keyframes slideInFromLeft {
            0% { transform: translateX(-24px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        .animate-slide-right {
            animation: slideInFromRight 0.28s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .animate-slide-left {
            animation: slideInFromLeft 0.28s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .liquid-nav-container {
            position: fixed;
            bottom: max(env(safe-area-inset-bottom, 14px), 18px);
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            padding: 0 16px;
            z-index: 40;
            pointer-events: none;
        }

        .liquid-dock {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-around;
            width: 100%;
            max-width: 440px;
            height: 68px;
            padding: 6px 8px;
            border-radius: 9999px;
            pointer-events: auto;
            user-select: none;
            -webkit-user-select: none;

            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(36px) saturate(210%);
            -webkit-backdrop-filter: blur(36px) saturate(210%);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 
                0 24px 48px -12px rgba(0, 0, 0, 0.16),
                0 8px 20px -4px rgba(0, 0, 0, 0.08),
                inset 0 1.5px 3px rgba(255, 255, 255, 1),
                inset 0 -2px 3px rgba(0, 0, 0, 0.06),
                inset 0 0 12px rgba(255, 255, 255, 0.5);
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .dark .liquid-dock {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(36px) saturate(210%);
            -webkit-backdrop-filter: blur(36px) saturate(210%);
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: 
                0 28px 52px -10px rgba(0, 0, 0, 0.65),
                0 10px 24px -4px rgba(0, 0, 0, 0.4),
                inset 0 1.5px 3px rgba(255, 255, 255, 0.22),
                inset 0 -1.5px 3px rgba(0, 0, 0, 0.55),
                inset 0 0 15px rgba(99, 102, 241, 0.15);
        }

        .liquid-bubble {
            position: absolute;
            top: 5px;
            bottom: 5px;
            left: 0;
            border-radius: 9999px;
            z-index: 1;
            pointer-events: none;
            will-change: transform, width;
            transform: translateX(0);

            background: linear-gradient(135deg, rgba(240, 244, 255, 0.95) 0%, rgba(210, 224, 255, 0.75) 100%);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 
                0 8px 20px -3px rgba(26, 98, 255, 0.18),
                inset 0 1.5px 2px rgba(255, 255, 255, 1),
                inset 0 -3px 6px rgba(26, 98, 255, 0.12);
            transition: 
                transform 0.4s cubic-bezier(0.25, 1, 0.35, 1),
                width 0.35s cubic-bezier(0.25, 1, 0.35, 1);
        }

        .dark .liquid-bubble {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.55) 0%, rgba(79, 70, 229, 0.35) 100%);
            border: 1px solid rgba(165, 180, 252, 0.55);
            box-shadow: 
                0 8px 20px -3px rgba(0, 0, 0, 0.45),

                inset 0 -2px 4px rgba(79, 70, 229, 0.3);

        .ios-glass-card {
            background: #ffffff !important;
            border: 1px solid rgba(226, 232, 240, 0.95) !important;

        .dark .ios-glass-modal {
            background: #0f172a !important;
            border: 1px solid #334155 !important;

        }

        .liquid-nav-btn {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            height: 100%;
            padding: 2px 0;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .liquid-nav-btn:active {
            transform: scale(0.92);
        }

        .liquid-icon-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 26px;
            font-size: 20px;
            color: #475569;
            transition: color 0.3s ease, transform 0.3s cubic-bezier(0.34, 1.5, 0.64, 1);
        }

        .dark .liquid-icon-wrap {
            color: #94a3b8;
        }

        .liquid-label {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: -0.01em;

            color: #94a3b8;
        }

        .liquid-nav-btn.is-active .liquid-icon-wrap {
            color: #1a62ff !important;

            display: flex;
            align-items: center;

            line-height: 1;

        }

        .dark .liquid-badge {
            border-color: #0f172a;
        }
    </style>
</head>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, setDoc, doc, deleteDoc, updateDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref as storageRef, uploadString, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDguDaGIQ8dbwLoqbXKDD4ixfPg7y3VCpg",
            authDomain: "expensetracker-ec267.firebaseapp.com",
            projectId: "expensetracker-ec267",
            storageBucket: "expensetracker-ec267.firebasestorage.app",
            messagingSenderId: "789003178398",
            appId: "1:789003178398:web:1579e411ad728268c6468f"
        };

        const appInstance = initializeApp(firebaseConfig);
        const db = getFirestore(appInstance);
        const storage = getStorage(appInstance);

        window.FB = { db, storage, collection, getDocs, setDoc, doc, deleteDoc, updateDoc, onSnapshot, query, orderBy, storageRef, uploadString, getDownloadURL, deleteObject };

        async function initializeData() {
            try {
                const usersSnap = await getDocs(collection(db, 'users'));
                if (usersSnap.empty) {
                    const defaultUsers = [
                        { id: 'usr_adm', name: 'Admin Manager', username: 'admin', password: 'adminpassword', role: 'admin', email: 'admin@clickfactory.com', wallet: 0, excessSpent: 0 },
                        { id: 'usr_1', name: 'User One', username: 'user1', password: 'password', role: 'user', email: 'user1@clickfactory.com', wallet: 0, excessSpent: 0 },
                        { id: 'usr_2', name: 'User Two', username: 'user2', password: 'password', role: 'user', email: 'user2@clickfactory.com', wallet: 0, excessSpent: 0 }
                    ];
                    for (const u of defaultUsers) {
                        await setDoc(doc(db, 'users', u.id), u);
                    }
                    await setDoc(doc(db, 'settings', 'admin_pass'), { password: 'adminpassword' });
                }

                const settingsSnap = await getDocs(collection(db, 'settings'));
                if (settingsSnap.empty || !settingsSnap.docs.some(d => d.id === 'app_settings')) {
                    await setDoc(doc(db, 'settings', 'app_settings'), { autoDeleteEnabled: false, currentVersion: '1.1.2' });
                }
            } catch (err) {
                console.warn("Database initialization skipped or offline:", err);
            }
        }

        initializeData().finally(() => {
            if (typeof window.startAppListeners === 'function') {
                window.startAppListeners();
            }
        });
    </script>

    <script>
        const LOCAL_STORAGE_KEY = 'click_factory_current_user_v23';
        const THEME_STORAGE_KEY = 'click_factory_theme_v1';
        const SOUND_STORAGE_KEY = 'click_factory_sound_v1';
        const SOUND_VOL_STORAGE_KEY = 'click_factory_sound_vol_v1';
        const DOCK_ALPHA_STORAGE_KEY = 'click_factory_dock_alpha_v1';
        const CURRENT_CLIENT_APP_VERSION = '1.1.2';

        let state = {
            isDbLoading: true,
            justFinishedLoading: false,
            currentUser: null,
            adminPassword: 'adminpassword',
            users: [],
            expenses: [],
            walletTransactions: [],
            notifications: [],
            recycleBin: [],
            userRecycleBin: [],
            passwordRequests: [],
            appSettings: { autoDeleteEnabled: false, currentVersion: '1.1.2' },
            activeTab: 'home',
            slideDirection: 'animate-slide-right',
            filterCategory: 'All',
            filterMonth: 'All',
            filterUser: 'All',
            filterStartDate: '',
            filterEndDate: '',
            showDateFilter: false,
            searchQuery: '',
            themeMode: localStorage.getItem(THEME_STORAGE_KEY) || 'system',
            soundEnabled: localStorage.getItem(SOUND_STORAGE_KEY) !== 'false',
            soundVolume: parseInt(localStorage.getItem(SOUND_VOL_STORAGE_KEY) || '80', 10),
            dockAlpha: parseFloat(localStorage.getItem(DOCK_ALPHA_STORAGE_KEY) || '0.85'),
            showSoundPanel: false,
            isSoundTesting: false,
            userFilterTab: 'all',
            darkMode: false,
            editingExpenseId: null,
            tempBillData: null,
            tempFormCache: null,
            authView: 'login',
            lastClearedExpensesCache: null
        };

        const tabOrder = ['home', 'summary', 'admin', 'analytics', 'users', 'wallet', 'add', 'profile', 'recycle', 'userRecycle', 'requests', 'notifications'];
        let knownNotificationIds = new Set();
        let initialNotificationsLoaded = false;
        let sharedAudioCtx = null;
        let swRegistration = null;
        let lastHapticAlphaStep = state.dockAlpha;
        let lastHapticSoundStep = state.soundVolume;

        function triggerHaptic(pattern = 12) {
            if (!state.soundEnabled) return;
            if ('vibrate' in navigator) {
                try {
                    navigator.vibrate(pattern);
                } catch (e) {}
            }
        }

        document.addEventListener('click', (e) => {
            if (e.target.closest('button, [onclick], input[type="submit"], select')) {
                triggerHaptic(14);
            }
        });

        function applyDockTransparency(val) {
            state.dockAlpha = parseFloat(val);

                try {

        function playNotificationChime(type = 'wallet_credit', forcePreview = false) {
            if (!state.soundEnabled && !forcePreview) return;

            if ('vibrate' in navigator) {
                try {
                    navigator.vibrate(type === 'excess_spent' ? [180, 90, 220] : [120, 60, 120]);
                } catch (e) {}
            }

            const volRatio = Math.max(0, Math.min(100, Number(state.soundVolume || 80))) / 100;
            if (volRatio <= 0.01) return;

            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                if (!sharedAudioCtx) {
                    sharedAudioCtx = new AudioCtx();
                }
                if (sharedAudioCtx.state === 'suspended') {
                    sharedAudioCtx.resume();
                }

                const now = sharedAudioCtx.currentTime;
                const peakGain = 0.28 * volRatio;

                if (type === 'excess_spent') {
                    const notes = [659.25, 523.25];
                    notes.forEach((freq, idx) => {
                        const osc = sharedAudioCtx.createOscillator();
                        const gain = sharedAudioCtx.createGain();
                        osc.type = 'triangle';
                        const startTime = now + idx * 0.14;
                        osc.frequency.setValueAtTime(freq, startTime);

                        gain.gain.setValueAtTime(0.0001, startTime);
                        gain.gain.exponentialRampToValueAtTime(peakGain, startTime + 0.02);
                        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.36);

                        osc.connect(gain);
                        gain.connect(sharedAudioCtx.destination);
                        osc.start(startTime);
                        osc.stop(startTime + 0.38);
                    });
                } else {
                    const notes = [523.25, 783.99];
                    notes.forEach((freq, idx) => {
                        const osc = sharedAudioCtx.createOscillator();
                        const gain = sharedAudioCtx.createGain();
                        osc.type = 'sine';
                        const startTime = now + idx * 0.11;
                        osc.frequency.setValueAtTime(freq, startTime);

                        gain.gain.setValueAtTime(0.0001, startTime);
                        gain.gain.exponentialRampToValueAtTime(peakGain, startTime + 0.02);
                        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.45);

                        osc.connect(gain);
                        gain.connect(sharedAudioCtx.destination);
                        osc.start(startTime);
                        osc.stop(startTime + 0.47);
                    });
                }
            } catch (err) {
                console.warn("Audio chime skipped:", err);
            }
        }

        async function refundExpenseToUserWallet(userId, amountToRefund, reasonTitle = 'Expense', category = '') {
            const refundAmt = Number(amountToRefund || 0);
            if (!userId || isNaN(refundAmt) || refundAmt <= 0) return;

            const targetUser = state.users.find(u => u.id === userId);
            if (!targetUser || targetUser.role === 'admin') return;

            let currentWallet = Number(targetUser.wallet || 0);
            let currentExcess = Number(targetUser.excessSpent || 0);
            let remainingRefund = refundAmt;
            let excessReduced = 0;

            if (currentExcess > 0) {
                if (remainingRefund >= currentExcess) {
                    excessReduced = currentExcess;
                    remainingRefund -= currentExcess;
                    currentExcess = 0;
                } else {
                    excessReduced = remainingRefund;
                    currentExcess -= remainingRefund;
                    remainingRefund = 0;
                }
            }
            currentWallet += remainingRefund;

            const { db, doc, updateDoc, setDoc } = window.FB;
            await updateDoc(doc(db, 'users', userId), {
                wallet: currentWallet,
                excessSpent: currentExcess
            });

            targetUser.wallet = currentWallet;
            targetUser.excessSpent = currentExcess;
            if (state.currentUser && state.currentUser.id === userId) {
                state.currentUser.wallet = currentWallet;
                state.currentUser.excessSpent = currentExcess;
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(state.currentUser));
            }

            const txnId = 'txn_' + Date.now() + '_' + Math.random().toString(36).substring(2, 5);
            const catLabel = category ? ` (${category})` : '';
            let txnTitle = `Undo Expense: ${reasonTitle}${catLabel}`;
            let breakdownNote = `Added ${formatCurrency(remainingRefund)} back to wallet`;

            if (excessReduced > 0 && remainingRefund > 0) {
                txnTitle = `Undo Expense: ${reasonTitle}${catLabel}`;
                breakdownNote = `Cleared ${formatCurrency(excessReduced)} Excess Due + Added ${formatCurrency(remainingRefund)} to Wallet`;
            } else if (excessReduced > 0 && remainingRefund === 0) {
                txnTitle = `Undo Expense: ${reasonTitle}${catLabel}`;
                breakdownNote = `Reduced Excess Spent Due by ${formatCurrency(excessReduced)}`;
            }

            await setDoc(doc(db, 'walletTransactions', txnId), {
                id: txnId,
                userId: userId,
                type: 'undo_refund',
                title: txnTitle,
                subtitle: breakdownNote,
                amount: refundAmt,
                timestamp: new Date().toISOString(),
                performedBy: state.currentUser ? state.currentUser.name : targetUser.name
            });
        }

        window.startAppListeners = function() {
            if (!window.FB) return;
            const { db, collection, onSnapshot, doc, setDoc, deleteDoc } = window.FB;

            onSnapshot(collection(db, 'users'), (snapshot) => {
                state.users = snapshot.docs.map(docSnap => docSnap.data());
                if (state.currentUser) {
                    const freshUser = state.users.find(u => u.id === state.currentUser.id);
                    if (freshUser) {
                        state.currentUser = freshUser;
                        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(freshUser));
                    }
                }
                initialSyncFlags.users = true;
                if (state.isDbLoading) {
                    checkInitialSyncComplete();
                } else {
                    render();
                }
            }, (err) => {
                console.warn("Users listener notice:", err);
                initialSyncFlags.users = true;
                checkInitialSyncComplete();
            });

            onSnapshot(collection(db, 'settings'), (snapshot) => {
                snapshot.docs.forEach(docSnap => {
                    if (docSnap.id === 'app_settings') {
                        state.appSettings = docSnap.data();
                    }
                });
                if (!state.isDbLoading) render();
            }, (err) => console.warn("Settings listener notice:", err));

            onSnapshot(collection(db, 'walletTransactions'), (snapshot) => {
                state.walletTransactions = snapshot.docs.map(docSnap => docSnap.data());
                if (!state.isDbLoading) render();
            }, (err) => console.warn("Transactions listener notice:", err));

            onSnapshot(collection(db, 'notifications'), (snapshot) => {
                const allNotifs = snapshot.docs.map(docSnap => docSnap.data());
                
                if (initialNotificationsLoaded && state.currentUser) {
                    const isAdmin = state.currentUser.role === 'admin';
                    allNotifs.forEach(n => {
                        if (!knownNotificationIds.has(n.id)) {
                            const isForMe = (isAdmin && n.recipientRole === 'admin') || (n.recipientId === state.currentUser.id);
                            if (isForMe && !n.read) {
                                const toastType = n.type === 'excess_spent' ? 'error' : 'success';
                                sendBrowserNotification(n.title, n.message, n.type);
                                playNotificationChime(n.type);
                                showToast(`${n.title}: ${n.message}`, toastType);
                            }
                        }
                    });
                }

                knownNotificationIds = new Set(allNotifs.map(n => n.id));
                initialNotificationsLoaded = true;
                state.notifications = allNotifs;
                if (!state.isDbLoading) render();
            }, (err) => console.warn("Notifications listener notice:", err));

            onSnapshot(collection(db, 'expenses'), async (snapshot) => {
                let allExpenses = snapshot.docs.map(docSnap => docSnap.data());
                
                if (state.appSettings && state.appSettings.autoDeleteEnabled) {
                    const now = new Date();
                    const cutoffDate = new Date(now.getFullYear(), now.getMonth() - 2, now.getDate());
                    
                    let expiredExpenses = allExpenses.filter(exp => {
                        if (!exp.date) return false;
                        const expDate = new Date(exp.date);
                        return expDate < cutoffDate;
                    });

                    if (expiredExpenses.length > 0) {
                        for (const exp of expiredExpenses) {
                            try {
                                const recycleItem = { ...exp, deletedAt: new Date().toISOString(), deletedBy: 'Auto-Delete System (2-Month Limit)' };
                                await setDoc(doc(db, 'recycleBin', exp.id), recycleItem);
                                await deleteDoc(doc(db, 'expenses', exp.id));
                            } catch(err) {
                                console.error("Auto-delete sync error:", err);
                            }
                        }
                        return;
                    }
                }

                state.expenses = allExpenses;
                initialSyncFlags.expenses = true;
                if (state.isDbLoading) {
                    checkInitialSyncComplete();
                } else {
                    render();
                }
            }, (err) => {
                console.warn("Expenses listener notice:", err);
                initialSyncFlags.expenses = true;
                checkInitialSyncComplete();
            });

            onSnapshot(collection(db, 'recycleBin'), (snapshot) => {
                state.recycleBin = snapshot.docs.map(docSnap => docSnap.data());
                if (!state.isDbLoading) render();
            }, (err) => console.warn("Recycle bin listener notice:", err));

            onSnapshot(collection(db, 'userRecycleBin'), async (snapshot) => {
                let deletedUsers = snapshot.docs.map(docSnap => docSnap.data());
                const now = new Date();

                for (const item of deletedUsers) {
                    if (item.deletedAt) {
                        const deletedTime = new Date(item.deletedAt).getTime();
                        const hoursDiff = (now.getTime() - deletedTime) / (1000 * 60 * 60);
                        if (hoursDiff >= 48) {
                            try {
                                await deleteDoc(doc(db, 'userRecycleBin', item.userId));
                                await deleteDoc(doc(db, 'users', item.userId));
                                const userExps = state.expenses.filter(e => e.userId === item.userId);
                                for (const ue of userExps) {
                                    await deleteDoc(doc(db, 'expenses', ue.id));
                                }
                            } catch(e) {
                                console.error("Permanent wipe error:", e);
                            }
                            return;
                        }
                    }
                }

                state.userRecycleBin = deletedUsers;
                if (!state.isDbLoading) render();
            }, (err) => console.warn("User recycle bin listener notice:", err));

            onSnapshot(collection(db, 'passwordRequests'), (snapshot) => {
                state.passwordRequests = snapshot.docs.map(docSnap => docSnap.data());
                if (!state.isDbLoading) render();
            }, (err) => console.warn("Requests listener notice:", err));
        };

        function showToast(message, type = 'success', undoCallback = null) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            
            let bgStyle = 'bg-slate-900/95 text-white border-slate-700/80 shadow-slate-900/30';
            let icon = 'fa-circle-info text-indigo-400';

            if (type === 'success') {
                bgStyle = 'bg-emerald-600/95 text-white border-emerald-500/60 shadow-emerald-900/25';
                icon = 'fa-circle-check text-emerald-200';
            } else if (type === 'error') {
                bgStyle = 'bg-rose-600/95 text-white border-rose-500/60 shadow-rose-900/25';
                icon = 'fa-circle-exclamation text-rose-200';
            }
            
            toast.className = `${bgStyle} border px-4 py-3 rounded-2xl shadow-xl flex items-center justify-between text-xs sm:text-sm font-medium transform transition-all duration-300 translate-y-[20px] opacity-0 pointer-events-auto gap-3 backdrop-blur-xl`;
            
            let undoBtnHtml = '';
            if (undoCallback && (!state.currentUser || state.currentUser.role !== 'admin')) {
                undoBtnHtml = `<button id="toast-undo-btn" class="px-2.5 py-1 bg-white text-slate-900 rounded-xl font-bold text-xs hover:bg-slate-100 transition shrink-0 shadow-sm">Undo</button>`;
            }

            toast.innerHTML = `
                <div class="flex items-center space-x-2.5 min-w-0 flex-1">
                    <i class="fa-solid ${icon} text-base shrink-0"></i>
                    <span class="flex-1 break-words leading-tight">${message}</span>
                </div>
                ${undoBtnHtml}
            `;
            
            container.appendChild(toast);
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-[20px]', 'opacity-0');
            });

            if (undoCallback && (!state.currentUser || state.currentUser.role !== 'admin')) {
                const undoBtn = toast.querySelector('#toast-undo-btn');
                if (undoBtn) {
                    undoBtn.onclick = () => {
                        undoCallback();
                        toast.classList.add('translate-y-[20px]', 'opacity-0');
                        setTimeout(() => toast.remove(), 300);
                    };
                }
            }

            setTimeout(() => {
                toast.classList.add('translate-y-[20px]', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        async function handleWalletAdd(e, userId) {
            e.preventDefault();
            const amountToAdd = parseFloat(document.getElementById('wallet-add-amount').value);
            if (isNaN(amountToAdd) || amountToAdd === 0) {
                showToast('Please enter a valid amount.', 'error');
                return;
            }

            const user = state.users.find(u => u.id === userId);
            if (!user) return;

            let currentWallet = Number(user.wallet || 0);
            let currentExcess = Number(user.excessSpent || 0);
            let remainingFunds = amountToAdd;
            let excessCleared = 0;

            if (amountToAdd > 0) {
                if (currentExcess > 0) {
                    if (remainingFunds >= currentExcess) {
                        excessCleared = currentExcess;
                        remainingFunds -= currentExcess;
                        currentExcess = 0;
                    } else {
                        excessCleared = remainingFunds;
                        currentExcess -= remainingFunds;
                        remainingFunds = 0;
                    }
                }
                currentWallet += remainingFunds;
            } else {
                currentWallet += amountToAdd;
                if (currentWallet < 0) {
                    currentExcess += Math.abs(currentWallet);
                    currentWallet = 0;
                }
            }

            const { db, doc, updateDoc, setDoc } = window.FB;
            await updateDoc(doc(db, 'users', userId), { 
                wallet: currentWallet, 
                excessSpent: currentExcess 
            });

            const txnId = 'txn_' + Date.now();
            let txnTitle = amountToAdd >= 0 ? `Added Wallet Funds` : `Shortage Money Adjustment`;
            if (amountToAdd >= 0 && excessCleared > 0 && remainingFunds > 0) {
                txnTitle = `Cleared Excess (₹${excessCleared}) & Added Wallet (₹${remainingFunds})`;
            } else if (amountToAdd >= 0 && excessCleared > 0) {
                txnTitle = `Cleared Excess Spent Due`;
            }

            const txnData = {
                id: txnId,
                userId: userId,
                type: amountToAdd >= 0 ? 'topup' : 'shortage',
                title: txnTitle,
                amount: Math.abs(amountToAdd),
                timestamp: new Date().toISOString(),
                performedBy: state.currentUser.name
            };
            await setDoc(doc(db, 'walletTransactions', txnId), txnData);

            const notifTitle = amountToAdd > 0 ? 'Wallet Credited!' : 'Wallet Balance Adjusted';
            let notifMessage = amountToAdd > 0
                ? `${state.currentUser.name} added ${formatCurrency(amountToAdd)} to your wallet. Available Balance: ${formatCurrency(currentWallet)}.`
                : `${state.currentUser.name} adjusted your wallet by ${formatCurrency(amountToAdd)}. Available Balance: ${formatCurrency(currentWallet)}.`;

                notifMessage = `${state.currentUser.name} added ${formatCurrency(amountToAdd)} (${formatCurrency(excessCleared)} settled excess due). New Balance: ${formatCurrency(currentWallet)}.`;
            }

            await createAppNotification({
                recipientId: userId,
                recipientRole: 'user',
                type: amountToAdd > 0 ? 'wallet_credit' : 'wallet_debit',
                title: notifTitle,
                message: notifMessage,
                amount: Math.abs(amountToAdd),
                triggeredBy: state.currentUser.name
            });

            closeModal();
            showToast(`Successfully processed ${formatCurrency(amountToAdd)} for ${user.name}!`, 'success');

            else if (state.activeTab === 'admin' || state.activeTab === 'analytics') activeTargetId = 'nav-btn-summary';
            else if ((state.activeTab === 'users' && isAdmin) || (state.activeTab === 'wallet' && !isAdmin)) activeTargetId = 'nav-btn-users';

                nav.querySelectorAll('.liquid-nav-btn').forEach(btn => {

                        const leftOffset = btn.offsetLeft;

        function switchTab(tab, keepEditState = false) {
            const prevIndex = tabOrder.indexOf(state.activeTab);
            
            if (tab === 'summary') {
                state.activeTab = (state.currentUser && state.currentUser.role === 'admin') ? 'admin' : 'analytics';
            } else {
                state.activeTab = tab;
            }
            
            const nextIndex = tabOrder.indexOf(state.activeTab);
            state.slideDirection = nextIndex >= prevIndex ? 'animate-slide-right' : 'animate-slide-left';

            if (!keepEditState) {
                state.editingExpenseId = null;
                state.tempBillData = null;
                state.tempFormCache = null;
            }

            syncPersistentHeader();
            syncPersistentNavbar();
            render();
        }

        async function requestAdminAuthCode() {
            const usernameInput = document.getElementById('forgot-username');
            const username = usernameInput ? usernameInput.value.trim().toLowerCase() : '';
            if (!username) {
                showToast('Please enter your username first.', 'error');
                return;
            }

            const user = state.users.find(u => u.username.toLowerCase() === username);
            if (!user) {
                showToast('Username not found in system.', 'error');
                return;
            }

            let existingReq = state.passwordRequests.find(r => r.username.toLowerCase() === username && r.status === 'pending');
            let code = existingReq ? existingReq.code : Math.floor(100000 + Math.random() * 900000).toString();
            const reqId = existingReq ? existingReq.id : 'req_' + Date.now();

            const reqObj = {
                id: reqId,
                username: user.username,
                name: user.name,
                code: code,
                status: 'pending',
                createdAt: existingReq ? existingReq.createdAt : new Date().toISOString()
            };

            const { db, doc, setDoc } = window.FB;
            await setDoc(doc(db, 'passwordRequests', reqId), reqObj);
            showToast('Code requested successfully! Contact Admin for your 6-digit code.', 'success');
        }

        async function handleForgotPasswordSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('forgot-username').value.trim().toLowerCase();
            const authCode = document.getElementById('forgot-auth-code').value.trim();
            const newPassword = document.getElementById('forgot-new-password').value;
            const confirmPassword = document.getElementById('forgot-confirm-password').value;

            const user = state.users.find(u => u.username.toLowerCase() === username);
            if (!user) {
                showToast('Username not found.', 'error');
                return;
            }

            const req = state.passwordRequests.find(r => r.username.toLowerCase() === username && r.status === 'pending');
            if (!req || req.code !== authCode) {
                showToast('Invalid or unapproved code.', 'error');
                return;
            }

            if (!newPassword || newPassword.length < 4) {
                showToast('Password must be at least 4 characters.', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showToast('Passwords do not match.', 'error');
                return;
            }

            const { db, doc, updateDoc } = window.FB;
            user.password = newPassword;
            await updateDoc(doc(db, 'users', user.id), { password: newPassword });
            await updateDoc(doc(db, 'passwordRequests', req.id), { status: 'approved' });

            showToast('Password reset successfully! Please sign in.', 'success');
            setAuthView('login');
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            unlockAudioContext();
            const username = document.getElementById('login-username').value.trim().toLowerCase();
            const password = document.getElementById('login-password').value;

            const foundUser = state.users.find(u => u.username.toLowerCase() === username && u.password === password);
            if (foundUser) {
                state.currentUser = foundUser;
                state.activeTab = 'home';
                state.justFinishedLoading = true;
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(foundUser));
                if ('Notification' in window && Notification.permission === 'default') {
                    Notification.requestPermission().catch(() => {});
                }
                showToast(`Welcome back, ${foundUser.name}!`, 'success');
                render();
            } else {
                showToast('Invalid username or password.', 'error');
            }
        }

        function confirmLogout() {
            showConfirmModal(
                'Sign Out',
                'Are you sure you want to sign out from your account?',
                () => {
                    handleLogout();
                }
            );
        }

        function handleLogout() {
            state.currentUser = null;
            state.tempFormCache = null;
            localStorage.removeItem(LOCAL_STORAGE_KEY);
            showToast('Logged out successfully.', 'info');
            render();
        }

        function renderActiveTabContent() {
            switch(state.activeTab) {
                case 'home': return renderHomeTab();
                case 'add': return renderAddEditTab();
                case 'notifications': return renderNotificationsTab();
                case 'admin': return state.currentUser.role === 'admin' ? renderAdminTab() : renderHomeTab();
                case 'recycle': return state.currentUser.role === 'admin' ? renderRecycleBinTab() : renderHomeTab();
                case 'userRecycle': return state.currentUser.role === 'admin' ? renderUserRecycleBinTab() : renderHomeTab();
                case 'requests': return state.currentUser.role === 'admin' ? renderPasswordRequestsTab() : renderHomeTab();
                case 'users': return state.currentUser.role === 'admin' ? renderUserManagementTab() : renderUserWalletTab();
                case 'wallet': return renderUserWalletTab();
                case 'analytics': return renderUserAnalyticsTab();
                case 'profile': return renderProfileTab();
                default: return renderHomeTab();
            }
        }

        function toggleDateFilter() {
            state.showDateFilter = !state.showDateFilter;
            renderMainContentOnly();
        }

        function renderHomeTab() {
            const isAdmin = state.currentUser.role === 'admin';
            
            let filtered = state.expenses.filter(exp => {
                if (!isAdmin && exp.userId !== state.currentUser.id) return false;
                if (isAdmin && state.filterUser !== 'All' && exp.userId !== state.filterUser) return false;
                if (state.filterCategory !== 'All' && exp.category !== state.filterCategory) return false;
                if (state.filterMonth !== 'All' && !exp.date.startsWith(state.filterMonth)) return false;
                
                if (state.filterStartDate && exp.date < state.filterStartDate) return false;
                if (state.filterEndDate && exp.date > state.filterEndDate) return false;

                if (state.searchQuery.trim() !== '') {
                    const q = state.searchQuery.toLowerCase();
                    const matchTitle = exp.title.toLowerCase().includes(q);
                    const matchNotes = exp.notes && exp.notes.toLowerCase().includes(q);
                    const matchUser = exp.userName.toLowerCase().includes(q);
                    const matchClient = exp.clientNamePlace && exp.clientNamePlace.toLowerCase().includes(q);
                    if (!matchTitle && !matchNotes && !matchUser && !matchClient) return false;
                }
                return true;
            });

            filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

            const totalAmount = filtered.reduce((sum, e) => sum + e.amount, 0);
            const officeTotal = filtered.filter(e => e.category === 'Office').reduce((sum, e) => sum + e.amount, 0);
            const shootTotal = filtered.filter(e => e.category === 'Shoot').reduce((sum, e) => sum + e.amount, 0);

            const monthsSet = new Set(state.expenses.map(e => e.date ? e.date.substring(0, 7) : ''));
            const availableMonths = Array.from(monthsSet).filter(Boolean).sort().reverse();
            const hasDateFilterActive = state.filterStartDate || state.filterEndDate;

            const groupedByDate = {};
            filtered.forEach(exp => {
                const dKey = exp.date || 'Unknown';
                if (!groupedByDate[dKey]) groupedByDate[dKey] = [];
                groupedByDate[dKey].push(exp);
            });
            const sortedDates = Object.keys(groupedByDate).sort((a, b) => new Date(b) - new Date(a));

            return `
                <div class="space-y-4 w-full max-w-full">
                    <div class="bg-gradient-to-br from-indigo-600 to-violet-700 rounded-3xl p-5 sm:p-6 text-white shadow-lg shadow-indigo-500/20 relative overflow-hidden w-full border border-indigo-500/30">
                        <div class="flex justify-between items-start mb-3 gap-2">
                            <div class="min-w-0 flex-1">
                                <p class="text-indigo-200 text-xs font-medium uppercase tracking-wider truncate">
                                    ${isAdmin ? 'Total Filtered Expenses' : 'My Total Expenses'}
                                </p>
                                <h2 class="text-2xl sm:text-3xl font-bold tracking-tight mt-0.5 break-all">${formatCurrency(totalAmount)}</h2>
                            </div>
                            <span class="bg-white/20 backdrop-blur-md text-white text-xs font-semibold px-3 py-1 rounded-full shrink-0 border border-white/20">
                                ${filtered.length} Items
                            </span>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-3 mt-4 pt-4 border-t border-white/20">
                            <div class="bg-black/15 backdrop-blur-sm rounded-2xl p-3 min-w-0 border border-white/10">
                                <div class="flex items-center space-x-1.5 text-indigo-200 text-xs mb-1 min-w-0">
                                    <i class="fa-solid fa-briefcase shrink-0"></i>
                                    <span class="truncate">Office</span>
                                </div>
                                <p class="font-bold text-sm sm:text-base break-all">${formatCurrency(officeTotal)}</p>
                            </div>
                            <div class="bg-black/15 backdrop-blur-sm rounded-2xl p-3 min-w-0 border border-white/10">
                                <div class="flex items-center space-x-1.5 text-indigo-200 text-xs mb-1 min-w-0">
                                    <i class="fa-solid fa-clapperboard shrink-0"></i>
                                    <span class="truncate">Shoot</span>
                                </div>
                                <p class="font-bold text-sm sm:text-base break-all">${formatCurrency(shootTotal)}</p>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-3 w-full">
                        <div class="flex items-center space-x-2 w-full">
                            <div class="relative flex-1">
                                <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500 dark:text-slate-400 z-10">
                                    <i class="fa-solid fa-magnifying-glass text-sm"></i>
                                </span>
                                <input type="text" id="search-input" value="${state.searchQuery}" oninput="handleSearchInput(event)" placeholder="Search expenses, notes, client, user..." class="w-full pl-10 pr-10 py-3.5 ios-glass-card border border-slate-200/80 dark:border-slate-800 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm text-slate-900 dark:text-white placeholder:text-slate-400">
                                ${state.searchQuery ? `<button onclick="clearSearch()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600 z-10"><i class="fa-solid fa-xmark"></i></button>` : ''}
                            </div>
                            <button onclick="toggleDateFilter()" class="w-12 h-12 rounded-2xl ${state.showDateFilter || hasDateFilterActive ? 'bg-indigo-600 text-white shadow-md' : 'ios-glass-card text-slate-600 dark:text-slate-400 border border-slate-200/80 dark:border-slate-800'} flex items-center justify-center shrink-0 relative" title="Toggle Date Filter">
                                <i class="fa-solid fa-calendar-days text-sm"></i>
                                ${hasDateFilterActive ? '<span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-amber-400"></span>' : ''}
                            </button>
                        </div>

                        <div class="flex items-center space-x-2 overflow-x-auto pb-1 no-scrollbar w-full">
                            <button onclick="setFilterCategory('All')" class="px-4 py-2 rounded-2xl text-xs font-medium whitespace-nowrap transition shrink-0 ${state.filterCategory === 'All' ? 'bg-indigo-600 text-white shadow-md' : 'ios-glass-card text-slate-600 dark:text-slate-400 border border-slate-200/80 dark:border-slate-800'}">All Categories</button>
                            <button onclick="setFilterCategory('Office')" class="px-4 py-2 rounded-2xl text-xs font-medium whitespace-nowrap transition shrink-0 ${state.filterCategory === 'Office' ? 'bg-indigo-600 text-white shadow-md' : 'ios-glass-card text-slate-600 dark:text-slate-400 border border-slate-200/80 dark:border-slate-800'}">Office Expense</button>
                            <button onclick="setFilterCategory('Shoot')" class="px-4 py-2 rounded-2xl text-xs font-medium whitespace-nowrap transition shrink-0 ${state.filterCategory === 'Shoot' ? 'bg-indigo-600 text-white shadow-md' : 'ios-glass-card text-slate-600 dark:text-slate-400 border border-slate-200/80 dark:border-slate-800'}">Shoot Expense</button>
                        </div>

                        <div class="grid grid-cols-${isAdmin ? '2' : '1'} gap-2.5 w-full">
                            <div class="relative w-full">
                                <select onchange="setFilterMonth(this.value)" class="w-full appearance-none ios-glass-card border border-slate-200/80 dark:border-slate-800 rounded-2xl px-3.5 py-3 text-xs font-medium text-slate-700 dark:text-slate-300">
                                    <option value="All" ${state.filterMonth === 'All' && !state.filterStartDate && !state.filterEndDate ? 'selected' : ''}>All Months</option>
                                    ${availableMonths.map(m => `<option value="${m}" ${state.filterMonth === m ? 'selected' : ''}>${formatMonthName(m)}</option>`).join('')}
                                </select>
                                <span class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-400 text-xs"><i class="fa-solid fa-chevron-down"></i></span>
                            </div>

                            ${isAdmin ? `
                            <div class="relative w-full">
                                <select onchange="setFilterUser(this.value)" class="w-full appearance-none ios-glass-card border border-slate-200/80 dark:border-slate-800 rounded-2xl px-3.5 py-3 text-xs font-medium text-slate-700 dark:text-slate-300">
                                    <option value="All" ${state.filterUser === 'All' ? 'selected' : ''}>All Users</option>${state.users.map(u => `<option value="${u.id}" ${state.filterUser === u.id ? 'selected' : ''}>${u.name}</option>`).join('')}
                                </select>
                                <span class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-400 text-xs"><i class="fa-solid fa-chevron-down"></i></span>
                            </div>
                            ` : ''}
                        </div>

                        ${state.showDateFilter ? `
                        <div class="ios-glass-card p-2.5 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm space-y-1.5 w-full">
                            <div class="flex items-center justify-between text-[11px] font-semibold text-slate-700 dark:text-slate-300 px-1">
                                <span><i class="fa-solid fa-calendar-days mr-1 text-indigo-500"></i>Date Range Filter</span>
                                ${(state.filterStartDate || state.filterEndDate) ? `<button onclick="clearDateRange()" class="text-indigo-600 dark:text-indigo-400 hover:underline">Clear</button>` : ''}
                            </div>
                            <div class="grid grid-cols-2 gap-1.5 w-full">
                                <div class="custom-date-wrapper rounded-xl border border-slate-200/80 dark:border-slate-700 overflow-hidden">
                                    <input type="date" id="filter-start-date" value="${state.filterStartDate}" onchange="setFilterStartDate(this.value)" required class="w-full px-2.5 py-1.5 bg-transparent text-[11px] text-slate-900 dark:text-white min-h-[36px] focus:outline-none">
                                    <span class="custom-date-placeholder">dd-mm-yy</span>
                                </div>
                                <div class="custom-date-wrapper rounded-xl border border-slate-200/80 dark:border-slate-700 overflow-hidden">
                                    <input type="date" id="filter-end-date" value="${state.filterEndDate}" onchange="setFilterEndDate(this.value)" required class="w-full px-2.5 py-1.5 bg-transparent text-[11px] text-slate-900 dark:text-white min-h-[36px] focus:outline-none">
                                    <span class="custom-date-placeholder">dd-mm-yy</span>
                                </div>
                            </div>
                        </div>
                        ` : ''}
                    </div>

                    <div class="space-y-3.5 mt-4 w-full">
                        <div class="flex items-center justify-between px-1 pt-3">
                            <h3 class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Expense Records</h3>
                            ${isAdmin ? `<button onclick="exportFilteredCSV()" class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline flex items-center space-x-1 shrink-0"><i class="fa-solid fa-download"></i><span>Export CSV</span></button>` : ''}
                        </div>

                        ${filtered.length === 0 ? `
                            <div class="ios-glass-card rounded-3xl p-8 text-center shadow-sm mt-3 w-full">
                                <div class="w-14 h-14 bg-slate-100 dark:bg-slate-800 text-slate-400 rounded-2xl flex items-center justify-center mx-auto mb-3 text-xl"><i class="fa-solid fa-receipt"></i></div>
                                <h4 class="font-semibold text-slate-700 dark:text-slate-300 mb-1">No expenses found</h4>
                                <p class="text-xs text-slate-500 mb-4">Try changing filters or add a new expense record.</p>
                                <button onclick="openNewExpenseTab()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl text-xs font-medium shadow-md transition"><i class="fa-solid fa-plus mr-1.5"></i>Add Expense</button>
                            </div>
                        ` : ''}

                        ${sortedDates.map(dateKey => {
                            const dayExpenses = groupedByDate[dateKey];
                            const formattedDateHeader = new Date(dateKey).toLocaleDateString('en-US', {
                                month: 'long',
                                day: 'numeric',
                                year: 'numeric'
                            }).toUpperCase();

                            return `
                                <div class="space-y-2.5 mt-4">
                                    <h4 class="text-xs font-bold text-slate-400 dark:text-slate-400 uppercase tracking-wider px-1">${formattedDateHeader}</h4>
                                    ${dayExpenses.map(exp => {
                                        const isOffice = exp.category === 'Office';
                                        const isOwner = exp.userId === state.currentUser.id;
                                        return `
                                            <div class="ios-glass-card rounded-3xl py-5 sm:py-6 px-5 sm:px-6 shadow-sm transition relative group w-full mt-3">
                                                <div class="flex items-start space-x-3.5 w-full">
                                                    <div class="w-10 h-10 rounded-2xl ${isOffice ? 'bg-amber-500/10 text-amber-600 dark:text-amber-400' : 'bg-indigo-500/10 text-indigo-600 dark:text-indigo-400'} flex items-center justify-center shrink-0 mt-0.5">
                                                        <i class="fa-solid ${isOffice ? 'fa-briefcase' : 'fa-clapperboard'}"></i>
                                                    </div>
                                                    <div class="min-w-0 flex-1">
                                                        <div class="flex items-start justify-between gap-3 w-full">
                                                            <h4 class="font-semibold text-sm sm:text-base text-slate-900 dark:text-white leading-snug break-words flex-1 pr-1">${escapeHtml(exp.title)}</h4>
                                                            <span class="font-bold text-base sm:text-lg text-slate-900 dark:text-white whitespace-nowrap shrink-0">${formatCurrency(exp.amount)}</span>
                                                        </div>

                                                        <div class="flex items-center flex-wrap gap-1.5 text-xs text-slate-500 dark:text-slate-400 mt-2 w-full">
                                                            <span class="font-medium text-indigo-600 dark:text-indigo-400">${exp.category}</span>
                                                            <span>•</span>
                                                            <span class="italic text-slate-600 dark:text-slate-300 break-all">${escapeHtml(exp.userName)}</span>
                                                        </div>

                                                        ${!isOffice && exp.clientNamePlace ? `
                                                            <div class="mt-1.5 text-xs font-medium text-violet-600 dark:text-violet-400 flex items-center space-x-1.5 min-w-0">
                                                                <i class="fa-solid fa-location-dot shrink-0"></i>
                                                                <span class="break-words">Client/Place: ${escapeHtml(exp.clientNamePlace)}</span>
                                                            </div>
                                                        ` : ''}

                                                        ${exp.notes ? `<p class="text-xs text-slate-600 dark:text-slate-400 mt-2.5 bg-slate-50/80 dark:bg-slate-800/60 p-3 rounded-2xl border border-slate-200/60 dark:border-slate-700/60 break-words">${escapeHtml(exp.notes)}</p>` : ''}
                                                        
                                                        <div class="flex items-center justify-between mt-3 pt-2 border-t border-slate-200/50 dark:border-slate-800 w-full gap-2">
                                                            <div>
                                                                ${exp.billAttachment ? `
                                                                    <button onclick="viewBillModal('${exp.id}')" class="inline-flex items-center space-x-1.5 px-3.5 py-1.5 rounded-xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 text-xs font-medium border border-indigo-200/60 hover:bg-indigo-100 transition">
                                                                        <i class="fa-solid fa-paperclip"></i><span>View Attached Bill</span>
                                                                    </button>
                                                                ` : '<span class="text-[11px] text-slate-400 italic">No bill attached</span>'}
                                                            </div>

                                                            ${isOwner ? `
                                                                <div class="flex items-center space-x-1.5 shrink-0">
                                                                    ${!isAdmin ? `
                                                                        <button onclick="confirmUndoExpense('${exp.id}')" class="px-2.5 h-8 rounded-xl bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 hover:bg-emerald-500/20 border border-emerald-500/20 transition flex items-center justify-center space-x-1 text-xs font-semibold" title="Undo Expense & Refund to Wallet">
                                                                            <i class="fa-solid fa-rotate-left"></i>
                                                                            <span>Undo</span>
                                                                        </button>
                                                                    ` : ''}
                                                                    <button onclick="startEditExpense('${exp.id}')" class="w-8 h-8 rounded-xl bg-slate-100/80 dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 hover:bg-indigo-50 hover:text-indigo-600 transition flex items-center justify-center text-xs" title="Edit"><i class="fa-solid fa-pen"></i></button>
                                                                    <button onclick="confirmDeleteExpense('${exp.id}', '${exp.billAttachment || ''}')" class="w-8 h-8 rounded-xl bg-slate-100/80 dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 hover:bg-rose-50 hover:text-rose-600 transition flex items-center justify-center text-xs" title="Delete"><i class="fa-solid fa-trash"></i></button>
                                                                </div>
                                                            ` : ''}
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function handleSearchInput(e) {
            state.searchQuery = e.target.value;
            const input = document.getElementById('search-input');
            const cursorPos = input ? input.selectionStart : 0;
            renderMainContentOnly();
            const newInput = document.getElementById('search-input');
            if (newInput) {
                newInput.focus();
                newInput.setSelectionRange(cursorPos, cursorPos);
            }
        }

        function clearSearch() {
            state.searchQuery = '';
            renderMainContentOnly();
        }

        function setFilterCategory(cat) { state.filterCategory = cat; renderMainContentOnly(); }
        function setFilterMonth(month) { 
            state.filterMonth = month; 
            if (month !== 'All') {
                state.filterStartDate = '';
                state.filterEndDate = '';
            }
            renderMainContentOnly(); 
        }
        function setFilterUser(userId) { state.filterUser = userId; renderMainContentOnly(); }
        function setFilterStartDate(date) { 
            state.filterStartDate = date; 
            state.filterMonth = 'All';
            renderMainContentOnly(); 
        }
        function setFilterEndDate(date) { 
            state.filterEndDate = date; 
            state.filterMonth = 'All';
            renderMainContentOnly(); 
        }
        function clearDateRange() {
            state.filterStartDate = '';
            state.filterEndDate = '';
            renderMainContentOnly();
        }

        function renderAddEditTab() {
            const isEditing = Boolean(state.editingExpenseId);
            let expense = {
                title: '',
                amount: '',
                category: 'Office',
                date: new Date().toISOString().split('T')[0],
                clientNamePlace: '',
                notes: '',
                billAttachment: null
            };

            if (isEditing) {
                const found = state.expenses.find(e => e.id === state.editingExpenseId);
                if (found) expense = { ...found };
            }
            if (state.tempFormCache) {
                expense = { ...expense, ...state.tempFormCache };
            }

            const currentBill = (state.tempBillData !== null && state.tempBillData !== undefined)
                ? state.tempBillData
                : expense.billAttachment;

            return `
                <div class="space-y-4 w-full max-w-full pb-8 pt-2">
                    <div class="flex items-center justify-between mb-2">
                        <div class="min-w-0 pr-2">
                            <h2 class="text-lg font-bold text-slate-900 dark:text-white truncate">${isEditing ? 'Edit Expense' : 'Add New Expense'}</h2>
                        </div>
                        ${isEditing ? `<button type="button" onclick="cancelEdit()" class="text-xs font-medium text-slate-500 hover:text-slate-700 shrink-0">Cancel Edit</button>` : ''}
                    </div>

                    <form onsubmit="handleExpenseSubmit(event)" class="ios-glass-card rounded-3xl p-5 sm:p-7 shadow-sm space-y-6 w-full mt-2">
                        <div class="w-full">
                            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2.5">Expense Type</label>
                            <div class="grid grid-cols-2 gap-3 w-full">
                                <button type="button" onclick="setFormCategory('Office')" id="btn-cat-office" class="py-3.5 px-3 rounded-2xl border font-medium text-xs sm:text-sm flex items-center justify-center space-x-2 transition truncate ${expense.category === 'Office' ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' : 'bg-slate-50/80 dark:bg-slate-800/80 text-slate-700 dark:text-slate-300 border-slate-200/80 dark:border-slate-700'}"><i class="fa-solid fa-briefcase"></i><span>Office</span></button>
                                <button type="button" onclick="setFormCategory('Shoot')" id="btn-cat-shoot" class="py-3.5 px-3 rounded-2xl border font-medium text-xs sm:text-sm flex items-center justify-center space-x-2 transition truncate ${expense.category === 'Shoot' ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' : 'bg-slate-50/80 dark:bg-slate-800/80 text-slate-700 dark:text-slate-300 border-slate-200/80 dark:border-slate-700'}"><i class="fa-solid fa-clapperboard"></i><span>Shoot</span></button>
                            </div>
                            <input type="hidden" id="expense-category" value="${expense.category}">
                        </div>

                        <div id="client-input-container" class="${expense.category === 'Shoot' ? '' : 'hidden'} w-full">
                            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2.5">Client Name & Place</label>
                            <div class="relative w-full">
                                <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400"><i class="fa-solid fa-location-dot text-sm"></i></span>
                                <input type="text" id="expense-client" value="${escapeHtml(expense.clientNamePlace || '')}" oninput="updateFormCache()" placeholder="e.g., Acme Corp / Studio Location" class="w-full pl-10 pr-4 py-3.5 bg-slate-50/80 dark:bg-slate-800/80 border border-slate-200/80 dark:border-slate-700 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white">
                            </div>
                        </div>

                        <div class="w-full">
                            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2.5">Amount (₹)</label>

        function handleBillUpload(event) {
            updateFormCache();
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(uploadEvent) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const maxDim = 800;

                    if (width > height && width > maxDim) {
                        height = Math.round((height * maxDim) / width);
                        width = maxDim;
                    } else if (height > maxDim) {
                        width = Math.round((width * maxDim) / height);
                        height = maxDim;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    state.tempBillData = canvas.toDataURL('image/jpeg', 0.8);
                    showToast('Bill attached successfully!', 'success');
                    renderMainContentOnly();
                };
                img.src = uploadEvent.target.result;
            };
            reader.readAsDataURL(file);
        }

        function takeSnapshot() {
            const videoElement = document.getElementById('camera-stream');
            const canvasElement = document.getElementById('camera-canvas');
            if (!videoElement) return;

            let width = videoElement.videoWidth || 640;
            let height = videoElement.videoHeight || 480;
            const maxDim = 800;

            if (width > height && width > maxDim) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
            } else if (height > maxDim) {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
            }

            canvasElement.width = width;
            canvasElement.height = height;
            canvasElement.getContext('2d').drawImage(videoElement, 0, 0, width, height);

            state.tempBillData = canvasElement.toDataURL('image/jpeg', 0.8);
            if (window.activeCameraStream) {
                window.activeCameraStream.getTracks().forEach(track => track.stop());
                window.activeCameraStream = null;
            }
            closeModal();
            showToast('Bill captured!', 'success');
            renderMainContentOnly();
        }
