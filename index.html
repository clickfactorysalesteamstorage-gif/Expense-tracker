<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Click Factory Expense Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        *, ::before, ::after {
            box-sizing: border-box;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
            width: 100vw;
            overflow-x: hidden;
            word-wrap: break-word;
            overflow-wrap: break-word;
            background-color: #0f172a;
        }
        input[type="date"], select {
            appearance: none;
            -webkit-appearance: none;
            min-height: 48px;
        }
        .app-container {
            width: 100%;
            max-width: 100%;
            min-height: 100vh;
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            padding-top: max(env(safe-area-inset-top), 12px);
        }
        @media (min-width: 640px) {
            .app-container {
                max-width: 520px;
                min-height: 92vh;
                margin: 4vh auto;
                border-radius: 2.5rem;
                overflow: hidden;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
                border: 8px solid #1e293b;
                padding-top: 0;
            }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 dark:text-slate-100 flex flex-col justify-center items-center h-full selection:bg-indigo-500 selection:text-white">

    <div id="app" class="app-container w-full flex flex-col relative dark:bg-slate-950 transition-colors duration-200">
        <!-- Application renders dynamically via JavaScript -->
    </div>

    <!-- Notification Toast Container -->
    <div id="toast-container" class="fixed top-12 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none w-11/12 max-w-sm"></div>

    <script>
        const STORAGE_KEY = 'click_factory_expense_tracker_admin_auth_v20';

        const initialData = {
            currentUser: null,
            adminPassword: 'adminpassword',
            users: [
                { id: 'usr_adm', name: 'Admin Manager', username: 'admin', password: 'adminpassword', role: 'admin', email: 'admin@clickfactory.com' },
                { id: 'usr_1', name: 'User One', username: 'user1', password: 'password', role: 'user', email: 'user1@clickfactory.com' },
                { id: 'usr_2', name: 'User Two', username: 'user2', password: 'password', role: 'user', email: 'user2@clickfactory.com' }
            ],
            expenses: [
                {
                    id: 'exp_1',
                    userId: 'usr_1',
                    userName: 'User One',
                    title: 'Studio Lighting Setup Maintenance',
                    amount: 3500,
                    category: 'Office',
                    date: '2026-10-01',
                    clientNamePlace: '',
                    notes: 'Replaced LED bulb softboxes in studio floor 2.',
                    billAttachment: null,
                    createdAt: '2026-10-01T10:00:00.000Z'
                },
                {
                    id: 'exp_2',
                    userId: 'usr_1',
                    userName: 'User One',
                    title: 'Outdoor Commercial Shoot Cab Fare',
                    amount: 1200,
                    category: 'Shoot',
                    date: '2026-10-02',
                    clientNamePlace: 'Acme Corp / Chennai Studio',
                    notes: 'Travel expense for crew equipment transport.',
                    billAttachment: null,
                    createdAt: '2026-10-02T14:30:00.000Z'
                }
            ],
            passwordRequests: [],
            activeTab: 'home',
            filterCategory: 'All',
            filterMonth: 'All',
            filterUser: 'All',
            searchQuery: '',
            darkMode: true,
            editingExpenseId: null,
            tempBillData: null,
            authView: 'login'
        };

        let state = loadState();

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    return { ...initialData, ...parsed, authView: 'login' };
                } catch(e) {
                    console.error('Error loading state', e);
                }
            }
            return initialData;
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-600 text-white' : type === 'error' ? 'bg-rose-600 text-white' : 'bg-slate-800 text-white';
            const icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-info';
            
            toast.className = `${bgClass} px-4 py-3 rounded-2xl shadow-xl flex items-center space-x-3 text-sm font-medium transform transition-all duration-300 translate-y-[-20px] opacity-0 pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-lg shrink-0"></i><span class="flex-1 break-words">${message}</span>`;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('translate-y-[-20px]', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-[-20px]', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function formatCurrency(amount) {
            return '₹' + Number(amount).toLocaleString('en-IN');
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('en-IN', options);
        }

        function formatMonthName(yearMonth) {
            if (!yearMonth || yearMonth === 'All') return 'All Months';
            const [year, month] = yearMonth.split('-');
            const date = new Date(year, month - 1, 1);
            return date.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
        }

        function render() {
            const app = document.getElementById('app');
            
            if (state.darkMode) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }

            if (!state.currentUser) {
                if (state.authView === 'forgot') {
                    app.innerHTML = renderForgotPasswordPage();
                } else {
                    app.innerHTML = renderLoginPage();
                }
                return;
            }

            const isAdmin = state.currentUser.role === 'admin';

            app.innerHTML = `
                <!-- Top Header Bar with Proper Safe Padding -->
                <header class="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 sm:px-6 pt-3 pb-3 flex items-center justify-between w-full shadow-sm">
                    <div class="flex items-center space-x-3 min-w-0 flex-1 pr-2">
                        <div class="w-10 h-10 rounded-2xl bg-white dark:bg-slate-800 p-1 flex items-center justify-center shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden shrink-0">
                            <img src="https://clickfactoryphotography.com/wp-content/uploads/2022/04/crop-logo.gif" alt="Click Factory Logo" class="w-full h-full object-contain" onerror="this.src='https://placehold.co/40x40/4f46e5/ffffff?text=CF'">
                        </div>
                        <div class="min-w-0 flex-1">
                            <h1 class="font-bold text-sm sm:text-base leading-tight tracking-tight text-slate-900 dark:text-white truncate">Click Factory</h1>
                            <p class="text-[11px] text-slate-500 dark:text-slate-400 font-medium truncate">
                                ${isAdmin ? '<span class="text-indigo-600 dark:text-indigo-400 font-semibold"><i class="fa-solid fa-shield-halved mr-1"></i>Admin Portal</span>' : `Expense Tracker`}
                            </p>
                        </div>
                    </div>
                    
                    <div class="flex items-center space-x-2 shrink-0">
                        <button onclick="toggleDarkMode()" class="w-10 h-10 rounded-2xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition">
                            <i class="fa-solid ${state.darkMode ? 'fa-sun text-amber-400' : 'fa-moon text-slate-600'} text-sm"></i>
                        </button>
                        <button onclick="handleLogout()" class="w-10 h-10 rounded-2xl bg-rose-50 dark:bg-rose-950/50 flex items-center justify-center text-rose-600 dark:text-rose-400 hover:bg-rose-100 transition border border-rose-200/50 dark:border-rose-800/50" title="Logout">
                            <i class="fa-solid fa-arrow-right-from-bracket text-sm"></i>
                        </button>
                    </div>
                </header>

                <!-- Scrollable Body Content with 36px bottom breathing room -->
                <main class="flex-1 overflow-y-auto pb-36 pt-4 px-4 sm:px-6 w-full max-w-full">
                    ${renderActiveTabContent()}
                </main>

                <!-- Bottom Navigation Bar -->
                <nav class="fixed sm:absolute bottom-0 left-0 right-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 px-2 py-2.5 flex items-center justify-around shadow-2xl w-full">
                    <button onclick="switchTab('home')" class="flex flex-col items-center justify-center flex-1 py-1 transition ${state.activeTab === 'home' ? 'text-indigo-600 dark:text-indigo-400 font-semibold' : 'text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300'}">
                        <i class="fa-solid fa-house text-base mb-1"></i>
                        <span class="text-[10px] tracking-tight">Expenses</span>
                    </button>

                    <button onclick="switchTab('add')" class="flex flex-col items-center justify-center flex-1 py-1 transition ${state.activeTab === 'add' ? 'text-indigo-600 dark:text-indigo-400 font-semibold' : 'text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300'}">
                        <i class="fa-solid fa-circle-plus text-base mb-1"></i>
                        <span class="text-[10px] tracking-tight">Add New</span>
                    </button>

                    ${isAdmin ? `
                    <button onclick="switchTab('admin')" class="flex flex-col items-center justify-center flex-1 py-1 transition ${state.activeTab === 'admin' ? 'text-indigo-600 dark:text-indigo-400 font-semibold' : 'text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300'}">
                        <i class="fa-solid fa-chart-pie text-base mb-1"></i>
                        <span class="text-[10px] tracking-tight">Summary</span>
                    </button>
                    <button onclick="switchTab('requests')" class="flex flex-col items-center justify-center flex-1 py-1 transition relative ${state.activeTab === 'requests' ? 'text-indigo-600 dark:text-indigo-400 font-semibold' : 'text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300'}">
                        <i class="fa-solid fa-key text-base mb-1"></i>
                        <span class="text-[10px] tracking-tight">Requests</span>
                        ${state.passwordRequests.filter(r => r.status === 'pending').length > 0 ? `<span class="absolute top-1 right-3 w-2 h-2 rounded-full bg-rose-500"></span>` : ''}
                    </button>
                    <button onclick="switchTab('users')" class="flex flex-col items-center justify-center flex-1 py-1 transition ${state.activeTab === 'users' ? 'text-indigo-600 dark:text-indigo-400 font-semibold' : 'text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300'}">
                        <i class="fa-solid fa-users text-base mb-1"></i>
                        <span class="text-[10px] tracking-tight">Users</span>
                    </button>
                    ` : `
                    <button onclick="switchTab('analytics')" class="flex flex-col items-center justify-center flex-1 py-1 transition ${state.activeTab === 'analytics' ? 'text-indigo-600 dark:text-indigo-400 font-semibold' : 'text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300'}">
                        <i class="fa-solid fa-chart-column text-base mb-1"></i>
                        <span class="text-[10px] tracking-tight">Summary</span>
                    </button>
                    `}

                    <button onclick="switchTab('profile')" class="flex flex-col items-center justify-center flex-1 py-1 transition ${state.activeTab === 'profile' ? 'text-indigo-600 dark:text-indigo-400 font-semibold' : 'text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300'}">
                        <i class="fa-solid fa-user-circle text-base mb-1"></i>
                        <span class="text-[10px] tracking-tight">Profile</span>
                    </button>
                </nav>

                <!-- Modal Container -->
                <div id="modal-root"></div>
            `;
        }

        function renderLoginPage() {
            return `
                <div class="flex-1 flex flex-col justify-center px-4 py-8 animate-fadeIn max-w-sm mx-auto w-full">
                    <div class="text-center mb-6">
                        <div class="w-20 h-20 bg-white dark:bg-slate-800 rounded-3xl p-3 flex items-center justify-center mx-auto mb-4 shadow-xl border border-slate-200 dark:border-slate-700 overflow-hidden">
                            <img src="https://clickfactoryphotography.com/wp-content/uploads/2022/04/crop-logo.gif" alt="Click Factory Logo" class="w-full h-full object-contain" onerror="this.src='https://placehold.co/80x80/4f46e5/ffffff?text=CF'">
                        </div>
                        <h2 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Click Factory</h2>
                        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Expense Tracker & Management Portal</p>
                    </div>

                    <div class="bg-white dark:bg-slate-900 py-8 px-6 shadow-xl rounded-3xl border border-slate-200 dark:border-slate-800 space-y-5 w-full">
                        <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
                            <div class="w-full">
                                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Username</label>
                                <div class="relative w-full">
                                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                        <i class="fa-solid fa-user text-sm"></i>
                                    </span>
                                    <input type="text" id="login-username" required placeholder="Enter username" class="w-full pl-10 pr-4 py-3.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white">
                                </div>
                            </div>

                            <div class="w-full">
                                <div class="flex items-center justify-between mb-1.5">
                                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider">Password</label>
                                    <button type="button" onclick="setAuthView('forgot')" class="text-xs text-indigo-600 dark:text-indigo-400 font-semibold hover:underline">Forgot Password?</button>
                                </div>
                                <div class="relative w-full">
                                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                        <i class="fa-solid fa-lock text-sm"></i>
                                    </span>
                                    <input type="password" id="login-password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-3.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white">
                                </div>
                            </div>

                            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-semibold rounded-2xl shadow-lg shadow-indigo-500/25 transition text-sm flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-right-to-bracket"></i>
                                <span>Sign In</span>
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderForgotPasswordPage() {
            return `
                <div class="flex-1 flex flex-col justify-center px-4 py-8 animate-fadeIn max-w-sm mx-auto w-full">
                    <div class="text-center mb-6">
                        <div class="w-16 h-16 bg-indigo-50 dark:bg-indigo-950/60 rounded-3xl flex items-center justify-center mx-auto mb-4 text-indigo-600 dark:text-indigo-400 text-2xl shadow-sm border border-indigo-200 dark:border-indigo-800">
                            <i class="fa-solid fa-key"></i>
                        </div>
                        <h2 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Password Recovery</h2>
                        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Request an authentication code from Admin</p>
                    </div>

                    <div class="bg-white dark:bg-slate-900 py-8 px-6 shadow-xl rounded-3xl border border-slate-200 dark:border-slate-800 space-y-4 w-full">
                        <form onsubmit="handleForgotPasswordSubmit(event)" class="space-y-4">
                            <div class="w-full">
                                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Username</label>
                                <input type="text" id="forgot-username" required placeholder="Enter your username" class="w-full px-4 py-3.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white">
                            </div>

                            <div class="w-full">
                                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Admin Auth Code (6-digit)</label>
                                <input type="text" id="forgot-auth-code" maxlength="6" placeholder="Enter code provided by Admin" class="w-full px-4 py-3.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm tracking-widest text-center font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white">
                            </div>

                            <div class="w-full">
                                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">New Password</label>
                                <input type="password" id="forgot-new-password" required placeholder="Enter new password" class="w-full px-4 py-3.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white">
                            </div>

                            <div class="flex flex-col gap-2.5 pt-1 w-full">
                                <button type="button" onclick="requestAdminAuthCode()" class="w-full py-3 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-indigo-600 dark:text-indigo-400 font-semibold rounded-2xl transition text-xs border border-slate-200 dark:border-slate-700">
                                    <i class="fa-solid fa-paper-plane mr-1.5"></i> Request Code from Admin
                                </button>
                                <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-2xl shadow-lg shadow-indigo-500/25 transition text-sm">
                                    Reset Password with Code
                                </button>
                            </div>
                        </form>

                        <div class="text-center pt-2">
                            <button type="button" onclick="setAuthView('login')" class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline">
                                <i class="fa-solid fa-arrow-left mr-1"></i> Back to Sign In
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function setAuthView(view) {
            state.authView = view;
            render();
        }

        function requestAdminAuthCode() {
            const username = document.getElementById('forgot-username').value.trim().toLowerCase();
            if (!username) {
                showToast('Please enter your username first to request a code.', 'error');
                return;
            }

            const user = state.users.find(u => u.username.toLowerCase() === username);
            if (!user) {
                showToast('Username not found in system records.', 'error');
                return;
            }

            let existingReq = state.passwordRequests.find(r => r.username.toLowerCase() === username && r.status === 'pending');
            let code = '';
            if (existingReq) {
                code = existingReq.code;
            } else {
                code = Math.floor(100000 + Math.random() * 900000).toString();
                state.passwordRequests.unshift({
                    id: 'req_' + Date.now(),
                    username: user.username,
                    name: user.name,
                    code: code,
                    status: 'pending',
                    createdAt: new Date().toISOString()
                });
                saveState();
            }

            showToast('Authentication code requested successfully! Please contact Admin to receive your 6-digit code.', 'success');
        }

        function handleForgotPasswordSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('forgot-username').value.trim().toLowerCase();
            const authCode = document.getElementById('forgot-auth-code').value.trim();
            const newPassword = document.getElementById('forgot-new-password').value;

            const user = state.users.find(u => u.username.toLowerCase() === username);
            if (!user) {
                showToast('Username not found.', 'error');
                return;
            }

            const req = state.passwordRequests.find(r => r.username.toLowerCase() === username && r.status === 'pending');
            if (!req || req.code !== authCode) {
                showToast('Invalid or unapproved authentication code. Please request code from admin.', 'error');
                return;
            }

            if (!newPassword || newPassword.length < 4) {
                showToast('Password must be at least 4 characters long.', 'error');
                return;
            }

            user.password = newPassword;
            if (user.role === 'admin') {
                state.adminPassword = newPassword;
            }
            req.status = 'approved';
            saveState();
            showToast('Password reset successfully! Please sign in.', 'success');
            setAuthView('login');
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim().toLowerCase();
            const password = document.getElementById('login-password').value;

            const foundUser = state.users.find(u => u.username.toLowerCase() === username && u.password === password);
            if (foundUser) {
                state.currentUser = foundUser;
                state.activeTab = 'home';
                saveState();
                showToast(`Welcome back, ${foundUser.name}!`, 'success');
                render();
            } else {
                showToast('Invalid username or password.', 'error');
            }
        }

        function handleLogout() {
            state.currentUser = null;
            saveState();
            showToast('Logged out successfully.', 'info');
            render();
        }

        function renderActiveTabContent() {
            switch(state.activeTab) {
                case 'home':
                    return renderHomeTab();
                case 'add':
                    return renderAddEditTab();
                case 'admin':
                    return state.currentUser.role === 'admin' ? renderAdminTab() : renderHomeTab();
                case 'requests':
                    return state.currentUser.role === 'admin' ? renderPasswordRequestsTab() : renderHomeTab();
                case 'users':
                    return state.currentUser.role === 'admin' ? renderUserManagementTab() : renderHomeTab();
                case 'analytics':
                    return renderUserAnalyticsTab();
                case 'profile':
                    return renderProfileTab();
                default:
                    return renderHomeTab();
            }
        }

        function switchTab(tab) {
            state.activeTab = tab;
            state.editingExpenseId = null;
            state.tempBillData = null;
            render();
        }

        function toggleDarkMode() {
            state.darkMode = !state.darkMode;
            saveState();
            render();
        }

        function renderHomeTab() {
            const isAdmin = state.currentUser.role === 'admin';
            
            let filtered = state.expenses.filter(exp => {
                if (!isAdmin && exp.userId !== state.currentUser.id) return false;
                if (isAdmin && state.filterUser !== 'All' && exp.userId !== state.filterUser) return false;
                if (state.filterCategory !== 'All' && exp.category !== state.filterCategory) return false;
                if (state.filterMonth !== 'All' && !exp.date.startsWith(state.filterMonth)) return false;
                if (state.searchQuery.trim() !== '') {
                    const q = state.searchQuery.toLowerCase();
                    const matchTitle = exp.title.toLowerCase().includes(q);
                    const matchNotes = exp.notes && exp.notes.toLowerCase().includes(q);
                    const matchUser = exp.userName.toLowerCase().includes(q);
                    const matchClient = exp.clientNamePlace && exp.clientNamePlace.toLowerCase().includes(q);
                    if (!matchTitle && !matchNotes && !matchUser && !matchClient) return false;
                }
                return true;
            });

            filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

            const totalAmount = filtered.reduce((sum, e) => sum + e.amount, 0);
            const officeTotal = filtered.filter(e => e.category === 'Office').reduce((sum, e) => sum + e.amount, 0);
            const shootTotal = filtered.filter(e => e.category === 'Shoot').reduce((sum, e) => sum + e.amount, 0);

            const monthsSet = new Set(state.expenses.map(e => e.date.substring(0, 7)));
            const availableMonths = Array.from(monthsSet).sort().reverse();

            return `
                <div class="space-y-4 animate-fadeIn w-full max-w-full">
                    <!-- Summary Card -->
                    <div class="bg-gradient-to-br from-indigo-600 to-violet-700 rounded-3xl p-5 sm:p-6 text-white shadow-xl shadow-indigo-500/20 relative overflow-hidden w-full">
                        <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>
                        <div class="flex justify-between items-start mb-3 gap-2">
                            <div class="min-w-0 flex-1">
                                <p class="text-indigo-200 text-xs font-medium uppercase tracking-wider truncate">
                                    ${isAdmin ? 'Total Filtered Expenses' : 'My Total Expenses'}
                                </p>
                                <h2 class="text-2xl sm:text-3xl font-bold tracking-tight mt-0.5 break-all">${formatCurrency(totalAmount)}</h2>
                            </div>
                            <span class="bg-white/20 backdrop-blur-md text-white text-xs font-semibold px-3 py-1 rounded-full shrink-0">
                                ${filtered.length} Items
                            </span>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-3 mt-4 pt-4 border-t border-white/15">
                            <div class="bg-black/10 backdrop-blur-sm rounded-2xl p-3 min-w-0">
                                <div class="flex items-center space-x-1.5 text-indigo-200 text-xs mb-1 min-w-0">
                                    <i class="fa-solid fa-briefcase shrink-0"></i>
                                    <span class="truncate">Office</span>
                                </div>
                                <p class="font-bold text-sm sm:text-base break-all">${formatCurrency(officeTotal)}</p>
                            </div>
                            <div class="bg-black/10 backdrop-blur-sm rounded-2xl p-3 min-w-0">
                                <div class="flex items-center space-x-1.5 text-indigo-200 text-xs mb-1 min-w-0">
                                    <i class="fa-solid fa-clapperboard shrink-0"></i>
                                    <span class="truncate">Shoot</span>
                                </div>
                                <p class="font-bold text-sm sm:text-base break-all">${formatCurrency(shootTotal)}</p>
                            </div>
                        </div>
                    </div>

                    <!-- Search & Filters -->
                    <div class="space-y-3 w-full">
                        <div class="relative w-full">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                                <i class="fa-solid fa-magnifying-glass text-sm"></i>
                            </span>
                            <input type="text" id="search-input" value="${state.searchQuery}" oninput="handleSearchInput(event)" placeholder="Search expenses, notes, client, user..." class="w-full pl-10 pr-10 py-3.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm transition text-slate-900 dark:text-white">
                            ${state.searchQuery ? `<button onclick="clearSearch()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>` : ''}
                        </div>

                        <div class="flex items-center space-x-2 overflow-x-auto pb-1 no-scrollbar w-full">
                            <button onclick="setFilterCategory('All')" class="px-4 py-2 rounded-2xl text-xs font-medium whitespace-nowrap transition shrink-0 ${state.filterCategory === 'All' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-500/20' : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800'}">
                                All Categories
                            </button>
                            <button onclick="setFilterCategory('Office')" class="px-4 py-2 rounded-2xl text-xs font-medium whitespace-nowrap transition shrink-0 ${state.filterCategory === 'Office' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-500/20' : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800'}">
                                Office Expense
                            </button>
                            <button onclick="setFilterCategory('Shoot')" class="px-4 py-2 rounded-2xl text-xs font-medium whitespace-nowrap transition shrink-0 ${state.filterCategory === 'Shoot' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-500/20' : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800'}">
                                Shoot Expense
                            </button>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 w-full">
                            <div class="relative w-full">
                                <select onchange="setFilterMonth(this.value)" class="w-full appearance-none bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl px-3.5 py-3 text-xs font-medium text-slate-700 dark:text-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                    <option value="All" ${state.filterMonth === 'All' ? 'selected' : ''}>All Months</option>
                                    ${availableMonths.map(m => `<option value="${m}" ${state.filterMonth === m ? 'selected' : ''}>${formatMonthName(m)}</option>`).join('')}
                                </select>
                                <span class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-400 text-xs">
                                    <i class="fa-solid fa-chevron-down"></i>
                                </span>
                            </div>

                            ${isAdmin ? `
                            <div class="relative w-full">
                                <select onchange="setFilterUser(this.value)" class="w-full appearance-none bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl px-3.5 py-3 text-xs font-medium text-slate-700 dark:text-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                    <option value="All" ${state.filterUser === 'All' ? 'selected' : ''}>All Users</option>
                                    ${state.users.map(u => `<option value="${u.id}" ${state.filterUser === u.id ? 'selected' : ''}>${u.name}</option>`).join('')}
                                </select>
                                <span class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-400 text-xs">
                                    <i class="fa-solid fa-chevron-down"></i>
                                </span>
                            </div>
                            ` : ''}
                        </div>
                    </div>

                    <!-- Expenses List -->
                    <div class="space-y-3.5 mt-4 w-full">
                        <div class="flex items-center justify-between px-1">
                            <h3 class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Expense Records</h3>
                            ${isAdmin ? `
                                <button onclick="exportFilteredCSV()" class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline flex items-center space-x-1 shrink-0">
                                    <i class="fa-solid fa-download"></i><span>Export CSV</span>
                                </button>
                            ` : ''}
                        </div>

                        ${filtered.length === 0 ? `
                            <div class="bg-white dark:bg-slate-900 rounded-3xl p-8 text-center border border-slate-200 dark:border-slate-800 shadow-sm mt-4 w-full">
                                <div class="w-14 h-14 bg-slate-100 dark:bg-slate-800 text-slate-400 rounded-2xl flex items-center justify-center mx-auto mb-3 text-xl">
                                    <i class="fa-solid fa-receipt"></i>
                                </div>
                                <h4 class="font-semibold text-slate-700 dark:text-slate-300 mb-1">No expenses found</h4>
                                <p class="text-xs text-slate-500 dark:text-slate-400 mb-4">Try changing filters or add a new expense record.</p>
                                <button onclick="switchTab('add')" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl text-xs font-medium shadow-md shadow-indigo-500/20 transition">
                                    <i class="fa-solid fa-plus mr-1.5"></i>Add Expense
                                </button>
                            </div>
                        ` : ''}

                        ${filtered.map(exp => {
                            const isOffice = exp.category === 'Office';
                            const canEdit = isAdmin || exp.userId === state.currentUser.id;
                            return `
                                <div class="bg-white dark:bg-slate-900 rounded-3xl p-4.5 sm:p-5 border border-slate-200 dark:border-slate-800 shadow-sm hover:shadow-md transition relative group w-full">
                                    <div class="flex items-start justify-between gap-3 w-full">
                                        <div class="flex items-start space-x-3 flex-1 min-w-0">
                                            <div class="w-10 h-10 rounded-2xl ${isOffice ? 'bg-amber-500/10 text-amber-600 dark:text-amber-400' : 'bg-indigo-500/10 text-indigo-600 dark:text-indigo-400'} flex items-center justify-center shrink-0 mt-0.5">
                                                <i class="fa-solid ${isOffice ? 'fa-briefcase' : 'fa-clapperboard'}"></i>
                                            </div>
                                            <div class="flex-1 min-w-0 pr-1">
                                                <h4 class="font-semibold text-sm text-slate-900 dark:text-white leading-snug mb-1 break-words">${escapeHtml(exp.title)}</h4>
                                                
                                                ${!isOffice && exp.clientNamePlace ? `
                                                    <div class="mb-1 text-xs font-medium text-violet-600 dark:text-violet-400 flex items-center space-x-1.5 min-w-0">
                                                        <i class="fa-solid fa-location-dot shrink-0"></i>
                                                        <span class="break-words">Client/Place: ${escapeHtml(exp.clientNamePlace)}</span>
                                                    </div>
                                                ` : ''}

                                                <div class="flex items-center flex-wrap gap-1.5 text-xs text-slate-500 dark:text-slate-400 mt-1.5 w-full">
                                                    <span><i class="fa-regular fa-calendar mr-1"></i>${formatDate(exp.date)}</span>
                                                    <span>•</span>
                                                    <span class="font-medium text-indigo-600 dark:text-indigo-400">${exp.category}</span>
                                                    <span>•</span>
                                                    <span class="italic text-slate-600 dark:text-slate-300 break-all">${escapeHtml(exp.userName)}</span>
                                                </div>
                                                ${exp.notes ? `<p class="text-xs text-slate-600 dark:text-slate-400 mt-2.5 bg-slate-50 dark:bg-slate-800/50 p-3 rounded-2xl border border-slate-100 dark:border-slate-800/80 break-words">${escapeHtml(exp.notes)}</p>` : ''}
                                                
                                                ${exp.billAttachment ? `
                                                    <div class="mt-3 flex items-center space-x-2">
                                                        <button onclick="viewBillModal('${exp.id}')" class="inline-flex items-center space-x-1.5 px-3.5 py-1.5 rounded-xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 text-xs font-medium border border-indigo-200/60 dark:border-indigo-800/60 hover:bg-indigo-100 transition">
                                                            <i class="fa-solid fa-paperclip"></i>
                                                            <span>View Attached Bill</span>
                                                        </button>
                                                    </div>
                                                ` : ''}
                                            </div>
                                        </div>
                                        <div class="text-right shrink-0 flex flex-col items-end">
                                            <span class="font-bold text-base sm:text-lg text-slate-900 dark:text-white break-all">${formatCurrency(exp.amount)}</span>
                                            ${canEdit ? `
                                                <div class="flex items-center space-x-1.5 mt-2.5">
                                                    <button onclick="startEditExpense('${exp.id}')" class="w-8 h-8 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-indigo-50 hover:text-indigo-600 dark:hover:bg-indigo-950 dark:hover:text-indigo-400 transition flex items-center justify-center text-xs" title="Edit">
                                                        <i class="fa-solid fa-pen"></i>
                                                    </button>
                                                    <button onclick="confirmDeleteExpense('${exp.id}')" class="w-8 h-8 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-rose-50 hover:text-rose-600 dark:hover:bg-rose-950 dark:hover:text-rose-400 transition flex items-center justify-center text-xs" title="Delete">
                                                        <i class="fa-solid fa-trash"></i>
                                                    </button>
                                                </div>
                                            ` : ''}
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function handleSearchInput(e) {
            state.searchQuery = e.target.value;
            const input = document.getElementById('search-input');
            const cursorPos = input ? input.selectionStart : 0;
            render();
            const newInput = document.getElementById('search-input');
            if (newInput) {
                newInput.focus();
                newInput.setSelectionRange(cursorPos, cursorPos);
            }
        }

        function clearSearch() {
            state.searchQuery = '';
            render();
        }

        function setFilterCategory(cat) {
            state.filterCategory = cat;
            render();
        }

        function setFilterMonth(month) {
            state.filterMonth = month;
            render();
        }

        function setFilterUser(userId) {
            state.filterUser = userId;
            render();
        }

        function renderAddEditTab() {
            const isEditing = Boolean(state.editingExpenseId);
            let expense = {
                title: '',
                amount: '',
                category: 'Office',
                date: new Date().toISOString().split('T')[0],
                clientNamePlace: '',
                notes: '',
                billAttachment: null
            };

            if (isEditing) {
                const found = state.expenses.find(e => e.id === state.editingExpenseId);
                if (found) expense = found;
            }

            const currentBill = state.tempBillData !== null ? state.tempBillData : expense.billAttachment;

            return `
                <div class="space-y-4 animate-fadeIn w-full max-w-full pb-8">
                    <div class="flex items-center justify-between mb-2">
                        <div class="min-w-0 pr-2">
                            <h2 class="text-lg font-bold text-slate-900 dark:text-white truncate">
                                ${isEditing ? 'Edit Expense' : 'Add New Expense'}
                            </h2>
                            <p class="text-xs text-slate-500 dark:text-slate-400 truncate">
                                ${isEditing ? 'Update the expense details below' : 'Record an Office or Shoot expense'}
                            </p>
                        </div>
                        ${isEditing ? `
                            <button onclick="cancelEdit()" class="text-xs font-medium text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 shrink-0">
                                Cancel Edit
                            </button>
                        ` : ''}
                    </div>

                    <form onsubmit="handleExpenseSubmit(event)" class="bg-white dark:bg-slate-900 rounded-3xl p-5 sm:p-7 border border-slate-200 dark:border-slate-800 shadow-sm space-y-6 w-full">
                        <div class="w-full">
                            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2.5">Expense Type</label>
                            <div class="grid grid-cols-2 gap-3 w-full">
                                <button type="button" onclick="setFormCategory('Office')" id="btn-cat-office" class="py-3.5 px-3 sm:px-4 rounded-2xl border font-medium text-xs sm:text-sm flex items-center justify-center space-x-2 transition truncate ${expense.category === 'Office' ? 'bg-indigo-600 text-white border-indigo-600 shadow-md shadow-indigo-500/20' : 'bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700'}">
                                    <i class="fa-solid fa-briefcase shrink-0"></i>
                                    <span class="truncate">Office Expense</span>
                                </button>
                                <button type="button" onclick="setFormCategory('Shoot')" id="btn-cat-shoot" class="py-3.5 px-3 sm:px-4 rounded-2xl border font-medium text-xs sm:text-sm flex items-center justify-center space-x-2 transition truncate ${expense.category === 'Shoot' ? 'bg-indigo-600 text-white border-indigo-600 shadow-md shadow-indigo-500/20' : 'bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700'}">
                                    <i class="fa-solid fa-clapperboard shrink-0"></i>
                                    <span class="truncate">Shoot Expense</span>
                                </button>
                            </div>
                            <input type="hidden" id="expense-category" value="${expense.category}">
                        </div>

                        <!-- Shoot specific Client Name & Place input container -->
                        <div id="client-input-container" class="${expense.category === 'Shoot' ? '' : 'hidden'} w-full">
                            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2.5">Client Name & Place</label>
                            <div class="relative w-full">
                                <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                                    <i class="fa-solid fa-location-dot text-sm"></i>
                                </span>
                                <input type="text" id="expense-client" value="${escapeHtml(expense.clientNamePlace || '')}" placeholder="e.g., Acme Corp / Outdoor Studio Location" class="w-full pl-10 pr-4 py-3.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white">
                            </div>
                        </div>

                        <div class="w-full">
                            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2.5">Amount (₹)</label>
                            <div class="relative w-full">
                                <span class="absolute inset-y-0 left-0 pl-4 flex items-center font-bold text-slate-400">₹</span>
                                <input type="number" id="expense-amount" value="${expense.amount}" required min="1" step="any" placeholder="0.00" class="w-full pl-9 pr-4 py-3.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-base font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white">
                            </div>
                        </div>

                        <div class="w-full">
                            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2.5">Title / Description</label>
                            <input type="text" id="expense-title" value="${escapeHtml(expense.title)}" required placeholder="e.g., Studio Rent, Camera Rental, Catering" class="w-full px-4 py-3.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white">
                        </div>

                        <div class="w-full">
                            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2.5">Date</label>
                            <input type="date" id="expense-date" value="${expense.date}" required class="w-full px-4 py-3.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white">
                        </div>

                        <div class="w-full">
                            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2.5">Notes / Receipt details (Optional)</label>
                            <textarea id="expense-notes" rows="3" placeholder="Add any vendor details, invoice numbers or remarks..." class="w-full px-4 py-3.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white">${escapeHtml(expense.notes)}</textarea>
                        </div>

                        <div class="w-full">
                            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2.5">Bill / Receipt Attachment (Optional)</label>
                            
                            ${currentBill ? `
                                <div class="bg-indigo-50 dark:bg-indigo-950/60 p-4 rounded-2xl border border-indigo-200 dark:border-indigo-800 flex items-center justify-between mb-3 w-full gap-2">
                                    <div class="flex items-center space-x-2 text-indigo-600 dark:text-indigo-400 text-xs font-semibold min-w-0 flex-1">
                                        <i class="fa-solid fa-file-image text-base shrink-0"></i>
                                        <span class="truncate">Bill attached successfully</span>
                                    </div>
                                    <div class="flex items-center space-x-2 shrink-0">
                                        <button type="button" onclick="previewCurrentTempBill()" class="px-3 py-1.5 bg-indigo-600 text-white rounded-xl text-xs font-medium">Preview</button>
                                        <button type="button" onclick="removeBillAttachment(event)" class="px-3 py-1.5 bg-rose-600 text-white rounded-xl text-xs font-medium">Remove</button>
                                    </div>
                                </div>
                            ` : ''}

                            <div class="grid grid-cols-2 gap-3 w-full">
                                <div class="relative border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-2xl p-4 text-center bg-slate-50 dark:bg-slate-800/40 hover:border-indigo-500 transition cursor-pointer">
                                    <input type="file" id="bill-file-input" accept="image/*" onchange="handleBillUpload(event)" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
                                    <div class="flex flex-col items-center justify-center space-y-1">
                                        <div class="w-10 h-10 rounded-2xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-xs">
                                            <i class="fa-solid fa-cloud-arrow-up"></i>
                                        </div>
                                        <p class="text-[11px] font-semibold text-slate-700 dark:text-slate-300">Upload File</p>
                                        <p class="text-[9px] text-slate-400">PNG, JPG</p>
                                    </div>
                                </div>

                                <button type="button" onclick="openCameraCaptureModal()" class="border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-2xl p-4 text-center bg-slate-50 dark:bg-slate-800/40 hover:border-indigo-500 transition flex flex-col items-center justify-center space-y-1">
                                    <div class="w-10 h-10 rounded-2xl bg-violet-50 dark:bg-violet-950/60 text-violet-600 dark:text-violet-400 flex items-center justify-center text-xs">
                                        <i class="fa-solid fa-camera"></i>
                                    </div>
                                    <p class="text-[11px] font-semibold text-slate-700 dark:text-slate-300">Capture Bill</p>
                                    <p class="text-[9px] text-slate-400">Use Camera</p>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="w-full py-4 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-semibold rounded-2xl shadow-lg shadow-indigo-500/25 transition flex items-center justify-center space-x-2 mt-4">
                            <i class="fa-solid ${isEditing ? 'fa-floppy-disk' : 'fa-circle-plus'}"></i>
                            <span>${isEditing ? 'Save Changes' : 'Submit Expense'}</span>
                        </button>
                    </form>
                </div>
            `;
        }

                        </div>

                        <div class="p-5 bg-slate-900 flex items-center justify-around">

                                <i class="fa-solid fa-camera"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;

            const videoElement = document.getElementById('camera-stream');
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
                .then(stream => {
                    window.activeCameraStream = stream;
                    videoElement.srcObject = stream;
                })
                .catch(err => {
                    console.error('Camera access error:', err);
                    showToast('Unable to access device camera. Please check permissions or upload file.', 'error');
                    closeModal();
                });

        function takeSnapshot() {
            const videoElement = document.getElementById('camera-stream');
            const canvasElement = document.getElementById('camera-canvas');
            if (!videoElement) return;

            canvasElement.width = videoElement.videoWidth || 640;
            canvasElement.height = videoElement.videoHeight || 480;
            const ctx = canvasElement.getContext('2d');
            ctx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);

            const dataUrl = canvasElement.toDataURL('image/jpeg', 0.85);
            
            if (window.activeCameraStream) {
                window.activeCameraStream.getTracks().forEach(track => track.stop());
                window.activeCameraStream = null;
            }

            state.tempBillData = dataUrl;
            closeModal();
            showToast('Bill captured successfully!', 'success');
            render();
        }

        function handleExpenseSubmit(event) {
            event.preventDefault();
            const category = document.getElementById('expense-category').value;
            const amount = parseFloat(document.getElementById('expense-amount').value);
            const title = document.getElementById('expense-title').value.trim();
            const date = document.getElementById('expense-date').value;
            const clientNamePlace = category === 'Shoot' ? document.getElementById('expense-client').value.trim() : '';
            const notes = document.getElementById('expense-notes').value.trim();
            const billAttachment = state.tempBillData;

            if (!title || isNaN(amount) || amount <= 0 || !date) {
                showToast('Please fill in all required fields with valid values.', 'error');
                return;
            }

            if (state.editingExpenseId) {
                state.expenses = state.expenses.map(e => {
                    if (e.id === state.editingExpenseId) {
                        return {
                            ...e,
                            title,
                            amount,
                            category,
                            date,
                            clientNamePlace,
                            notes,
                            billAttachment: billAttachment !== null ? billAttachment : e.billAttachment
                        };
                    }
                    return e;
                });
                state.editingExpenseId = null;
                state.tempBillData = null;
                showToast('Expense updated successfully!', 'success');
            } else {
                const newExp = {
                    id: 'exp_' + Date.now(),
                    userId: state.currentUser.id,
                    userName: state.currentUser.name,
                    title,
                    amount,
                    category,
                    date,
                    clientNamePlace,
                    notes,
                    billAttachment,
                    createdAt: new Date().toISOString()
                };
                state.expenses.unshift(newExp);
                state.tempBillData = null;
                showToast('Expense added successfully!', 'success');
            }

            saveState();
            switchTab('home');
        }
