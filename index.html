    <script>
        (function fixSquareAppleTouchIcon() {
            const logoUrl = 'https://clickfactoryphotography.com/wp-content/uploads/2022/04/crop-logo.gif';
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = function () {
                try {
                    const size = 512;
                    const pad = 64;
                    const maxInner = size - pad * 2;
                    const canvas = document.createElement('canvas');
                    canvas.width = size;
                    canvas.height = size;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, size, size);

                    const ratio = Math.min(maxInner / (img.naturalWidth || size), maxInner / (img.naturalHeight || size));
                    const drawW = Math.round((img.naturalWidth || size) * ratio);
                    const drawH = Math.round((img.naturalHeight || size) * ratio);
                    const drawX = Math.round((size - drawW) / 2);
                    const drawY = Math.round((size - drawH) / 2);
                    ctx.drawImage(img, drawX, drawY, drawW, drawH);

                    const squarePng = canvas.toDataURL('image/png');
                    const touchLink = document.getElementById('apple-touch-icon-link');
                    if (touchLink) touchLink.setAttribute('href', squarePng);

                    const manifestLink = document.getElementById('app-manifest-link');
                    if (manifestLink) {
                        const manifestObj = {
                            name: 'Expense tracker',
                            short_name: 'ExpenseTracker',
                            start_url: '.',
                            display: 'standalone',
                            orientation: 'any',
                            background_color: '#000000',
                            theme_color: '#000000',
                            icons: [{ src: squarePng, sizes: '512x512', type: 'image/png' }]
                        };
                        manifestLink.setAttribute('href', 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifestObj)));
                    }
                } catch (e) { }
            };
            img.src = logoUrl;
        })();
    </script>

                }

        };

        (function () {
            let savedTheme = 'light';
            try { savedTheme = localStorage.getItem('click_factory_theme_v1') || 'light'; } catch (e) { }
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = savedTheme === 'dark' || (savedTheme === 'system' && prefersDark);
            if (isDark) {
                document.documentElement.classList.add('dark');
                document.getElementById('meta-theme-color')?.setAttribute('content', '#000000');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('meta-theme-color')?.setAttribute('content', '#ffffff');
            }
        })();
    </script>

<body class="text-slate-800 dark:text-slate-100 antialiased selection:bg-indigo-500 selection:text-white flex flex-col">

    <div id="toast-container"></div>

    <div class="app-container max-w-lg mx-auto relative">
        <header id="persistent-header" class="hidden ios-header px-5 sm:px-6 flex items-center justify-between"></header>

        <div id="app" class="flex-1 flex flex-col min-h-0 overflow-hidden relative"></div>

        <div id="persistent-nav-wrapper" class="hidden liquid-nav-container">
            <nav id="liquid-nav" class="liquid-dock" aria-label="Primary">
                <div id="liquid-bubble" class="liquid-bubble" aria-hidden="true"></div>

    </div>

    <script>
        const LOCAL_STORAGE_KEY = 'click_factory_user_v1';
        const SESSION_COOKIE_KEY = 'cf_user_session_v1';
        const SESSION_IDB_NAME = 'cf_session_store_v1';
        const THEME_STORAGE_KEY = 'click_factory_theme_v1';
        const SOUND_STORAGE_KEY = 'click_factory_sound_v1';
        const DOCK_ALPHA_STORAGE_KEY = 'click_factory_dock_alpha_v1';
        const LOCAL_DATA_STORAGE_KEY = 'click_factory_data_v1';
        const GDRIVE_TOKEN_CACHE_KEY = 'click_factory_gdrive_token_v1';
        const tabOrder = ['home', 'add', 'notifications', 'admin', 'analytics', 'users', 'wallet', 'profile', 'recycle', 'userRecycle', 'requests'];

        const DEFAULT_SEED_USERS = [
            { id: 'dev_0', name: 'Satish Kumar (Dev)', username: 'developer', password: 'devpassword', role: 'developer', email: 'developer@clickfactory.com', wallet: 0, excessSpent: 0 },
            { id: 'admin_1', name: 'Studio Admin', username: 'admin', password: 'adminpassword', role: 'admin', email: 'admin@clickfactory.com', wallet: 0, excessSpent: 0 },
            { id: 'user_1', name: 'Rohan Verma', username: 'user1', password: 'password', role: 'user', email: 'rohan@clickfactory.com', wallet: 5000, excessSpent: 0 },
            { id: 'user_2', name: 'Ananya Sharma', username: 'user2', password: 'password', role: 'user', email: 'ananya@clickfactory.com', wallet: 3500, excessSpent: 0 }
        ];

        const isDeveloper = (u) => Boolean(u && u.role === 'developer');
        const isAdminOrDev = (u) => Boolean(u && (u.role === 'admin' || u.role === 'developer'));

        function lsGet(k, fallback = null) {
            try { const v = localStorage.getItem(k); return v !== null ? v : fallback; } catch (e) { return fallback; }
        }
        function lsSet(k, v) {
            try { localStorage.setItem(k, v); } catch (e) { }
        }
        function lsRemove(k) {
            try { localStorage.removeItem(k); } catch (e) { }
        }

        function triggerHaptic(duration = 12) {
            if (typeof navigator !== 'undefined' && 'vibrate' in navigator) {
                try { navigator.vibrate(duration); } catch (e) { }
            }
        }

        function createLocalFallbackAdapter() {
            const listeners = {};
            let store = null;
            try { store = JSON.parse(lsGet(LOCAL_DATA_STORAGE_KEY, 'null')); } catch (e) { }
            if (!store || typeof store !== 'object') {
                store = {
                    users: {},
                    expenses: {},
                    walletTransactions: {},
                    notifications: {},
                    recycleBin: {},
                    userRecycleBin: {},
                    passwordRequests: {},
                    settings: {
                        app_settings: {
                            autoDeleteEnabled: false,
                            currentVersion: '2.9.0',
                            gdriveEnabled: false,
                            gdriveClientId: '',
                            gdriveFolderId: '',
                            gdriveBridgeUrl: '',
                            gdriveSharedToken: '',
                            gdriveSharedExpiry: 0,
                            gdriveConnectedEmail: '',
                            gdriveLastError: '',
                            maintenanceMode: false,
                            maintenanceHours: 2,
                            maintenanceUpdatedAt: ''
                        }
                    }
                };
            }
            if (!store.users) store.users = {};
            DEFAULT_SEED_USERS.forEach(u => {
                if (!store.users[u.id]) store.users[u.id] = { ...u };
            });

            function saveStore() {
                lsSet(LOCAL_DATA_STORAGE_KEY, JSON.stringify(store));
            }
            function notify(colName) {
                const docs = Object.entries(store[colName] || {}).map(([id, data]) => ({
                    id,
                    data: () => ({ ...data })
                }));
                (listeners[colName] || []).forEach(cb => {
                    try { cb({ docs, empty: docs.length === 0, metadata: { fromCache: false } }); } catch (e) { }
                });
            }

            return {
                db: { _isLocal: true },
                storage: { _isLocal: true },
                collection: (_db, name) => ({ _col: name }),
                doc: (_db, colName, id) => ({ _col: colName, _id: id }),
                getDocs: async (colRef) => {
                    const docs = Object.entries(store[colRef._col] || {}).map(([id, data]) => ({
                        id,
                        data: () => ({ ...data })
                    }));
                    return { docs, empty: docs.length === 0 };
                },
                setDoc: async (docRef, data, opts) => {
                    if (!store[docRef._col]) store[docRef._col] = {};
                    store[docRef._col][docRef._id] = opts && opts.merge
                        ? { ...(store[docRef._col][docRef._id] || {}), ...data }
                        : { ...data };
                    saveStore();
                    notify(docRef._col);
                },
                updateDoc: async (docRef, data) => {
                    if (!store[docRef._col]) store[docRef._col] = {};
                    store[docRef._col][docRef._id] = { ...(store[docRef._col][docRef._id] || {}), ...data };
                    saveStore();
                    notify(docRef._col);
                },
                deleteDoc: async (docRef) => {
                    if (store[docRef._col]) {
                        delete store[docRef._col][docRef._id];
                        saveStore();
                        notify(docRef._col);
                    }
                },
                onSnapshot: (colRef, onNext) => {
                    const name = colRef._col;
                    if (!listeners[name]) listeners[name] = [];
                    listeners[name].push(onNext);
                    setTimeout(() => notify(name), 0);
                    return () => {
                        listeners[name] = (listeners[name] || []).filter(fn => fn !== onNext);
                    };
                },
                runTransaction: async (_db, updateFn) => {
                    const tx = {
                        get: async (docRef) => {
                            const item = (store[docRef._col] || {})[docRef._id];
                            return { exists: () => Boolean(item), data: () => ({ ...item }) };
                        },
                        update: (docRef, data) => {
                            if (!store[docRef._col]) store[docRef._col] = {};
                            store[docRef._col][docRef._id] = { ...(store[docRef._col][docRef._id] || {}), ...data };
                        }
                    };
                    const res = await updateFn(tx);
                    saveStore();
                    notify('users');
                    return res;
                },
                query: (c) => c,
                orderBy: () => ({}),
                storageRef: (_s, path) => ({ _path: path }),
                uploadString: async (ref, dataUrl) => { ref._dataUrl = dataUrl; },
                getDownloadURL: async (ref) => ref._dataUrl || '',
                deleteObject: async () => { }
            };
        }

        window.FB = createLocalFallbackAdapter();
        window.activeUnsubscribers = [];

        let knownNotificationIds = new Set();
        let initialNotificationsLoaded = false;
        let lastHapticAlphaStep = -1;

        const state = {
            currentUser: null,
            authView: 'login',
            activeTab: 'home',
            slideDirection: 'animate-slide-right',
            editingExpenseId: null,
            tempBillData: null,
            tempFormCache: null,
            userFilterTab: 'all',
            showDateFilter: false,
            themeMode: lsGet(THEME_STORAGE_KEY, 'light'),
            darkMode: false,
            soundEnabled: lsGet(SOUND_STORAGE_KEY, 'true') !== 'false',
            dockAlpha: (() => {
                const raw = parseFloat(lsGet(DOCK_ALPHA_STORAGE_KEY, '0.01'));
                return isNaN(raw) ? 0.01 : Math.min(0.90, Math.max(0.01, raw));
            })(),
            isDbLoading: false,
            justFinishedLoading: false,
            users: DEFAULT_SEED_USERS.map(u => ({ ...u })),
            expenses: [],
            walletTransactions: [],
            notifications: [],
            recycleBin: [],
            userRecycleBin: [],
            passwordRequests: [],
            appSettings: {
                autoDeleteEnabled: false,
                currentVersion: '2.9.0',
                gdriveEnabled: false,
                gdriveClientId: '',
                gdriveFolderId: '',
                gdriveBridgeUrl: '',
                gdriveSharedToken: '',
                gdriveSharedExpiry: 0,
                gdriveConnectedEmail: '',
                gdriveLastError: '',
                maintenanceMode: false,
                maintenanceHours: 2,
                maintenanceUpdatedAt: ''
            },
            filterCategory: 'All',
            filterMonth: 'All',
            filterUser: 'All',
            filterStartDate: '',
            filterEndDate: '',
            searchQuery: ''
        };

        function isPtrAllowed() {
            return Boolean(state.currentUser && !state.isDbLoading && state.activeTab !== 'add');
        }

        function setSessionCookie(jsonStr) {
            try {
                const maxAge = 60 * 60 * 24 * 365 * 5;
                document.cookie = `${SESSION_COOKIE_KEY}=${encodeURIComponent(jsonStr)}; max-age=${maxAge}; path=/; SameSite=Lax`;
            } catch (e) { }
        }

        function getSessionCookie() {
            try {
                const prefix = `${SESSION_COOKIE_KEY}=`;
                const parts = document.cookie.split(';');
                for (let part of parts) {
                    part = part.trim();
                    if (part.startsWith(prefix)) {
                        return decodeURIComponent(part.substring(prefix.length));
                    }
                }
            } catch (e) { }
            return null;
        }

        function clearSessionCookie() {
            try {
                document.cookie = `${SESSION_COOKIE_KEY}=; max-age=0; path=/; SameSite=Lax`;
            } catch (e) { }
        }

        function openSessionIdb() {
            return new Promise((resolve) => {
                if (!window.indexedDB) return resolve(null);
                try {
                    const req = indexedDB.open(SESSION_IDB_NAME, 1);
                    req.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('session')) {
                            db.createObjectStore('session');
                        }
                    };
                    req.onsuccess = (e) => resolve(e.target.result);
                    req.onerror = () => resolve(null);
                } catch (e) { resolve(null); }
            });
        }

        async function writeSessionIdb(userObj) {
            const db = await openSessionIdb();
            if (!db) return;
            try {
                const tx = db.transaction('session', 'readwrite');
                tx.objectStore('session').put(userObj, 'active_user');
            } catch (e) { }
        }

        async function readSessionIdb() {
            const db = await openSessionIdb();
            if (!db) return null;
            return new Promise((resolve) => {
                try {
                    const tx = db.transaction('session', 'readonly');
                    const req = tx.objectStore('session').get('active_user');
                    req.onsuccess = () => resolve(req.result || null);
                    req.onerror = () => resolve(null);
                } catch (e) { resolve(null); }
            });
        }

        async function clearSessionIdb() {
            const db = await openSessionIdb();
            if (!db) return;
            try {
                const tx = db.transaction('session', 'readwrite');
                tx.objectStore('session').delete('active_user');
            } catch (e) { }
        }

        const SESSION_CACHE_KEY_URL = 'https://clickfactory.local/__cf_session__';

        async function writeSessionCache(jsonStr) {
            if (!('caches' in window)) return;
            try {
                const cache = await caches.open('cf-auth-vault-v1');
                await cache.put(SESSION_CACHE_KEY_URL, new Response(jsonStr, {
                    headers: { 'Content-Type': 'application/json' }
                }));
            } catch (e) { }
        }

        async function readSessionCache() {
            if (!('caches' in window)) return null;
            try {
                const cache = await caches.open('cf-auth-vault-v1');
                const res = await cache.match(SESSION_CACHE_KEY_URL);
                if (!res) return null;
                return await res.json();
            } catch (e) { return null; }
        }

        async function clearSessionCache() {
            if (!('caches' in window)) return;
            try {
                const cache = await caches.open('cf-auth-vault-v1');
                await cache.delete(SESSION_CACHE_KEY_URL);
            } catch (e) { }
        }

        function persistCurrentUser(userObj) {
            if (!userObj || !userObj.id) return;
            const safeSession = {
                id: userObj.id,
                name: userObj.name,
                username: userObj.username,
                password: userObj.password,
                role: userObj.role,
                email: userObj.email || '',
                wallet: Number(userObj.wallet || 0),
                excessSpent: Number(userObj.excessSpent || 0)
            };
            const serialized = JSON.stringify(safeSession);
            lsSet(LOCAL_STORAGE_KEY, serialized);
            setSessionCookie(serialized);
            writeSessionIdb(safeSession);
            writeSessionCache(serialized);
            try { window.name = 'CF_SESSION:' + serialized; } catch (e) { }
        }

        function clearPersistedUser() {
            lsRemove(LOCAL_STORAGE_KEY);
            clearSessionCookie();
            clearSessionIdb();
            clearSessionCache();
            try { window.name = ''; } catch (e) { }

        function readSyncSession() {

        function requestGoogleDriveAccessToken(promptMode = '') {
            return new Promise(async (resolve, reject) => {
                const clientId = (state.appSettings && state.appSettings.gdriveClientId || '').trim();
                if (!clientId) return reject(new Error('Missing Google Client ID'));
                try {
                    await loadGoogleIdentityScript();
                    const tokenClient = window.google.accounts.oauth2.initTokenClient({
                        client_id: clientId,
                        scope: 'https://www.googleapis.com/auth/drive.file',
                        callback: (resp) => {
                            if (resp && resp.access_token) {
                                const expiry = Date.now() + ((Number(resp.expires_in) || 3500) * 1000);
                                lsSet(GDRIVE_TOKEN_CACHE_KEY, JSON.stringify({ token: resp.access_token, expiry }));
                                resolve({ token: resp.access_token, expiry });
                            } else {
                                reject(new Error(resp?.error_description || resp?.error || 'Authorization cancelled'));
                            }
                        },
                        error_callback: (err) => {
                            const msg = err?.type === 'popup_failed_to_open'
                                ? 'Popup blocked by preview/browser. Allow popups or use Apps Script URL / Access Token below.'
                                : (err?.message || err?.type || 'OAuth popup closed or origin not whitelisted');

        function dataUrlToBlob(dataUrl) {
            const parts = dataUrl.split(',');
            const mimeMatch = parts[0].match(/:(.*?);/);
            const mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
            const bstr = atob(parts[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while (n--) u8arr[n] = bstr.charCodeAt(n);
            return new Blob([u8arr], { type: mime });
        }

        async function uploadBillViaAppsScriptBridge(dataUrl, fileName) {
            const bridgeUrl = (state.appSettings?.gdriveBridgeUrl || '').trim();
            if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(\?.*)?$/i.test(bridgeUrl)) {
                throw new Error('Option A must be a Google Apps Script Web App URL starting with https://script.google.com/macros/s/.../exec.');
            }
            const folderId = (state.appSettings?.gdriveFolderId || '').trim();
            const payloadStr = JSON.stringify({
                action: 'upload',
                fileName,
                folderId,
                mimeType: 'image/jpeg',
                base64Data: dataUrl.split(',')[1]
            });

            const res = await fetch(bridgeUrl, {
                method: 'POST',
                redirect: 'follow',
                body: payloadStr
            });
            if (!res.ok) throw new Error(`Apps Script HTTP ${res.status}`);
            const text = await res.text();
            let data = null;
            try { data = JSON.parse(text); } catch (e) {
                throw new Error('Apps Script returned HTML instead of JSON. In Apps Script, click Deploy -> Manage deployments -> Edit -> set "Who has access" to "Anyone" and deploy a New Version.');
            }
            if (!data || !data.fileId) throw new Error(data?.error || 'Invalid Apps Script response');
            return {
                driveFileId: data.fileId,
                url: data.url || `https://lh3.googleusercontent.com/d/${data.fileId}=s1200`,
                webViewLink: data.webViewLink || `https://drive.google.com/file/d/${data.fileId}/view`
            };
        }

        async function uploadBillToGoogleDrive(dataUrl, fileName) {
            let bridgeError = null;
            if ((state.appSettings?.gdriveBridgeUrl || '').trim()) {
                try {
                    return await uploadBillViaAppsScriptBridge(dataUrl, fileName);
                } catch (err) {
                    bridgeError = err;
                    if (!getActiveDriveToken() && !(state.appSettings?.gdriveClientId || '').trim()) {
                        const rawMsg = err?.message || String(err);
                        if (rawMsg === 'Failed to fetch') {
                            throw new Error('Blocked by Apps Script access setting. Open script.google.com -> Deploy -> Manage deployments -> Edit -> set "Who has access" to "Anyone" (not "Only myself") and select "New version".');
                        }
                        throw err;
                    }
                }
            }

            let token = getActiveDriveToken();
            if (!token) {
                try {
                    const auth = await requestGoogleDriveAccessToken('');
                    token = auth.token;
                } catch (authErr) {
                    throw bridgeError || authErr;
                }
            }
            const folderId = await ensureDriveBillsFolder(token);
            const blob = dataUrlToBlob(dataUrl);
            const metadata = {
                name: fileName,
                parents: folderId ? [folderId] : []
            };

            const boundary = 'cf_drive_boundary_' + Date.now();
            const delimiter = `\r\n--${boundary}\r\n`;
            const closeDelim = `\r\n--${boundary}--`;

            const metaPart = `${delimiter}Content-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}`;
            const fileHeader = `${delimiter}Content-Type: ${blob.type || 'image/jpeg'}\r\n\r\n`;

            const multipartBody = new Blob([metaPart, fileHeader, blob, closeDelim], {
                type: `multipart/related; boundary=${boundary}`
            });

            const uploadRes = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink,thumbnailLink', {
                method: 'POST',
                headers: { Authorization: `Bearer ${token}` },
                body: multipartBody
            });

            if (!uploadRes.ok) {
                let apiErr = `Drive HTTP ${uploadRes.status}`;
                try {
                    const errJson = await uploadRes.json();
                    apiErr = errJson?.error?.message || apiErr;
                } catch (e) { }
                if (uploadRes.status === 401) {
                    lsRemove(GDRIVE_TOKEN_CACHE_KEY);
                    throw new Error('OAuth token expired (1-hour limit). Use Permanent Apps Script URL or reconnect Drive.');
                }
                throw new Error(apiErr);
            }
            const fileData = await uploadRes.json();
            const fileId = fileData.id;

            try {
                await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}/permissions`, {
                    method: 'POST',
                    headers: {
                        Authorization: `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ role: 'reader', type: 'anyone' })
                });
            } catch (e) { }

            return {
                driveFileId: fileId,
                url: `https://lh3.googleusercontent.com/d/${fileId}=s1200`,
                webViewLink: fileData.webViewLink || `https://drive.google.com/file/d/${fileId}/view`
            };
        }

        async function adjustWallet(userId, delta) {
            const { db, doc, runTransaction } = window.FB;
            const ref = doc(db, 'users', userId);
            const result = await runTransaction(db, async (tx) => {
                const snap = await tx.get(ref);
                if (!snap.exists()) throw new Error('User not found');
                let wallet = round2(snap.data().wallet);
                let excess = round2(snap.data().excessSpent);
                let excessCleared = 0;
                let excessAdded = 0;

                if (delta > 0) {
                    excessCleared = Math.min(excess, delta);
                    excess = round2(excess - excessCleared);
                    wallet = round2(wallet + (delta - excessCleared));
                } else if (delta < 0) {
                    const spend = -delta;
                    if (wallet >= spend) {
                        wallet = round2(wallet - spend);
                    } else {
                        excessAdded = round2(spend - wallet);
                        excess = round2(excess + excessAdded);
                        wallet = 0;
                    }
                }
                tx.update(ref, { wallet, excessSpent: excess });
                return { wallet, excess, excessCleared: round2(excessCleared), excessAdded };
            });

            const local = state.users.find(u => u.id === userId);
            if (local) { local.wallet = result.wallet; local.excessSpent = result.excess; }
            if (state.currentUser && state.currentUser.id === userId) {
                state.currentUser.wallet = result.wallet;
                state.currentUser.excessSpent = result.excess;
                persistCurrentUser(state.currentUser);
            }
            return result;
        }

        async function refundExpenseToUserWallet(userId, amountToRefund, reasonTitle = 'Expense', category = '') {
            const refundAmt = round2(amountToRefund);
            if (!userId || refundAmt <= 0) return;

            const targetUser = state.users.find(u => u.id === userId);
            if (!targetUser || isAdminOrDev(targetUser)) return;

            const res = await adjustWallet(userId, refundAmt);
            const { db, doc, setDoc } = window.FB;
            const txnId = 'txn_' + Date.now() + '_' + Math.random().toString(36).substring(2, 5);
            const catLabel = category ? ` (${category})` : '';
            const walletPart = round2(refundAmt - res.excessCleared);
            let breakdownNote = `Added ${formatCurrency(walletPart)} back to wallet`;
            if (res.excessCleared > 0 && walletPart > 0) {
                breakdownNote = `Cleared ${formatCurrency(res.excessCleared)} Excess Due + Added ${formatCurrency(walletPart)} to Wallet`;
            } else if (res.excessCleared > 0) {
                breakdownNote = `Reduced Excess Spent Due by ${formatCurrency(res.excessCleared)}`;
            }

            await setDoc(doc(db, 'walletTransactions', txnId), {
                id: txnId,
                userId: userId,
                type: 'undo_refund',
                title: `Undo Expense: ${reasonTitle}${catLabel}`,
                subtitle: breakdownNote,
                amount: refundAmt,
                timestamp: new Date().toISOString(),
                performedBy: state.currentUser ? state.currentUser.name : targetUser.name
            });
        }

        window.startAppListeners = function () {
            if (!window.FB) return;
            if (window.__listenersStarted) return;
            window.__listenersStarted = true;
            const { db, collection, onSnapshot, doc, setDoc, deleteDoc } = window.FB;

            window.activeUnsubscribers.push(onSnapshot(collection(db, 'users'), (snapshot) => {
                const fetchedUsers = snapshot.docs.map(docSnap => docSnap.data());
                if (fetchedUsers.length > 0) {
                    state.users = fetchedUsers;
                    if (state.currentUser) {
                        const freshUser = state.users.find(u =>
                            u.id === state.currentUser.id ||

                        );
                        if (freshUser) {
                            state.currentUser = freshUser;
                            persistCurrentUser(freshUser);

                initialSyncFlags.users = true;
                if (state.isDbLoading) checkInitialSyncComplete(); else softRender();
            }, () => {
                initialSyncFlags.users = true;

            }));

            window.activeUnsubscribers.push(onSnapshot(collection(db, 'settings'), (snapshot) => {
                snapshot.docs.forEach(docSnap => {

                        state.appSettings = { ...state.appSettings, ...docSnap.data() };

            window.activeUnsubscribers.push(onSnapshot(collection(db, 'walletTransactions'), (snapshot) => {
                state.walletTransactions = snapshot.docs.map(docSnap => docSnap.data());
                if (!state.isDbLoading) softRender();
            }, () => { }));

            window.activeUnsubscribers.push(onSnapshot(collection(db, 'notifications'), (snapshot) => {
                const allNotifs = snapshot.docs.map(docSnap => docSnap.data());
                if (initialNotificationsLoaded && state.currentUser) {
                    const isAdmin = isAdminOrDev(state.currentUser);
                    allNotifs.forEach(n => {
                        if (!knownNotificationIds.has(n.id)) {
                            const isForMe = (isAdmin && n.recipientRole === 'admin') || (n.recipientId === state.currentUser.id);
                            if (isForMe && !n.read) {
                                const toastType = n.type === 'excess_spent' ? 'error' : 'success';
                                sendBrowserNotification(n.title, n.message, n.type);
                                playNotificationChime(n.type);
                                showToast(`${n.title}: ${n.message}`, toastType);
                            }
                        }
                    });
                }
                knownNotificationIds = new Set(allNotifs.map(n => n.id));
                initialNotificationsLoaded = true;
                state.notifications = allNotifs;
                if (!state.isDbLoading) softRender();
            }, () => { }));

            window.activeUnsubscribers.push(onSnapshot(collection(db, 'expenses'), async (snapshot) => {
                let allExpenses = snapshot.docs.map(docSnap => docSnap.data());
                if (state.appSettings && state.appSettings.autoDeleteEnabled && isAdminOrDev(state.currentUser)) {
                    const now = new Date();
                    const cutoffDate = new Date(now.getFullYear(), now.getMonth() - 2, now.getDate());
                    const expiredExpenses = allExpenses.filter(exp => exp.date && parseLocal(exp.date) < cutoffDate);
                    for (const exp of expiredExpenses) {
                        try {
                            const recycleItem = { ...exp, deletedAt: new Date().toISOString(), deletedBy: 'Auto-Delete System (2-Month Limit)' };
                            await setDoc(doc(db, 'recycleBin', exp.id), recycleItem);
                            await deleteDoc(doc(db, 'expenses', exp.id));
                        } catch (err) { }
                    }
                }
                state.expenses = allExpenses;
                initialSyncFlags.expenses = true;
                if (state.isDbLoading) checkInitialSyncComplete(); else softRender();
            }, () => {
                initialSyncFlags.expenses = true;
                checkInitialSyncComplete();
            }));

            window.activeUnsubscribers.push(onSnapshot(collection(db, 'recycleBin'), (snapshot) => {
                state.recycleBin = snapshot.docs.map(docSnap => docSnap.data());
                if (!state.isDbLoading) softRender();
            }, () => { }));

            window.activeUnsubscribers.push(onSnapshot(collection(db, 'userRecycleBin'), async (snapshot) => {
                let deletedUsers = snapshot.docs.map(docSnap => docSnap.data());
                const now = new Date();
                const stillPending = [];
                for (const item of deletedUsers) {
                    let expired = false;
                    if (item.deletedAt) {
                        const hoursDiff = (now.getTime() - new Date(item.deletedAt).getTime()) / (1000 * 60 * 60);
                        expired = hoursDiff >= 48;
                    }
                    if (expired && isAdminOrDev(state.currentUser)) {
                        try {
                            await deleteDoc(doc(db, 'userRecycleBin', item.userId));
                            await deleteDoc(doc(db, 'users', item.userId));
                            const userExps = state.expenses.filter(e => e.userId === item.userId);
                            for (const ue of userExps) {
                                await deleteDoc(doc(db, 'expenses', ue.id));
                            }
                        } catch (e) {
                            stillPending.push(item);
                        }
                        continue;
                    }
                    stillPending.push(item);
                }
                state.userRecycleBin = stillPending;
                if (!state.isDbLoading) softRender();
            }, () => { }));

            window.activeUnsubscribers.push(onSnapshot(collection(db, 'passwordRequests'), (snapshot) => {
                state.passwordRequests = snapshot.docs.map(docSnap => docSnap.data());
                if (!state.isDbLoading) softRender();
            }, () => { }));
        };

        function showToast(message, type = 'success', undoCallback = null) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');

            let bgStyle = 'bg-slate-900/95 text-white border-slate-700/80 shadow-slate-900/30';
            let icon = 'fa-circle-info text-indigo-400';

            if (type === 'success') {
                bgStyle = 'bg-emerald-600/95 text-white border-emerald-500/60 shadow-emerald-900/25';
                icon = 'fa-circle-check text-emerald-200';
            } else if (type === 'error') {
                bgStyle = 'bg-rose-600/95 text-white border-rose-500/60 shadow-rose-900/25';
                icon = 'fa-circle-exclamation text-rose-200';
            }

            toast.className = `${bgStyle} border px-3 py-2 rounded-xl shadow-lg flex items-center justify-between text-[11px] sm:text-xs font-medium transform transition-all duration-300 translate-y-[20px] opacity-0 pointer-events-auto gap-2 backdrop-blur-xl`;

            const wantsUndo = undoCallback && (!state.currentUser || !isAdminOrDev(state.currentUser));
            const undoBtnHtml = wantsUndo
                ? `<button id="toast-undo-btn" class="px-2 py-0.5 bg-white text-slate-900 rounded-lg font-bold text-[11px] hover:bg-slate-100 transition shrink-0 shadow-sm">Undo</button>`
                : '';

            toast.innerHTML = `
                <div class="flex items-center space-x-2 min-w-0 flex-1">
                    <i class="fa-solid ${icon} text-xs shrink-0"></i>
                    <span class="flex-1 break-words leading-tight">${escapeHtml(message)}</span>
                </div>
                ${undoBtnHtml}
            `;

            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-[20px]', 'opacity-0'));

            if (wantsUndo) {
                const undoBtn = toast.querySelector('#toast-undo-btn');
                if (undoBtn) {
                    undoBtn.onclick = () => {
                        undoCallback();
                        toast.classList.add('translate-y-[20px]', 'opacity-0');
                        setTimeout(() => toast.remove(), 300);
                    };
                }
            }

            setTimeout(() => {
                toast.classList.add('translate-y-[20px]', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        async function handleWalletAdd(e, userId) {
            e.preventDefault();
            const submitBtn = document.getElementById('wallet-submit-btn');
            if (submitBtn && submitBtn.disabled) return;

            const amountToAdd = round2(parseFloat(document.getElementById('wallet-add-amount').value));
            if (isNaN(amountToAdd) || amountToAdd === 0) {
                showToast('Please enter a valid amount.', 'error');
                return;
            }

            const user = state.users.find(u => u.id === userId);
            if (!user) return;

            if (submitBtn) submitBtn.disabled = true;

            try {
                const res = await adjustWallet(userId, amountToAdd);
                const { db, doc, setDoc } = window.FB;
                const walletPart = round2(amountToAdd - res.excessCleared);

                const txnId = 'txn_' + Date.now();
                let txnTitle = amountToAdd >= 0 ? 'Added Wallet Funds' : 'Shortage Money Adjustment';
                let txnType = amountToAdd >= 0 ? 'topup' : 'shortage';
                if (amountToAdd > 0 && res.excessCleared > 0 && walletPart > 0) {
                    txnTitle = `Cleared Excess (₹${res.excessCleared}) & Added Wallet (₹${walletPart})`;
                    txnType = 'excess_cleared';
                } else if (amountToAdd > 0 && res.excessCleared > 0) {
                    txnTitle = 'Cleared Excess Spent Due';
                    txnType = 'excess_cleared';
                }

                await setDoc(doc(db, 'walletTransactions', txnId), {
                    id: txnId,
                    userId: userId,
                    type: txnType,
                    title: txnTitle,
                    amount: Math.abs(amountToAdd),
                    timestamp: new Date().toISOString(),
                    performedBy: state.currentUser.name
                });

                const notifTitle = amountToAdd > 0 ? 'Wallet Credited!' : 'Wallet Balance Adjusted';
                let notifMessage = amountToAdd > 0
                    ? `${state.currentUser.name} added ${formatCurrency(amountToAdd)} to your wallet. Available Balance: ${formatCurrency(res.wallet)}.`
                    : `${state.currentUser.name} adjusted your wallet by ${formatCurrency(amountToAdd)}. Available Balance: ${formatCurrency(res.wallet)}.`;

                if (amountToAdd > 0 && res.excessCleared > 0) {
                    notifMessage = `${state.currentUser.name} added ${formatCurrency(amountToAdd)} (${formatCurrency(res.excessCleared)} settled excess due). New Balance: ${formatCurrency(res.wallet)}.`;
                }

                await createAppNotification({
                    recipientId: userId,
                    recipientRole: 'user',
                    type: amountToAdd > 0 ? 'wallet_credit' : 'wallet_debit',
                    title: notifTitle,
                    message: notifMessage,
                    amount: Math.abs(amountToAdd),
                    triggeredBy: state.currentUser.name
                });

                closeModal();
                showToast(`Successfully processed ${formatCurrency(amountToAdd)} for ${user.name}!`, 'success');
            } catch (err) {
                if (submitBtn) submitBtn.disabled = false;
                showToast('Failed to update wallet. Please try again.', 'error');
            }
        }

                    ${isSubTab ? `
                        <button onclick="switchTab('${backTargetTab}')" class="w-10 h-10 rounded-2xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 transition border border-slate-200/80 dark:border-slate-700/70 shrink-0 shadow-sm" title="Back">
                            <i class="fa-solid fa-arrow-left text-sm"></i>
                        </button>
                    ` : `
                        <div class="w-10 h-10 flex items-center justify-center overflow-hidden shrink-0 logo-container">
                            <img src="https://clickfactoryphotography.com/wp-content/uploads/2022/04/crop-logo.gif" alt="Click Factory Logo" class="w-full h-full object-contain" onerror="this.src='https://placehold.co/40x40/4f46e5/ffffff?text=CF'">
                        </div>
                    `}
                    <div class="min-w-0 flex-1">
                        <div class="flex items-center gap-2">
                            <h1 class="font-bold text-base sm:text-lg leading-tight tracking-tight text-slate-900 dark:text-white truncate">${isSubTab ? subTabTitle : 'Click Factory'}</h1>
                        </div>
                        <div class="flex items-center mt-0.5">
                            ${isSubTab ? `
                                <p class="text-[11px] text-slate-500 dark:text-slate-400 font-medium truncate">${state.activeTab === 'notifications' ? 'Activity & Alerts' : 'Back to Profile'}</p>
                            ` : (isDev ? `
                                <span class="inline-flex items-center gap-1 text-[11px] font-semibold text-violet-600 dark:text-violet-400">
                                    <i class="fa-solid fa-code text-[10px]"></i>
                                    <span>Developer</span>
                                </span>
                            ` : (isAdmin ? `
                                <span class="inline-flex items-center gap-1 text-[11px] font-semibold text-indigo-600 dark:text-indigo-400">
                                    <i class="fa-solid fa-shield-halved text-[10px]"></i>
                                    <span>Admin</span>
                                </span>
                            ` : `
                                <p class="text-[11px] text-slate-500 dark:text-slate-400 font-medium truncate">Expense Tracker</p>
                            `))}
                        </div>
                    </div>
                </div>

                <div class="flex items-center space-x-2.5 shrink-0">
                    <button onclick="switchTab('notifications')" class="relative w-10 h-10 rounded-2xl ${state.activeTab === 'notifications' ? 'bg-indigo-600 text-white border-indigo-500' : 'bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-slate-800 border-slate-200/80 dark:border-slate-800'} flex items-center justify-center transition border shadow-sm" title="Notifications">
                        <i class="fa-solid fa-bell text-sm ${unreadNotifCount > 0 && state.activeTab !== 'notifications' ? 'animate-bounce text-indigo-600 dark:text-indigo-400' : ''}"></i>
                        ${unreadNotifCount > 0 ? `<span class="liquid-badge">${unreadNotifCount > 99 ? '99+' : unreadNotifCount}</span>` : ''}
                    </button>
                    <button onclick="confirmLogout()" class="w-10 h-10 rounded-2xl bg-rose-500/10 dark:bg-rose-950/50 flex items-center justify-center text-rose-600 dark:text-rose-400 hover:bg-rose-500/20 transition border border-rose-500/20 dark:border-rose-900/60 shadow-sm" title="Logout">
                        <i class="fa-solid fa-arrow-right-from-bracket text-sm"></i>
                    </button>
                </div>
            `;
        }

        function syncPersistentNavbar() {
            const navWrapper = document.getElementById('persistent-nav-wrapper');
            if (!navWrapper) return;

            const isMaintenanceLocked = Boolean(state.appSettings && state.appSettings.maintenanceMode && !isDeveloper(state.currentUser));

            if (!state.currentUser || state.isDbLoading || isMaintenanceLocked) {
                navWrapper.classList.add('hidden');
                navWrapper.style.display = 'none';
                return;
            }

            navWrapper.classList.remove('hidden');
            navWrapper.style.display = 'flex';

            const isAdmin = isAdminOrDev(state.currentUser);
            const isDev = isDeveloper(state.currentUser);
            const pendingRequestsCount = state.passwordRequests.filter(r => r.status === 'pending').length;
            const visibleDeletedUsers = isDev ? state.userRecycleBin : state.userRecycleBin.filter(u => u.role !== 'developer');
            const totalBadges = state.recycleBin.length + pendingRequestsCount + visibleDeletedUsers.length;

            const usersBtn = document.getElementById('nav-btn-users');
            const usersIcon = document.getElementById('nav-users-icon');
            const usersLabel = document.getElementById('nav-users-label');
            if (isAdmin) {
                usersBtn.onclick = () => switchTab('users');
                usersIcon.className = 'fa-solid fa-users';
                usersLabel.textContent = 'Users';
            } else {
                usersBtn.onclick = () => switchTab('wallet');
                usersIcon.className = 'fa-solid fa-wallet';
                usersLabel.textContent = 'Wallet';
            }

            const badgeEl = document.getElementById('nav-badge');
            if (badgeEl) {
                if (isAdmin && totalBadges > 0) {
                    badgeEl.textContent = totalBadges;
                    badgeEl.className = 'liquid-badge';
                    badgeEl.classList.remove('hidden');
                } else {
                    badgeEl.classList.add('hidden');
                }
            }

            let activeTargetId = 'nav-btn-home';
            if (state.activeTab === 'home' || state.activeTab === 'notifications') activeTargetId = 'nav-btn-home';
            else if (state.activeTab === 'admin' || state.activeTab === 'analytics') activeTargetId = 'nav-btn-summary';
            else if ((state.activeTab === 'users' && isAdmin) || (state.activeTab === 'wallet' && !isAdmin)) activeTargetId = 'nav-btn-users';
            else if (state.activeTab === 'profile' || ['recycle', 'requests', 'userRecycle'].includes(state.activeTab)) activeTargetId = 'nav-btn-profile';

            const nav = document.getElementById('liquid-nav');
            const bubble = document.getElementById('liquid-bubble');
            if (!nav || !bubble) return;

            let targetBtn = null;
            nav.querySelectorAll('.liquid-nav-btn').forEach(btn => {
                if (btn.id === activeTargetId) {
                    btn.classList.add('is-active');
                    btn.setAttribute('aria-current', 'page');
                    targetBtn = btn;
                } else {
                    btn.classList.remove('is-active');
                    btn.removeAttribute('aria-current');
                }
            });
            if (targetBtn && targetBtn.offsetWidth > 0) {
                bubble.style.width = `${targetBtn.offsetWidth}px`;
                bubble.style.webkitTransform = `translate3d(${targetBtn.offsetLeft}px, 0, 0)`;
                bubble.style.transform = `translate3d(${targetBtn.offsetLeft}px, 0, 0)`;
            }
        }

        function openNewExpenseTab() {
            state.editingExpenseId = null;
            state.tempBillData = null;
            state.tempFormCache = null;
            switchTab('add');
        }

        function switchTab(tab, keepEditState = false) {
            const prevTab = state.activeTab;
            const resolvedTab = tab === 'summary'
                ? (isAdminOrDev(state.currentUser) ? 'admin' : 'analytics')
                : tab;
            if (prevTab === resolvedTab && !keepEditState) {
                syncPersistentNavbar();
                return;
            }
            const prevIndex = tabOrder.indexOf(prevTab);
            state.activeTab = resolvedTab;
            const nextIndex = tabOrder.indexOf(state.activeTab);
            if (state.activeTab === 'add' || state.activeTab === 'notifications') {
                state.slideDirection = 'animate-slide-up';
            } else if (prevTab === 'add' || prevTab === 'notifications') {
                state.slideDirection = 'animate-zoom-out-enter';
            } else {
                state.slideDirection = nextIndex >= prevIndex ? 'animate-slide-right' : 'animate-slide-left';
            }

            if (!keepEditState) {
                state.editingExpenseId = null;
                state.tempBillData = null;
                state.tempFormCache = null;
            }

            syncPersistentHeader();
            syncPersistentNavbar();
            render();
        }

        function render() {
            const app = document.getElementById('app');
            if (!app) return;

            applyTheme();

            if (state.isDbLoading) {
                syncPersistentHeader();
                syncPersistentNavbar();
                app.innerHTML = renderDatabaseLoadingScreen();
                return;
            }

            const shouldPlayZoomEntrance = state.justFinishedLoading;
            if (state.justFinishedLoading) state.justFinishedLoading = false;

            if (!state.currentUser) {
                syncPersistentHeader();
                syncPersistentNavbar();
                app.innerHTML = state.authView === 'forgot' ? renderForgotPasswordPage() : renderLoginPage();
                return;
            }

            if (state.appSettings && state.appSettings.maintenanceMode && !isDeveloper(state.currentUser)) {
                syncPersistentHeader();
                syncPersistentNavbar();
                app.innerHTML = renderMaintenanceScreen();
                return;
            }

            syncPersistentHeader();
            const showPtr = isPtrAllowed();

            app.innerHTML = `
                <main id="main-content" class="flex-1 overflow-y-auto no-scrollbar px-4 sm:px-6 w-full max-w-full ${state.slideDirection || 'animate-slide-right'}">
                    ${showPtr ? `
                    <div id="ptr-container">
                        <div class="ptr-pill">
                            <i id="ptr-icon" class="fa-solid fa-arrow-down"></i>
                            <span id="ptr-text">Pull to refresh</span>
                        </div>
                    </div>` : ''}
                    ${renderActiveTabContent()}
                </main>

                <div id="add-fab-container">
                    ${state.activeTab !== 'add' ? fabButtonHtml() : ''}
                </div>
            `;

            if (shouldPlayZoomEntrance) triggerZoomOutEntrance();
            syncPersistentNavbar();
            requestAnimationFrame(() => {
                if (typeof syncHomeCategoryBubble === 'function') syncHomeCategoryBubble(false);
                if (typeof syncUserFilterBubble === 'function') syncUserFilterBubble(false);
                if (typeof syncFormCategoryBubble === 'function') syncFormCategoryBubble(false);
                if (typeof syncAppearanceBubble === 'function') syncAppearanceBubble(false);
            });
        }

        function renderHomeTab() {
            const isAdmin = isAdminOrDev(state.currentUser);
            const isDev = isDeveloper(state.currentUser);
            const selectableUsers = isDev ? state.users : state.users.filter(u => u.role !== 'developer');
            let filtered = getFilteredExpenses();

            filtered.sort((a, b) => {
                const cmp = (b.date || '').localeCompare(a.date || '');
                return cmp !== 0 ? cmp : (b.createdAt || '').localeCompare(a.createdAt || '');
            });

            const totalAmount = filtered.reduce((sum, e) => sum + e.amount, 0);
            const officeTotal = filtered.filter(e => e.category === 'Office').reduce((sum, e) => sum + e.amount, 0);
            const shootTotal = filtered.filter(e => e.category === 'Shoot').reduce((sum, e) => sum + e.amount, 0);

            const monthsSet = new Set(state.expenses.map(e => e.date ? e.date.substring(0, 7) : ''));
            const availableMonths = Array.from(monthsSet).filter(Boolean).sort().reverse();
            const hasDateFilterActive = state.filterStartDate || state.filterEndDate;

            const groupedByDate = {};
            filtered.forEach(exp => {
                const dKey = exp.date || 'Unknown';
                if (!groupedByDate[dKey]) groupedByDate[dKey] = [];
                groupedByDate[dKey].push(exp);
            });
            const sortedDates = Object.keys(groupedByDate).sort((a, b) => b.localeCompare(a));

            return `
                <div class="space-y-3.5 w-full max-w-full">
                    <div class="liquid-hero-card rounded-[26px] p-4 sm:p-5 text-white relative overflow-hidden w-full">
                        <div class="relative flex items-start justify-between gap-3">
                            <div class="min-w-0 flex-1">
                                <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-white/10 border border-white/15 text-[9.5px] font-semibold uppercase tracking-[0.12em] text-indigo-100/90 mb-1.5">
                                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                                    <span class="truncate">${isAdmin ? 'Total Filtered Expenses' : 'My Total Expenses'}</span>
                                </div>
                                <h2 class="text-2xl sm:text-3xl font-bold tracking-tight tabular-nums text-white break-all leading-none">${formatCurrency(totalAmount)}</h2>
                                <div class="mt-2.5">
                                    <span class="inline-flex items-center gap-1.5 bg-white/10 text-indigo-50 text-[10.5px] font-semibold px-2.5 py-1 rounded-xl border border-white/15">
                                        <i class="fa-solid fa-layer-group text-[9.5px] text-indigo-300"></i>
                                        <span>${filtered.length} ${filtered.length === 1 ? 'Item' : 'Items'}</span>
                                    </span>
                                </div>
                            </div>
                            <div class="shrink-0">
                                ${(() => {
                                    const offPct = totalAmount > 0 ? Math.round((officeTotal / totalAmount) * 100) : 0;
                                    const shtPct = totalAmount > 0 ? 100 - offPct : 0;
                                    const cx = 24, cy = 24, r = 20;
                                    let pieInner = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.22)" stroke-width="1"></circle>`;
                                    if (totalAmount > 0) {
                                        if (officeTotal >= totalAmount) {
                                            pieInner = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#f59e0b" stroke="rgba(255,255,255,0.45)" stroke-width="1"></circle>`;
                                        } else if (shootTotal >= totalAmount) {
                                            pieInner = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#818cf8" stroke="rgba(255,255,255,0.45)" stroke-width="1"></circle>`;
                                        } else {
                                            const angle = (officeTotal / totalAmount) * 2 * Math.PI - Math.PI / 2;
                                            const x = (cx + r * Math.cos(angle)).toFixed(2);
                                            const y = (cy + r * Math.sin(angle)).toFixed(2);
                                            const largeArc = officeTotal / totalAmount > 0.5 ? 1 : 0;
                                            pieInner = `
                                                <circle cx="${cx}" cy="${cy}" r="${r}" fill="#818cf8"></circle>
                                                <path d="M ${cx} ${cy} L ${cx} ${cy - r} A ${r} ${r} 0 ${largeArc} 1 ${x} ${y} Z" fill="#f59e0b"></path>
                                                <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy - r}" stroke="rgba(15,23,42,0.55)" stroke-width="1.2"></line>
                                                <line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(15,23,42,0.55)" stroke-width="1.2"></line>
                                                <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1"></circle>
                                            `;
                                        }
                                    }
                                    return `
                                    <div class="flex items-center gap-2 bg-white/[0.08] border border-white/15 rounded-2xl px-2.5 py-2 shrink-0" title="Office ${offPct}% (${formatCurrency(officeTotal)}) • Shoot ${shtPct}% (${formatCurrency(shootTotal)})">
                                        <svg class="w-10 h-10 shrink-0 drop-shadow-sm" viewBox="0 0 48 48" aria-hidden="true">${pieInner}</svg>
                                        <div class="text-[9.5px] leading-tight pr-0.5 tabular-nums">
                                            <div class="flex items-center gap-1 text-amber-200 font-semibold"><span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span><span>Off ${offPct}%</span></div>
                                            <div class="flex items-center gap-1 text-indigo-200 font-semibold mt-1"><span class="w-1.5 h-1.5 rounded-full bg-indigo-400"></span><span>Sht ${shtPct}%</span></div>
                                        </div>
                                    </div>`;
                                })()}
                            </div>
                        </div>

                        ${totalAmount > 0 ? `
                        <div class="relative mt-3.5">
                            <div class="h-1.5 w-full rounded-full bg-white/10 overflow-hidden flex gap-0.5 p-0.5 border border-white/10">
                                <div class="h-full rounded-full bg-gradient-to-r from-amber-300 to-amber-500 transition-all duration-500" style="width: ${Math.round((officeTotal / totalAmount) * 100)}%"></div>
                                <div class="h-full rounded-full bg-gradient-to-r from-indigo-300 to-violet-400 transition-all duration-500" style="width: ${Math.round((shootTotal / totalAmount) * 100)}%"></div>
                            </div>
                        </div>
                        ` : ''}

                        <div class="relative grid grid-cols-2 gap-2.5 mt-3">
                            <div class="bg-white/[0.07] rounded-2xl p-2.5 sm:p-3 min-w-0 border border-white/[0.12] flex items-center gap-2.5">
                                <div class="w-8 h-8 rounded-xl bg-amber-400/20 border border-amber-200/25 text-amber-200 flex items-center justify-center shrink-0">
                                    <i class="fa-solid fa-briefcase text-xs"></i>
                                </div>
                                <div class="min-w-0 flex-1">
                                    <div class="flex items-center justify-between gap-1">
                                        <span class="text-[10.5px] font-medium text-indigo-100/75 truncate">Office</span>
                                        ${totalAmount > 0 ? `<span class="text-[9.5px] font-semibold text-amber-200/90 tabular-nums">${Math.round((officeTotal / totalAmount) * 100)}%</span>` : ''}
                                    </div>
                                    <p class="font-bold text-xs sm:text-sm tabular-nums text-white break-all mt-0.5">${formatCurrency(officeTotal)}</p>
                                </div>
                            </div>
                            <div class="bg-white/[0.07] rounded-2xl p-2.5 sm:p-3 min-w-0 border border-white/[0.12] flex items-center gap-2.5">
                                <div class="w-8 h-8 rounded-xl bg-indigo-400/20 border border-indigo-200/25 text-indigo-200 flex items-center justify-center shrink-0">
                                    <i class="fa-solid fa-clapperboard text-xs"></i>
                                </div>
                                <div class="min-w-0 flex-1">
                                    <div class="flex items-center justify-between gap-1">
                                        <span class="text-[10.5px] font-medium text-indigo-100/75 truncate">Shoot</span>
                                        ${totalAmount > 0 ? `<span class="text-[9.5px] font-semibold text-indigo-200/90 tabular-nums">${Math.round((shootTotal / totalAmount) * 100)}%</span>` : ''}
                                    </div>
                                    <p class="font-bold text-xs sm:text-sm tabular-nums text-white break-all mt-0.5">${formatCurrency(shootTotal)}</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-3 w-full">
                        <div class="flex items-center space-x-2 w-full">

                                <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500 dark:text-slate-400 z-10">
                                    <i class="fa-solid fa-magnifying-glass text-sm"></i>
                                </span>
                                <input type="text" id="search-input" value="${escapeHtml(state.searchQuery)}" oninput="handleSearchInput(event)" placeholder="Search expenses, notes, client, user..." class="w-full pl-10 pr-10 py-3.5 ios-glass-card border border-slate-200/80 dark:border-slate-800 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm text-slate-900 dark:text-white placeholder:text-slate-400">
                                ${state.searchQuery ? `<button onclick="clearSearch()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600 z-10"><i class="fa-solid fa-xmark"></i></button>` : ''}
                            </div>
                            <button onclick="toggleDateFilter()" class="w-12 h-12 rounded-2xl ${state.showDateFilter || hasDateFilterActive ? 'bg-indigo-600 text-white shadow-md' : 'ios-glass-card text-slate-600 dark:text-slate-400 border border-slate-200/80 dark:border-slate-800'} flex items-center justify-center shrink-0 relative" title="Toggle Date Filter">
                                <i class="fa-solid fa-calendar-days text-sm"></i>
                                ${hasDateFilterActive ? '<span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-amber-400"></span>' : ''}
                            </button>
                        </div>

                        <div id="home-cat-dock" class="liquid-sub-dock w-full" role="tablist" aria-label="Filter expenses by category">
                            <div id="home-cat-bubble" class="liquid-sub-bubble" aria-hidden="true"></div>
                            <button type="button" id="home-cat-btn-All" onclick="setFilterCategory('All')" class="liquid-sub-btn ${state.filterCategory === 'All' ? 'is-active' : ''}" role="tab" aria-selected="${state.filterCategory === 'All'}">
                                <span class="truncate">All Categories</span>
                            </button>
                            <button type="button" id="home-cat-btn-Office" onclick="setFilterCategory('Office')" class="liquid-sub-btn ${state.filterCategory === 'Office' ? 'is-active' : ''}" role="tab" aria-selected="${state.filterCategory === 'Office'}">
                                <span class="truncate">Office Expense</span>
                            </button>
                            <button type="button" id="home-cat-btn-Shoot" onclick="setFilterCategory('Shoot')" class="liquid-sub-btn ${state.filterCategory === 'Shoot' ? 'is-active' : ''}" role="tab" aria-selected="${state.filterCategory === 'Shoot'}">
                                <span class="truncate">Shoot Expense</span>
                            </button>
                        </div>

                        <div class="grid grid-cols-${isAdmin ? '2' : '1'} gap-2.5 w-full">
                            <div class="relative w-full">
                                <select onchange="setFilterMonth(this.value)" class="w-full appearance-none ios-glass-card border border-slate-200/80 dark:border-slate-800 rounded-2xl px-3.5 py-3 text-xs font-medium text-slate-700 dark:text-slate-300">
                                    <option value="All" ${state.filterMonth === 'All' && !state.filterStartDate && !state.filterEndDate ? 'selected' : ''}>All Months</option>
                                    ${availableMonths.map(m => `<option value="${m}" ${state.filterMonth === m ? 'selected' : ''}>${formatMonthName(m)}</option>`).join('')}

                            ${isAdmin ? `
                            <div class="relative w-full">
                                <select onchange="setFilterUser(this.value)" class="w-full appearance-none ios-glass-card border border-slate-200/80 dark:border-slate-800 rounded-2xl px-3.5 py-3 text-xs font-medium text-slate-700 dark:text-slate-300">
                                    <option value="All" ${state.filterUser === 'All' ? 'selected' : ''}>All Users</option>${selectableUsers.map(u => `<option value="${escapeHtml(u.id)}" ${state.filterUser === u.id ? 'selected' : ''}>${escapeHtml(u.name)}</option>`).join('')}
                                </select>
                                <span class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-400 text-xs"><i class="fa-solid fa-chevron-down"></i></span>
                            </div>
                            ` : ''}
                        </div>

                        ${state.showDateFilter ? `
                        <div class="ios-glass-card p-2.5 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm space-y-1.5 w-full">
                            <div class="flex items-center justify-between text-[11px] font-semibold text-slate-700 dark:text-slate-300 px-1">
                                <span><i class="fa-solid fa-calendar-days mr-1 text-indigo-500"></i>Date Range Filter</span>
                                ${(state.filterStartDate || state.filterEndDate) ? `<button onclick="clearDateRange()" class="text-indigo-600 dark:text-indigo-400 hover:underline">Clear</button>` : ''}
                            </div>
                            <div class="grid grid-cols-2 gap-1.5 w-full">
                                <div class="custom-date-wrapper rounded-xl border border-slate-200/80 dark:border-slate-700 overflow-hidden">
                                    <input type="date" id="filter-start-date" value="${state.filterStartDate}" onchange="setFilterStartDate(this.value)" required class="w-full px-2.5 py-1.5 bg-transparent text-[11px] text-slate-900 dark:text-white min-h-[36px] focus:outline-none">
                                    <span class="custom-date-placeholder">dd-mm-yy</span>
                                </div>
                                <div class="custom-date-wrapper rounded-xl border border-slate-200/80 dark:border-slate-700 overflow-hidden">
                                    <input type="date" id="filter-end-date" value="${state.filterEndDate}" onchange="setFilterEndDate(this.value)" required class="w-full px-2.5 py-1.5 bg-transparent text-[11px] text-slate-900 dark:text-white min-h-[36px] focus:outline-none">
                                    <span class="custom-date-placeholder">dd-mm-yy</span>
                                </div>
                            </div>
                        </div>
                        ` : ''}
                    </div>

                    <div class="space-y-3 mt-3 w-full">
                        <div class="flex items-center justify-between px-1 pt-2">
                            <h3 class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Expense Records</h3>

        function resizeImageToDataUrl(source, srcW, srcH) {
            const maxDim = 900;
            let width = srcW, height = srcH;
            if (width >= height && width > maxDim) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
            } else if (height > maxDim) {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            canvas.getContext('2d').drawImage(source, 0, 0, width, height);
            return canvas.toDataURL('image/jpeg', 0.82);
        }

        function handleBillUpload(event) {
            updateFormCache();
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (uploadEvent) {
                const img = new Image();
                img.onload = function () {
                    state.tempBillData = resizeImageToDataUrl(img, img.width, img.height);
                    showToast('Bill attached successfully!', 'success');
                    renderMainContentOnly();
                };
                img.onerror = () => showToast('Could not read that image.', 'error');
                img.src = uploadEvent.target.result;
            };
            reader.readAsDataURL(file);
        }

            updateFormCache();

            root.innerHTML = `

            `;

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {

        function takeSnapshot() {

        function syncAppearanceBubble(animate = true) {
            const dock = document.getElementById('appearance-sub-dock');
            const bubble = document.getElementById('appearance-sub-bubble');
            const activeBtn = document.getElementById(`theme-btn-${state.themeMode}`);
            if (!dock || !bubble || !activeBtn) return;

            if (!animate) bubble.style.transition = 'none';
            bubble.style.width = `${activeBtn.offsetWidth}px`;
            bubble.style.webkitTransform = `translate3d(${activeBtn.offsetLeft}px, 0, 0)`;
            bubble.style.transform = `translate3d(${activeBtn.offsetLeft}px, 0, 0)`;

            dock.querySelectorAll('.liquid-sub-btn').forEach(btn => {
                const isActive = btn.id === activeBtn.id;
                btn.classList.toggle('is-active', isActive);
                btn.setAttribute('aria-selected', String(isActive));
            });

            if (!animate) {
                requestAnimationFrame(() => {
                    bubble.style.transition = '';
                });
            }
        }

        function setThemeMode(mode) {
            if (state.themeMode === mode) {
                syncAppearanceBubble(true);
                return;
            }
            const dock = document.getElementById('appearance-sub-dock');
            const bubble = document.getElementById('appearance-sub-bubble');
            const prevLeft = bubble ? bubble.style.transform : '';
            const prevWidth = bubble ? bubble.style.width : '';

            state.themeMode = mode;
            lsSet(THEME_STORAGE_KEY, mode);
            applyTheme();

            const labelEl = document.getElementById('appearance-mode-label');
            if (labelEl) {
                labelEl.textContent = state.themeMode === 'system'
                    ? `System (${state.darkMode ? 'Dark' : 'Light'})`
                    : state.themeMode;
            }

            if (dock && bubble) {
                const targetBtn = document.getElementById(`theme-btn-${mode}`);
                if (targetBtn) {
                    if (prevLeft && prevWidth) {
                        bubble.style.transition = 'none';
                        bubble.style.width = prevWidth;
                        bubble.style.webkitTransform = prevLeft;
                        bubble.style.transform = prevLeft;
                        void bubble.offsetWidth;
                        bubble.style.transition = '';
                    }
                    requestAnimationFrame(() => {
                        bubble.style.width = `${targetBtn.offsetWidth}px`;
                        bubble.style.webkitTransform = `translate3d(${targetBtn.offsetLeft}px, 0, 0)`;
                        bubble.style.transform = `translate3d(${targetBtn.offsetLeft}px, 0, 0)`;
                    });
                    dock.querySelectorAll('.liquid-sub-btn').forEach(btn => {
                        const isActive = btn.id === targetBtn.id;
                        btn.classList.toggle('is-active', isActive);
                        btn.setAttribute('aria-selected', String(isActive));
                    });
                }
            }

            const label = mode === 'system' ? 'System Auto' : (mode === 'dark' ? 'Dark Mode' : 'Light Mode');
            showToast(`Theme set to ${label}`, 'info');
        }

        function updateBillSubmitOverlay({ title, subtitle, progress, step = 1, icon = 'fa-receipt', completed = false }) {
            const titleEl = document.getElementById('submit-status-title');
            const subEl = document.getElementById('submit-status-sub');
            const barEl = document.getElementById('submit-progress-bar');
            const iconEl = document.getElementById('submit-step-icon');

            const ringEl = document.getElementById('submit-spinner-ring');

                if (!dot) return;
                if (completed) {

                } else if (idx <= step) {
                    dot.className = 'w-2 h-2 rounded-full bg-indigo-600 transition-colors';
                } else {

                }
            });

            if (completed) {
                triggerHaptic(18);
                if (ringEl) {
                    ringEl.classList.remove('simple-spinner', 'border-indigo-500/20', 'border-t-indigo-600', 'dark:border-t-indigo-400');
