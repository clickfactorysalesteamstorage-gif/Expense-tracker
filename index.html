        async function handleExpenseSubmit(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('expense-submit-btn');
            if (submitBtn && submitBtn.disabled) return;

            const category = document.getElementById('expense-category').value;
            const amount = round2(parseFloat(document.getElementById('expense-amount').value));
            const title = document.getElementById('expense-title').value.trim();
            const date = document.getElementById('expense-date').value;
            const clientNamePlace = category === 'Shoot' ? document.getElementById('expense-client').value.trim() : '';
            const notes = document.getElementById('expense-notes').value.trim();

            if (!title || isNaN(amount) || amount <= 0 || !date) {
                showToast('Please fill in all required fields.', 'error');
                return;
            }

            if (submitBtn) submitBtn.disabled = true;
            const hasNewBillUpload = Boolean(state.tempBillData && String(state.tempBillData).startsWith('data:image'));
            const wasEditing = Boolean(state.editingExpenseId);
            showBillSubmitOverlay(wasEditing ? 'Updating Expense' : 'Submitting Expense', hasNewBillUpload);
            const { db, storage, doc, setDoc, storageRef, uploadString, getDownloadURL, deleteObject } = window.FB;

            const expenseId = state.editingExpenseId || ('exp_' + Date.now());
            const existingExp = state.editingExpenseId ? state.expenses.find(e => e.id === expenseId) : null;
            let billUrl = null;
            let driveFileId = existingExp ? (existingExp.driveFileId || null) : null;
            let driveWebViewLink = existingExp ? (existingExp.driveWebViewLink || null) : null;
            let walletDelta = 0;
            let walletOwnerId = null;

            try {
                if (state.tempBillData === '') {
                    billUrl = null;
                    if (existingExp && existingExp.driveFileId) {
                        await deleteBillFromGoogleDrive(existingExp.driveFileId);
                    }
                    if (existingExp && existingExp.billAttachment && existingExp.billAttachment.includes('firebasestorage')) {
                        try { await deleteObject(storageRef(storage, `bills/${expenseId}.jpg`)); } catch (e) { }
                    }
                    driveFileId = null;
                    driveWebViewLink = null;
                } else if (state.tempBillData !== null && state.tempBillData !== undefined) {
                    if (state.tempBillData.startsWith('data:image')) {
                        updateBillSubmitOverlay({
                            subtitle: 'Uploading receipt attachment...',
                            progress: 42,
                            step: 1,
                            icon: 'fa-cloud-arrow-up'
                        });
                        const driveConfigured = isGoogleDriveConfigured();
                        let uploaded = false;

                        if (driveConfigured && navigator.onLine) {
                            try {
                                const safeFileName = `${date}_${title.replace(/[^a-zA-Z0-9_-]/g, '_')}_${expenseId}.jpg`;
                                const driveRes = await uploadBillToGoogleDrive(state.tempBillData, safeFileName);
                                billUrl = driveRes.url;
                                driveFileId = driveRes.driveFileId;
                                driveWebViewLink = driveRes.webViewLink;
                                uploaded = true;
                                if (state.appSettings.gdriveLastError) {
                                    state.appSettings.gdriveLastError = '';
                                    setDoc(doc(db, 'settings', 'app_settings'), { gdriveLastError: '' }, { merge: true }).catch(() => { });
                                }
                            } catch (driveErr) {
                                const errMsg = driveErr?.message || String(driveErr);
                                console.warn('Drive upload error:', errMsg);
                                state.appSettings.gdriveLastError = errMsg;
                                setDoc(doc(db, 'settings', 'app_settings'), { gdriveLastError: errMsg }, { merge: true }).catch(() => { });
                                if (isDeveloper(state.currentUser)) {
                                    showToast(`Drive Upload Error: ${errMsg}`, 'error');
                                }
                            }
                        }

                        if (!uploaded) {
                            if (!navigator.onLine) {
                                billUrl = state.tempBillData;
                            } else {
                                try {
                                    const fileRef = storageRef(storage, `bills/${expenseId}.jpg`);
                                    await uploadString(fileRef, state.tempBillData, 'data_url');
                                    billUrl = await getDownloadURL(fileRef);
                                } catch (storageErr) {
                                    if (state.tempBillData.length > MAX_INLINE_BILL_CHARS) {
                                        closeModal();
                                        showToast('Bill image is too large to save. Please use a smaller image.', 'error');
                                        if (submitBtn) submitBtn.disabled = false;
                                        return;
                                    }
                                    billUrl = state.tempBillData;
                                }
                            }
                        }
                    } else {
                        billUrl = state.tempBillData;
                    }
                } else if (existingExp) {
                    billUrl = existingExp.billAttachment || null;
                }

                updateBillSubmitOverlay({
                    subtitle: 'Syncing wallet & expense record...',
                    progress: 74,
                    step: 2,
                    icon: 'fa-wallet'
                });

                const expenseOwnerId = existingExp ? existingExp.userId : state.currentUser.id;
                const expenseOwnerName = existingExp ? existingExp.userName : state.currentUser.name;
                const ownerUser = state.users.find(u => u.id === expenseOwnerId) || state.currentUser;

                let walletResult = null;
                if (!isAdminOrDev(ownerUser)) {
                    const oldAmount = existingExp ? Number(existingExp.amount) : 0;
                    walletDelta = round2(-(amount - oldAmount));
                    if (walletDelta !== 0) {
                        walletOwnerId = ownerUser.id;
                        walletResult = await adjustWallet(walletOwnerId, walletDelta);
                    }
                }

                try {
                    await setDoc(doc(db, 'expenses', expenseId), {
                        id: expenseId,
                        userId: expenseOwnerId,
                        userName: expenseOwnerName,
                        title, amount, category, date, clientNamePlace, notes,
                        billAttachment: billUrl,
                        driveFileId: driveFileId || null,
                        driveWebViewLink: driveWebViewLink || null,
                        createdAt: existingExp ? existingExp.createdAt : new Date().toISOString()
                    });
                } catch (saveErr) {
                    if (walletOwnerId) {
                        try { await adjustWallet(walletOwnerId, -walletDelta); } catch (e) { }
                    }
                    throw saveErr;
                }

                if (walletResult && walletResult.excessAdded > 0) {
                    await createAppNotification({
                        recipientId: null,
                        recipientRole: 'admin',
                        type: 'excess_spent',
                        title: `Excess Spent Alert: ${ownerUser.name}`,
                        message: `${ownerUser.name} spent ${formatCurrency(walletResult.excessAdded)} over wallet balance on "${title}" (${category}). Total Excess Due: ${formatCurrency(walletResult.excess)}.`,
                        amount: walletResult.excessAdded,
                        triggeredBy: ownerUser.name
                    });
                }

                updateBillSubmitOverlay({
                    title: wasEditing ? 'Expense Updated!' : 'Expense Submitted!',
                    subtitle: `${title} • ${formatCurrency(amount)}`,
                    progress: 100,
                    step: 3,
                    completed: true
                });

                await new Promise(resolve => setTimeout(resolve, 680));
                closeModal();

                state.editingExpenseId = null;
                state.tempBillData = null;
                state.tempFormCache = null;
                showToast(wasEditing ? 'Expense updated successfully!' : 'Expense saved successfully!', 'success');
                switchTab('home');
            } catch (error) {
                console.error("Failed:", error);
                closeModal();
                showToast('Failed to save. Please try again.', 'error');
                if (submitBtn) submitBtn.disabled = false;
            }
        }

        function confirmUndoExpense(id) {
            if (!state.currentUser || isAdminOrDev(state.currentUser)) return;

            const exp = state.expenses.find(e => e.id === id);
            if (!exp) return;

            if (exp.userId !== state.currentUser.id) {
                showToast('Only the user who created this expense can undo it.', 'error');
                return;
            }

            showConfirmModal(
                'Undo Expense & Refund Wallet',
                `Undo "${exp.title}" and return ${formatCurrency(exp.amount)} back to your wallet? This will also be recorded in your Wallet Transaction History.`,
                async () => {
                    const { db, doc, deleteDoc, setDoc } = window.FB;
                    try {
                        const recycleItem = {
                            ...exp,
                            deletedAt: new Date().toISOString(),
                            deletedBy: `${state.currentUser.name} (Undo & Refunded)`
                        };
                        await setDoc(doc(db, 'recycleBin', id), recycleItem);
                        await deleteDoc(doc(db, 'expenses', id));
                        await refundExpenseToUserWallet(exp.userId, exp.amount, exp.title, exp.category);

        async function restoreFromRecycleBin(id) {
            const { db, doc, deleteDoc, setDoc } = window.FB;
            const item = state.recycleBin.find(e => e.id === id);
            if (!item) return;
            const { deletedAt, deletedBy, ...expenseData } = item;
            if (String(deletedBy || '').includes('Undo & Refunded')) {
                showToast('This expense was undone and refunded. Add it again as a new expense instead.', 'error');
                return;
            }
            try {
                await setDoc(doc(db, 'expenses', id), expenseData);
                await deleteDoc(doc(db, 'recycleBin', id));
                showToast('Expense restored successfully!', 'success');
            } catch (err) {
                showToast('Failed to restore expense.', 'error');
            }
        }

        function permanentDelete(id) {
            const _it = state.recycleBin.find(e => e.id === id);
            const billUrl = _it ? (_it.billAttachment || '') : '';
            const driveFileId = _it ? (_it.driveFileId || '') : '';
            showConfirmModal(
                'Permanent Deletion',
                'Are you sure you want to permanently delete this expense? This cannot be undone.',
                async () => {
                    const { db, doc, deleteDoc, storage, storageRef, deleteObject } = window.FB;
                    try {
                        await deleteDoc(doc(db, 'recycleBin', id));
                        if (driveFileId) await deleteBillFromGoogleDrive(driveFileId);
                        if (billUrl && billUrl.includes('firebasestorage')) {
                            try { await deleteObject(storageRef(storage, `bills/${id}.jpg`)); } catch (e) { }
                        }
                        showToast('Expense permanently deleted.', 'success');
                    } catch (err) {
                        showToast('Failed to delete expense.', 'error');
                    }
                }
            );
        }

        async function undoDeleteUser(userId) {

        function getFilteredExpenses() {
            const isAdmin = isAdminOrDev(state.currentUser);
            const q = (state.searchQuery || '').toLowerCase().trim();
            return state.expenses.filter(exp => {
                if (!isAdmin && exp.userId !== state.currentUser.id) return false;
                if (isAdmin && state.filterUser !== 'All' && exp.userId !== state.filterUser) return false;
                if (state.filterCategory !== 'All' && exp.category !== state.filterCategory) return false;
                if (state.filterMonth !== 'All' && (!exp.date || !exp.date.startsWith(state.filterMonth))) return false;
                if (state.filterStartDate && exp.date && exp.date < state.filterStartDate) return false;
                if (state.filterEndDate && exp.date && exp.date > state.filterEndDate) return false;
                if (q) {
                    const hay = `${exp.title || ''} ${exp.notes || ''} ${exp.clientNamePlace || ''} ${exp.userName || ''} ${exp.category || ''}`.toLowerCase();
                    if (!hay.includes(q)) return false;
                }
                return true;
            });
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            const username = (document.getElementById('login-username').value || '').trim().toLowerCase();
            const password = document.getElementById('login-password').value;
            const user = state.users.find(u => u.username && u.username.toLowerCase() === username && u.password === password);
            if (!user) {
                showToast('Invalid username or password.', 'error');
                return;
            }
            state.currentUser = user;
            state.activeTab = 'home';
            persistCurrentUser(user);
            showToast(`Welcome back, ${user.name}!`, 'success');
            render();
        }

        async function handleForgotPasswordSubmit(e) {
            e.preventDefault();
            const username = (document.getElementById('forgot-username').value || '').trim().toLowerCase();
            const newPassword = document.getElementById('forgot-new-password').value;
            const user = state.users.find(u => u.username && u.username.toLowerCase() === username);
            if (!user) {
                showToast('Username not found.', 'error');
                return;
            }
            const reqId = 'req_' + Date.now();
            const code = String(Math.floor(100000 + Math.random() * 900000));
            const { db, doc, setDoc } = window.FB;
            try {
                await setDoc(doc(db, 'passwordRequests', reqId), {
                    id: reqId,
                    userId: user.id,
                    userName: user.name,
                    username: user.username,
                    newPassword,
                    code,
                    status: 'pending',
                    requestedAt: new Date().toISOString()
                });
                state.authView = 'login';
                showToast(`Reset request sent! Code: ${code}`, 'success');
                render();
            } catch (err) {
                showToast('Failed to submit request.', 'error');
            }
        }

            state.currentUser = null;

        function syncHomeCategoryBubble(animate = true) {
            const dock = document.getElementById('home-cat-dock');
            const bubble = document.getElementById('home-cat-bubble');
            const activeBtn = document.getElementById(`home-cat-btn-${state.filterCategory}`);
            if (!dock || !bubble || !activeBtn) return;

            if (!animate) bubble.style.transition = 'none';
            bubble.style.width = `${activeBtn.offsetWidth}px`;
            bubble.style.webkitTransform = `translate3d(${activeBtn.offsetLeft}px, 0, 0)`;
            bubble.style.transform = `translate3d(${activeBtn.offsetLeft}px, 0, 0)`;

            dock.querySelectorAll('.liquid-sub-btn').forEach(btn => {
                const isActive = btn.id === activeBtn.id;
                btn.classList.toggle('is-active', isActive);
                btn.setAttribute('aria-selected', String(isActive));
            });

            if (!animate) {
                requestAnimationFrame(() => {
                    bubble.style.transition = '';
                });
            }
        }

        function setFilterCategory(cat) {

            const bubble = document.getElementById('user-sub-bubble');
            const activeBtn = document.getElementById(`user-sub-btn-${state.userFilterTab}`);
            if (!dock || !bubble || !activeBtn) return;

            if (!animate) bubble.style.transition = 'none';
            bubble.style.width = `${activeBtn.offsetWidth}px`;
            bubble.style.webkitTransform = `translate3d(${activeBtn.offsetLeft}px, 0, 0)`;
            bubble.style.transform = `translate3d(${activeBtn.offsetLeft}px, 0, 0)`;

            dock.querySelectorAll('.liquid-sub-btn').forEach(btn => {
                const isActive = btn.id === activeBtn.id;
                btn.classList.toggle('is-active', isActive);
                btn.setAttribute('aria-selected', String(isActive));
            });

            if (!animate) {
                requestAnimationFrame(() => {
                    bubble.style.transition = '';
                });
            }
        }

        function setUserFilterTab(tab) {
            if (state.userFilterTab === tab) {
                syncUserFilterBubble(true);
                return;
            }

            state.userFilterTab = tab;
            syncUserFilterBubble(true);

            const prevContainer = document.getElementById('user-management-list-container');
            if (prevContainer) {
                const temp = document.createElement('div');
                temp.innerHTML = renderUserManagementTab();
                const nextContainer = temp.querySelector('#user-management-list-container');
                if (nextContainer) {
                    prevContainer.innerHTML = nextContainer.innerHTML;
                    return;

        async function handleAddNewUser(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('add-user-submit-btn');
            if (submitBtn && submitBtn.disabled) return;

            const name = document.getElementById('new-user-name').value.trim();
            const username = document.getElementById('new-user-username').value.trim().toLowerCase();
            const password = document.getElementById('new-user-password').value;
            const confirmPassword = document.getElementById('new-user-confirm-password').value;
            const role = document.getElementById('new-user-role').value;

            if (!password || password.length < 4) {
                showToast('Password must be at least 4 characters.', 'error');
                return;
            }
            if (password !== confirmPassword) {
                showToast('Passwords do not match!', 'error');
                return;
            }
            if (state.users.some(u => u.username.toLowerCase() === username)) {
                showToast('Username already exists.', 'error');
                return;
            }

            if (submitBtn) submitBtn.disabled = true;

            try {
                const userId = 'usr_' + Date.now();
                const newUser = { id: userId, name, username, password, role, email: `${username}@clickfactory.com`, wallet: 0, excessSpent: 0 };
                const { db, doc, setDoc } = window.FB;
                await setDoc(doc(db, 'users', userId), newUser);
                closeModal();
                showToast(`User ${name} added successfully!`, 'success');
            } catch (err) {
                if (submitBtn) submitBtn.disabled = false;
                showToast('Failed to add user.', 'error');
            }
        }

        function confirmRemoveUser(userId) {
            const userName = uName(userId);
            const target = state.users.find(u => u.id === userId);
            if (target && isAdminOrDev(target) && state.users.filter(u => isAdminOrDev(u)).length <= 1) {
                showToast('You cannot delete the last administrator.', 'error');
                return;
            }
            showConfirmModal(
                'Remove User',
                `Move user "${userName}" and their expenses to Deleted Users Bin? They will be permanently wiped after 48 hours unless restored.`,
                async () => {
                    const { db, doc, deleteDoc, setDoc } = window.FB;
                    const userToRemove = state.users.find(u => u.id === userId);
                    if (!userToRemove) return;
                    try {
                        const userExps = state.expenses
                            .filter(e => e.userId === userId)
                            .map(e => (e.billAttachment && String(e.billAttachment).startsWith('data:')) ? { ...e, billAttachment: null } : e);

                        await setDoc(doc(db, 'userRecycleBin', userId), {
                            userId: userToRemove.id,
                            name: userToRemove.name,
                            username: userToRemove.username,
                            password: userToRemove.password,
                            role: userToRemove.role,
                            email: userToRemove.email,
                            wallet: userToRemove.wallet || 0,
                            excessSpent: userToRemove.excessSpent || 0,
                            expenses: userExps,
                            deletedAt: new Date().toISOString()
                        });
                        await deleteDoc(doc(db, 'users', userId));
                        for (const ue of userExps) {
                            await deleteDoc(doc(db, 'expenses', ue.id));
                        }
                        showToast(`User ${userName} moved to Deleted Users Bin.`, 'success');
                    } catch (err) {
                        showToast('Failed to remove user.', 'error');
                    }
                }
            );
        }

  try {
    var payload = JSON.parse(e.postData.contents);
    if (payload.action === 'delete' && payload.fileId) {
      DriveApp.getFileById(payload.fileId).setTrashed(true);
      return ContentService.createTextOutput(JSON.stringify({ ok: true })).setMimeType(ContentService.MimeType.JSON);
    }
    var folder;
    if (payload.folderId) {
      folder = DriveApp.getFolderById(payload.folderId);
    } else {
      var folders = DriveApp.getFoldersByName('Click Factory Bills');
      folder = folders.hasNext() ? folders.next() : DriveApp.createFolder('Click Factory Bills');
    }
    var bytes = Utilities.base64Decode(payload.base64Data);
    var blob = Utilities.newBlob(bytes, payload.mimeType || 'image/jpeg', payload.fileName || ('bill_' + Date.now() + '.jpg'));
    var file = folder.createFile(blob);
    file.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW);
    var fileId = file.getId();
    return ContentService.createTextOutput(JSON.stringify({
      ok: true,
      fileId: fileId,
      url: 'https://lh3.googleusercontent.com/d/' + fileId + '=s1200',
      webViewLink: file.getUrl()
    })).setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ ok: false, error: err.toString() })).setMimeType(ContentService.MimeType.JSON);
  }
}`;

        async function handleSaveGoogleDriveConfig(e) {
            e.preventDefault();
            if (!isDeveloper(state.currentUser)) return;
            const bridgeUrl = (document.getElementById('gdrive-bridge-url')?.value || '').trim();
            const clientId = (document.getElementById('gdrive-client-id')?.value || '').trim();
            const manualToken = (document.getElementById('gdrive-manual-token')?.value || '').trim();
            const folderId = (document.getElementById('gdrive-folder-id')?.value || '').trim();
            const enabledChk = document.getElementById('gdrive-enabled-chk')?.checked;

            if (bridgeUrl && !/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(\?.*)?$/i.test(bridgeUrl)) {
                showToast('Option A must be a Google Apps Script URL (https://script.google.com/macros/s/.../exec).', 'error');
                return;
            }

            const hasCreds = Boolean(bridgeUrl || manualToken || clientId);
            const enabled = Boolean(enabledChk && hasCreds);

            const { db, doc, setDoc } = window.FB;
            try {
                const updated = {
                    ...state.appSettings,
                    gdriveBridgeUrl: bridgeUrl,
                    gdriveClientId: clientId,
                    gdriveFolderId: folderId,
                    gdriveEnabled: enabled,
                    gdriveLastError: ''
                };
                if (manualToken && manualToken !== state.appSettings.gdriveSharedToken) {
                    updated.gdriveSharedToken = manualToken;
                    updated.gdriveSharedExpiry = Date.now() + (55 * 60 * 1000);
                } else if (!manualToken) {
                    updated.gdriveSharedToken = '';
                    updated.gdriveSharedExpiry = 0;
                }
                await setDoc(doc(db, 'settings', 'app_settings'), updated, { merge: true });
                state.appSettings = updated;
                closeModal();
                showToast(enabled ? 'Google Drive connected & saved!' : 'Google Drive settings saved!', 'success');
                renderMainContentOnly();
            } catch (err) {
                showToast('Failed to save Drive config.', 'error');
            }
        }

        async function connectSharedGoogleDrive() {
            if (!isDeveloper(state.currentUser)) return;
            const bridgeUrl = (document.getElementById('gdrive-bridge-url')?.value || state.appSettings.gdriveBridgeUrl || '').trim();
            const clientId = (document.getElementById('gdrive-client-id')?.value || state.appSettings.gdriveClientId || '').trim();
            const manualToken = (document.getElementById('gdrive-manual-token')?.value || '').trim();
            const folderId = (document.getElementById('gdrive-folder-id')?.value || state.appSettings.gdriveFolderId || '').trim();
            const connectBtn = document.getElementById('gdrive-connect-btn');

            if (bridgeUrl && !/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(\?.*)?$/i.test(bridgeUrl)) {
                showToast('Option A requires a Google Apps Script URL (https://script.google.com/macros/s/.../exec).', 'error');
                return;
            }

            if (!bridgeUrl && !clientId && !manualToken) {
                showToast('Enter an Apps Script URL, OAuth Client ID, or Access Token first.', 'error');
                return;
            }

            const { db, doc, setDoc } = window.FB;
            if (connectBtn) {
                connectBtn.disabled = true;
                connectBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i><span>Connecting...</span>';
            }

            try {
                if (bridgeUrl) {
                    const updated = {
                        ...state.appSettings,
                        gdriveBridgeUrl: bridgeUrl,
                        gdriveClientId: clientId,
                        gdriveFolderId: folderId,
                        gdriveEnabled: true,
                        gdriveLastError: ''
                    };
                    await setDoc(doc(db, 'settings', 'app_settings'), updated, { merge: true });
                    state.appSettings = updated;
                    showToast('Connected via Permanent Apps Script Bridge!', 'success');
                    openGoogleDriveConfigModal();
                    return;
                }

                if (manualToken) {
                    const updated = {
                        ...state.appSettings,
                        gdriveClientId: clientId,
                        gdriveFolderId: folderId,
                        gdriveSharedToken: manualToken,
                        gdriveSharedExpiry: Date.now() + (55 * 60 * 1000),
                        gdriveEnabled: true,
                        gdriveLastError: ''
                    };
                    await setDoc(doc(db, 'settings', 'app_settings'), updated, { merge: true });
                    state.appSettings = updated;
                    showToast('Connected using Direct OAuth Token!', 'success');
                    openGoogleDriveConfigModal();
                    return;
                }

                state.appSettings.gdriveClientId = clientId;
                state.appSettings.gdriveFolderId = folderId;
                const auth = await requestGoogleDriveAccessToken('consent');
                const updated = {
                    ...state.appSettings,
                    gdriveClientId: clientId,
                    gdriveFolderId: folderId,
                    gdriveSharedToken: auth.token,
                    gdriveSharedExpiry: auth.expiry,
                    gdriveEnabled: true,
                    gdriveLastError: ''
                };
                await setDoc(doc(db, 'settings', 'app_settings'), updated, { merge: true });
                state.appSettings = updated;
                showToast('Google Drive connected via OAuth 2.0!', 'success');
                openGoogleDriveConfigModal();
            } catch (err) {
                const msg = err?.message || 'Could not connect Google Drive.';
                state.appSettings.gdriveLastError = msg;
                showToast(msg, 'error');
                openGoogleDriveConfigModal();
            }
        }

        async function disconnectSharedGoogleDrive() {
            if (!isDeveloper(state.currentUser)) return;
            lsRemove(GDRIVE_TOKEN_CACHE_KEY);
            const { db, doc, setDoc } = window.FB;
            const updated = {
                ...state.appSettings,
                gdriveEnabled: false,
                gdriveBridgeUrl: '',
                gdriveSharedToken: '',
                gdriveSharedExpiry: 0,
                gdriveConnectedEmail: '',
                gdriveLastError: ''
            };
            await setDoc(doc(db, 'settings', 'app_settings'), updated, { merge: true });
            state.appSettings = updated;
            showToast('Google Drive disconnected.', 'info');
            openGoogleDriveConfigModal();
        }

        async function handlePasswordChange(e) {
            e.preventDefault();

            if (submitBtn && submitBtn.disabled) return;

            const current = document.getElementById('current-pass').value;
            const newPass = document.getElementById('new-pass').value;
            const confirmNewPass = document.getElementById('confirm-new-pass').value;

            const me = state.users.find(u => u.id === state.currentUser.id);
            if (!me || current !== me.password) {

                return;
            }
            if (!newPass || newPass.length < 4) {
                showToast('Password must be at least 4 characters.', 'error');
                return;
            }
            if (newPass !== confirmNewPass) {
                showToast('New passwords do not match!', 'error');
                return;
            }

            if (submitBtn) submitBtn.disabled = true;

                const { db, doc, updateDoc } = window.FB;
                await updateDoc(doc(db, 'users', me.id), { password: newPass });

        function triggerBlobDownload(blob, filename) {
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(url), 1500);
        }

        function buildCsvContent(dataArray, bundledFileMap = {}) {
            const isDev = isDeveloper(state.currentUser);
            const headers = isDev
                ? ['ID', 'User', 'Title', 'Category', 'Client & Place', 'Amount (INR)', 'Date', 'Notes', 'Has Bill', 'Bound Bill File / Link', 'Drive File ID']
                : ['ID', 'User', 'Title', 'Category', 'Client & Place', 'Amount (INR)', 'Date', 'Notes', 'Has Bill', 'Bound Bill File / Link'];
            const safe = v => {
                let s = String(v ?? '');
                if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
                return '"' + s.replace(/"/g, '""') + '"';
            };
            const lines = [
                headers.map(safe).join(','),
                ...dataArray.map(e => {
                    const boundBillRef = bundledFileMap[e.id]
                        || (isDev ? e.driveWebViewLink : '')
                        || (e.billAttachment && !String(e.billAttachment).startsWith('data:') ? e.billAttachment : (e.billAttachment ? `bills/${e.id}.jpg` : 'No Bill'));
                    const row = [
                        e.id, e.userName, e.title, e.category, e.clientNamePlace, e.amount, e.date, e.notes,
                        e.billAttachment ? 'Yes' : 'No',
                        boundBillRef
                    ];
                    if (isDev) row.push(e.driveFileId || '');
                    return row.map(safe).join(',');
                })
            ];
            return '\ufeff' + lines.join('\r\n');
        }

        async function fetchBillBlobForZip(exp) {
            const src = exp.billAttachment;
            if (!src) return null;
            if (String(src).startsWith('data:')) {
                return dataUrlToBlob(src);
            }
            try {
                const res = await fetch(src);
                if (res.ok) return await res.blob();
            } catch (e) { }
            return null;
        }

        async function downloadBundledZip(dataArray, csvFilename) {
            if (!window.JSZip) {
                const csvBlob = new Blob([buildCsvContent(dataArray)], { type: 'text/csv;charset=utf-8' });
                triggerBlobDownload(csvBlob, csvFilename);
                showToast(`Exported ${dataArray.length} records to CSV!`, 'success');
                return;
            }

            showToast('Bundling CSV with attached bills...', 'info');
            const zip = new JSZip();
            const billsFolder = zip.folder('bills');
            const bundledFileMap = {};
            let attachedCount = 0;

            for (const exp of dataArray) {
                if (!exp.billAttachment) continue;
                const safeSlug = `${exp.date || 'bill'}_${(exp.title || 'receipt').replace(/[^a-zA-Z0-9_-]/g, '_').slice(0, 28)}_${exp.id}.jpg`;
                const blob = await fetchBillBlobForZip(exp);
                if (blob) {
                    billsFolder.file(safeSlug, blob);
                    bundledFileMap[exp.id] = `bills/${safeSlug}`;
                    attachedCount++;
                } else {
                    bundledFileMap[exp.id] = exp.billAttachment;
                }
            }

            zip.file(csvFilename, buildCsvContent(dataArray, bundledFileMap));
            const zipBlob = await zip.generateAsync({ type: 'blob' });
            const zipName = csvFilename.replace(/\.csv$/i, '') + '_with_bills.zip';
            triggerBlobDownload(zipBlob, zipName);
            showToast(`Exported CSV + ${attachedCount} bound bill(s) in ZIP!`, 'success');
        }

        function escapeHtml(str) {

        // ---------- SOURCE & DEVTOOLS PROTECTION ----------
        (function protectAppSource() {
            document.addEventListener('contextmenu', (e) => {
                if (!e.target.closest('input, textarea')) {
                    e.preventDefault();
                }
            });

            document.addEventListener('keydown', (e) => {
                const key = (e.key || '').toUpperCase();
                if (
                    e.key === 'F12' ||
                    (e.ctrlKey && e.shiftKey && (key === 'I' || key === 'J' || key === 'C' || key === 'K')) ||
                    (e.metaKey && e.altKey && (key === 'I' || key === 'J' || key === 'C' || key === 'U')) ||
                    ((e.ctrlKey || e.metaKey) && (key === 'U' || key === 'S'))
                ) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }

            try {
                const noop = () => {};
                ['log', 'debug', 'info', 'warn', 'dir', 'dirxml', 'table', 'trace'].forEach(fn => {

        const MAX_PULL_DISTANCE = 140;

        function getPrimaryNavTabs() {
            const isAdmin = isAdminOrDev(state.currentUser);
            return ['home', isAdmin ? 'admin' : 'analytics', isAdmin ? 'users' : 'wallet', 'profile'];
        }

        function ptrPullDistance(rawDiff) {
            if (rawDiff <= 0) return 0;
            return Math.min(MAX_PULL_DISTANCE, rawDiff * 0.42 * (1 - (rawDiff / (rawDiff + 280))));

            gestureStartY = e.touches[0].clientY;
            gestureCurrentX = gestureStartX;
            gestureCurrentY = gestureStartY;
            gestureMode = null;
            hasVibrated = false;
            modalGestureEl = null;

            const modalRoot = document.getElementById('modal-root');
            if (modalRoot && modalRoot.innerHTML.trim() !== '') {
                const modalCard = modalRoot.querySelector('.ios-glass-modal');
                const scrollable = e.target.closest('.overflow-y-auto');
                if (modalCard && (!scrollable || scrollable.scrollTop <= 0)) {
                    modalGestureEl = modalCard;
                    modalCard.style.transition = 'none';
                    gestureMode = 'modal-swipe';
                } else {
                    gestureMode = 'cancelled';
                }
                return;
            }

            if (!state.currentUser || state.isDbLoading || isRefreshing) {
                gestureMode = 'cancelled';
                return;
            }

            if (e.target.closest('#liquid-nav, #user-sub-dock, #home-cat-dock, #form-category-dock, #appearance-sub-dock, input[type="range"], .overflow-x-auto')) {
                gestureMode = 'cancelled';

        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            if (gestureMode === 'cancelled' || isRefreshing || !e.touches || e.touches.length !== 1) return;

            gestureCurrentY = e.touches[0].clientY;
            const rawDiffX = gestureCurrentX - gestureStartX;
            const rawDiffY = gestureCurrentY - gestureStartY;

            if (gestureMode === 'modal-swipe') {
                if (rawDiffY > 0 && Math.abs(rawDiffY) > Math.abs(rawDiffX) && modalGestureEl) {

                const absY = Math.abs(rawDiffY);
                if (absX <= DIRECTION_LOCK_THRESHOLD && absY <= DIRECTION_LOCK_THRESHOLD) return;

                if (absX > absY) {
                    if (['recycle', 'requests', 'userRecycle', 'notifications', 'add'].includes(state.activeTab) && rawDiffX > 0) {
                        gestureMode = 'edge-back';
                    } else if (getPrimaryNavTabs().includes(state.activeTab)) {
                        gestureMode = 'tab-swipe';

                const primaryTabs = getPrimaryNavTabs();
                const currentIdx = primaryTabs.indexOf(state.activeTab);
                const atEdge = (currentIdx === 0 && rawDiffX > 0) || (currentIdx === primaryTabs.length - 1 && rawDiffX < 0);
                const dampedX = atEdge ? rawDiffX * 0.16 : Math.max(-90, Math.min(90, rawDiffX * 0.35));
                mainContent.style.transition = 'none';
                mainContent.style.transform = `translateX(${dampedX}px)`;
                if (!hasVibrated && Math.abs(rawDiffX) >= TAB_SWIPE_THRESHOLD && !atEdge) {

                const icon = document.getElementById('ptr-icon');
                const text = document.getElementById('ptr-text');

                if (ptrContainer) {
                    const progress = Math.min(1, pullDistance / REFRESH_THRESHOLD);
                    ptrContainer.style.opacity = progress.toString();
                    ptrContainer.style.transform = `translateY(${pullDistance}px)`;

                    if (pullDistance >= REFRESH_THRESHOLD) {
                        if (icon) icon.style.transform = 'rotate(180deg)';
                        if (text) { text.textContent = 'Release to refresh'; text.style.color = '#4f46e5'; }

                            hasVibrated = true;
                        }

                        const rotation = (pullDistance / REFRESH_THRESHOLD) * 180;

                if (rawDiffY > 85 && Math.abs(rawDiffY) > Math.abs(rawDiffX)) {
                    triggerHaptic(12);

                } else {
                    modalGestureEl.style.transition = 'transform 0.22s ease, opacity 0.22s ease';

            }

                mainContent.style.transition = 'transform 0.22s cubic-bezier(0.16, 1, 0.3, 1)';
                mainContent.style.transform = 'translateX(0)';
            }

                if (state.activeTab === 'add') cancelEdit();
                else switchTab(state.activeTab === 'notifications' ? 'home' : 'profile');
                return;
            }

            if (activeMode === 'tab-swipe' && Math.abs(rawDiffX) >= TAB_SWIPE_THRESHOLD) {
                const primaryTabs = getPrimaryNavTabs();
                const currentIdx = primaryTabs.indexOf(state.activeTab);

        function resetPtrVisuals() {

        // ---------- INTERACTIVE LIQUID DOCK DRAG SCRUBBING ----------
        (function setupLiquidDockGesture() {

                const nav = document.getElementById('liquid-nav');

                for (const btn of buttons) {
                    const rect = btn.getBoundingClientRect();
                    if (clientX >= rect.left && clientX <= rect.right) {
                        if (btn.id === 'nav-btn-home') return { btn, tab: 'home' };
                        if (btn.id === 'nav-btn-summary') return { btn, tab: 'summary' };
                        if (btn.id === 'nav-btn-users') return { btn, tab: isAdminOrDev(state.currentUser) ? 'users' : 'wallet' };

                const btn = e.target.closest('#liquid-nav .liquid-nav-btn');
                const bubble = document.getElementById('liquid-bubble');
                if (btn && bubble) {
                    bubble.style.width = `${btn.offsetWidth}px`;
                    bubble.style.webkitTransform = `translate3d(${btn.offsetLeft}px, 0, 0)`;
                    bubble.style.transform = `translate3d(${btn.offsetLeft}px, 0, 0)`;
                }
            });

            document.addEventListener('focusin', (e) => {
                const btn = e.target.closest('#liquid-nav .liquid-nav-btn');
                const bubble = document.getElementById('liquid-bubble');
                if (btn && bubble) {
                    bubble.style.width = `${btn.offsetWidth}px`;
                    bubble.style.transform = `translateX(${btn.offsetLeft}px)`;
                }
            });

            document.addEventListener('pointerout', (e) => {
                const nav = document.getElementById('liquid-nav');
                if (nav && e.target.closest('#liquid-nav') && (!e.relatedTarget || !nav.contains(e.relatedTarget))) {
                    syncPersistentNavbar();
                }
            });
        })();

        // ---------- INTERACTIVE LIQUID SUB-DOCK GESTURES (USERS, HOME CATEGORY & EXPENSE TYPE) ----------
        (function setupLiquidSubDocksGesture() {
            let activeDockId = null;
            let lastHoveredKey = null;

            const dockConfigs = {
                'user-sub-dock': {
                    bubbleId: 'user-sub-bubble',
                    prefix: 'user-sub-btn-',
                    apply: (key) => setUserFilterTab(key),
                    reset: () => syncUserFilterBubble(true)
                },
                'home-cat-dock': {
                    bubbleId: 'home-cat-bubble',
                    prefix: 'home-cat-btn-',
                    apply: (key) => setFilterCategory(key),
                    reset: () => syncHomeCategoryBubble(true)
                },
                'form-category-dock': {
                    bubbleId: 'form-category-bubble',
                    prefix: 'btn-cat-',
                    apply: (key) => setFormCategory(key === 'shoot' ? 'Shoot' : 'Office'),
                    reset: () => syncFormCategoryBubble(true)
                },
                'appearance-sub-dock': {
                    bubbleId: 'appearance-sub-bubble',
                    prefix: 'theme-btn-',
                    apply: (key) => setThemeMode(key),
                    reset: () => syncAppearanceBubble(true)
                }
            };

            function getSubDockHit(dock, cfg, clientX) {
                const buttons = Array.from(dock.querySelectorAll('.liquid-sub-btn'));
                for (const btn of buttons) {
                    const rect = btn.getBoundingClientRect();
                    if (clientX >= rect.left && clientX <= rect.right && btn.id.startsWith(cfg.prefix)) {
                        return { btn, key: btn.id.slice(cfg.prefix.length) };
                    }
                }
                return null;
            }

            document.addEventListener('touchstart', (e) => {
                if (e.touches.length !== 1) return;
                const dock = e.target.closest('#user-sub-dock, #home-cat-dock, #form-category-dock, #appearance-sub-dock');
                if (dock) {
                    activeDockId = dock.id;
                    lastHoveredKey = null;
                }
            }, { passive: true });

            document.addEventListener('touchmove', (e) => {
                if (!activeDockId || e.touches.length !== 1) return;
                const dock = document.getElementById(activeDockId);
                const cfg = dockConfigs[activeDockId];
                const bubble = cfg ? document.getElementById(cfg.bubbleId) : null;
                if (!dock || !cfg || !bubble) return;

                const hit = getSubDockHit(dock, cfg, e.touches[0].clientX);
                if (hit) {
                    bubble.style.width = `${hit.btn.offsetWidth}px`;
                    bubble.style.webkitTransform = `translate3d(${hit.btn.offsetLeft}px, 0, 0)`;
                    bubble.style.transform = `translate3d(${hit.btn.offsetLeft}px, 0, 0)`;
                    if (lastHoveredKey !== hit.key) {
                        triggerHaptic(8);
                        lastHoveredKey = hit.key;
                    }
                }
            }, { passive: true });

            document.addEventListener('touchend', () => {
                if (!activeDockId) return;
                const cfg = dockConfigs[activeDockId];
                activeDockId = null;
                if (cfg) {
                    if (lastHoveredKey) {
                        cfg.apply(lastHoveredKey);
                        lastHoveredKey = null;
                    } else {
                        cfg.reset();
                    }
                }
            }, { passive: true });

            document.addEventListener('pointerover', (e) => {
                if (e.pointerType === 'touch') return;
                const btn = e.target.closest('#user-sub-dock .liquid-sub-btn, #home-cat-dock .liquid-sub-btn, #form-category-dock .liquid-sub-btn, #appearance-sub-dock .liquid-sub-btn');
                const dock = btn ? btn.parentElement : null;
                const cfg = dock ? dockConfigs[dock.id] : null;
                const bubble = cfg ? document.getElementById(cfg.bubbleId) : null;
                if (btn && bubble) {
                    bubble.style.width = `${btn.offsetWidth}px`;
                    bubble.style.webkitTransform = `translate3d(${btn.offsetLeft}px, 0, 0)`;
                    bubble.style.transform = `translate3d(${btn.offsetLeft}px, 0, 0)`;
                }
            });

            document.addEventListener('pointerout', (e) => {
                const dock = e.target.closest('#user-sub-dock, #home-cat-dock, #form-category-dock, #appearance-sub-dock');
                if (dock && (!e.relatedTarget || !dock.contains(e.relatedTarget))) {
                    const cfg = dockConfigs[dock.id];
                    if (cfg) cfg.reset();
                }
            });
        })();

        // Persist session across app switching, backgrounding, and reopening
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') {
                if (state.currentUser) persistCurrentUser(state.currentUser);
            } else if (document.visibilityState === 'visible') {
                if (!state.currentUser) {
                    const recovered = readSyncSession();
                    if (recovered) {
                        state.currentUser = recovered;
                        render();
                    }
                } else {
                    persistCurrentUser(state.currentUser);
                }
            }
        });

        window.addEventListener('pagehide', () => {
            if (state.currentUser) persistCurrentUser(state.currentUser);
        });

        window.addEventListener('pageshow', () => {
            if (!state.currentUser) {
                const recovered = readSyncSession();
                if (recovered) {
                    state.currentUser = recovered;
                    render();
                }
            } else {
                persistCurrentUser(state.currentUser);
            }
        });

        window.addEventListener('focus', () => {
            if (state.currentUser) persistCurrentUser(state.currentUser);
        });

        window.addEventListener('resize', () => {
            syncPersistentNavbar();
            syncHomeCategoryBubble(false);
            syncUserFilterBubble(false);
            syncFormCategoryBubble(false);
            syncAppearanceBubble(false);
        });
        window.addEventListener('orientationchange', () => setTimeout(() => {
            syncPersistentNavbar();
            syncHomeCategoryBubble(false);
            syncUserFilterBubble(false);
            syncFormCategoryBubble(false);
            syncAppearanceBubble(false);
        }, 100));

        async function bootApp() {
            applyDockTransparency(state.dockAlpha);
            if (!state.currentUser) {
                const restored = await restoreSessionFromStorage();
                if (restored) {
                    state.currentUser = restored;
                }
            }
            if (state.currentUser) {
                persistCurrentUser(state.currentUser);
                if (!state.users.some(u => u.id === state.currentUser.id)) {
                    state.users.push({ ...state.currentUser });
                }
            }
            render();
            if (typeof window.startAppListeners === 'function') {
                window.startAppListeners();
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', bootApp);
        } else {
            bootApp();
        }
    </script>

            window.__listenersStarted = false;
            window.FB = { db, storage, collection, getDocs, setDoc, doc, deleteDoc, updateDoc, onSnapshot, query, orderBy, runTransaction, storageRef, uploadString, getDownloadURL, deleteObject };
