    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca'
                        }
                    }
                }
            }
        };

        // Immediately sync theme class before paint to avoid flash
        (function () {
            let savedTheme = 'system';
            try { savedTheme = localStorage.getItem('click_factory_theme_v1') || 'system'; } catch (e) { }
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = savedTheme === 'dark' || (savedTheme === 'system' && prefersDark);
            if (isDark) {
                document.documentElement.classList.add('dark');
                document.getElementById('meta-theme-color')?.setAttribute('content', '#020617');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('meta-theme-color')?.setAttribute('content', '#f8fafc');
            }
        })();
    </script>
    <style>
        *,
        ::before,
        ::after {
            box-sizing: border-box;
        }

        /* Desktop thin custom scrollbars */
        @media (min-width: 769px) and (hover: hover) {
            * {
                scrollbar-width: thin;
                scrollbar-color: rgba(148, 163, 184, 0.35) transparent;
            }

            .dark * {
                scrollbar-color: rgba(99, 102, 241, 0.35) transparent;
            }

            ::-webkit-scrollbar {
                width: 6px;
                height: 6px;
            }

            ::-webkit-scrollbar-track {
                background: transparent;
                margin: 6px 0;
            }

            ::-webkit-scrollbar-thumb {
                background-color: rgba(148, 163, 184, 0.4);
                border-radius: 9999px;
                border: 1.5px solid transparent;
                background-clip: content-box;
                transition: background-color 0.2s ease;
            }

            ::-webkit-scrollbar-thumb:hover {
                background-color: rgba(99, 102, 241, 0.75);
            }

            .dark ::-webkit-scrollbar-thumb {
                background-color: rgba(148, 163, 184, 0.25);
            }

            .dark ::-webkit-scrollbar-thumb:hover {
                background-color: rgba(129, 140, 248, 0.65);
            }
        }

        /* Mobile / touch hidden scrollbars */
        @media (max-width: 768px),
        (hover: none) {
            * {
                -ms-overflow-style: none !important;
                scrollbar-width: none !important;
            }

            *::-webkit-scrollbar {
                display: none !important;
                width: 0 !important;
                height: 0 !important;
            }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none !important;
        }

        .no-scrollbar {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }

        html,
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            word-wrap: break-word;
            overflow-wrap: break-word;
            background-color: #f8fafc;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        html.dark,
        .dark body {
            background-color: #020617;
        }

        input[type="date"],
        select {
            appearance: none;
            -webkit-appearance: none;
        }

        .app-container {
            width: 100%;
            max-width: 100%;
            flex: 1;
            min-height: 0;
            overflow: hidden;
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            padding-top: 0;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .dark .app-container {
            background-color: #020617;
        }

        .ios-header {
            flex-shrink: 0;
            padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
            padding-bottom: 12px;
            background-color: #f8fafc;
            position: relative;
            z-index: 45;
            transition: background-color 0.25s ease;
        }

        .dark .ios-header {
            background-color: #020617;
        }

        #main-content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
            position: relative;
            padding-top: 8px;
            padding-bottom: 140px;
        }

        /* Pull-to-Refresh Pill */
        #ptr-container {
            position: absolute;
            top: 12px;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            pointer-events: none;
            opacity: 0;
            transform: translateY(-40px);
            transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .ptr-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 14px -2px rgba(0, 0, 0, 0.08), 0 2px 6px -1px rgba(0, 0, 0, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: all 0.2s ease;
        }

        .dark .ptr-pill {
            background: rgba(15, 23, 42, 0.88);
            border-color: rgba(51, 65, 85, 0.7);
            box-shadow: 0 4px 16px -2px rgba(0, 0, 0, 0.5);
        }

        #ptr-icon {
            font-size: 13px;
            color: #6366f1;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        #ptr-icon.is-spinning {
            animation: simple-spin 0.7s linear infinite;
        }

        #ptr-text {
            font-size: 11px;
            font-weight: 600;
            color: #475569;
            letter-spacing: -0.01em;
            transition: color 0.2s ease;
        }

        .dark #ptr-text {
            color: #cbd5e1;
        }

        #toast-container {
            position: fixed;
            bottom: 96px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 70;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            width: 90%;
            max-width: 380px;
        }

        .logo-container img {
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            object-position: center;
        }

        .custom-date-wrapper {
            position: relative;
            background: #f8fafc;
        }

        .dark .custom-date-wrapper {
            background: #1e293b;
        }

        .custom-date-wrapper input[type="date"] {
            position: relative;
            color: transparent;
            width: 100%;
        }

        .custom-date-wrapper input[type="date"]:focus,
        .custom-date-wrapper input[type="date"]:valid {
            color: inherit;
        }

        .custom-date-placeholder {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: #94a3b8;
            font-size: 11px;
        }

        .custom-date-wrapper input[type="date"]:focus+.custom-date-placeholder,
        .custom-date-wrapper input[type="date"]:valid+.custom-date-placeholder {
            display: none;
        }

        @keyframes simple-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .simple-spinner {
            border: 3px solid rgba(99, 102, 241, 0.15);
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: simple-spin 0.8s linear infinite;
        }

        @keyframes homeZoomOut {
            0% { opacity: 0; transform: scale(1.03); }
            100% { opacity: 1; transform: scale(1); }
        }

        .animate-fadeIn {
            animation: homeZoomOut 0.25s ease;
        }

        .animate-zoom-out-enter {
            animation: homeZoomOut 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 8px rgba(79, 70, 229, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(79, 70, 229, 0);
            }
        }

        .volume-pulse-badge {
            animation: pulse-ring 1.2s infinite;
        }

        @keyframes slideInFromRight {
            0% { transform: translateX(20px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideInFromLeft {
            0% { transform: translateX(-20px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        .animate-slide-right {
            animation: slideInFromRight 0.26s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .animate-slide-left {
            animation: slideInFromLeft 0.26s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* iOS Liquid Glass Floating Navigation Dock */
        .liquid-nav-container {
            position: fixed;
            bottom: max(env(safe-area-inset-bottom, 14px), 18px);
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            padding: 0 16px;
            z-index: 40;
            pointer-events: none;
        }

        .liquid-dock {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-around;
            width: 100%;
            max-width: 440px;
            height: 68px;
            padding: 6px 8px;
            border-radius: 9999px;
            pointer-events: auto;
            user-select: none;
            -webkit-user-select: none;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(36px) saturate(210%);
            -webkit-backdrop-filter: blur(36px) saturate(210%);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.16), 0 8px 20px -4px rgba(0, 0, 0, 0.08), inset 0 1.5px 3px rgba(255, 255, 255, 1), inset 0 -2px 3px rgba(0, 0, 0, 0.06), inset 0 0 12px rgba(255, 255, 255, 0.5);
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .dark .liquid-dock {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: 0 28px 52px -10px rgba(0, 0, 0, 0.65), 0 10px 24px -4px rgba(0, 0, 0, 0.4), inset 0 1.5px 3px rgba(255, 255, 255, 0.22), inset 0 -1.5px 3px rgba(0, 0, 0, 0.55), inset 0 0 15px rgba(99, 102, 241, 0.15);
        }

        .liquid-bubble {
            position: absolute;
            top: 5px;
            bottom: 5px;
            left: 0;
            border-radius: 9999px;
            z-index: 1;
            pointer-events: none;
            will-change: transform, width;
            transform: translateX(0);
            background: linear-gradient(135deg, rgba(240, 244, 255, 0.95) 0%, rgba(210, 224, 255, 0.75) 100%);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 8px 20px -3px rgba(26, 98, 255, 0.18), inset 0 1.5px 2px rgba(255, 255, 255, 1), inset 0 -3px 6px rgba(26, 98, 255, 0.12);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.35, 1), width 0.35s cubic-bezier(0.25, 1, 0.35, 1);
        }

        .dark .liquid-bubble {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.55) 0%, rgba(79, 70, 229, 0.35) 100%);
            border: 1px solid rgba(165, 180, 252, 0.55);
            box-shadow: 0 8px 20px -3px rgba(0, 0, 0, 0.45), inset 0 1.5px 2px rgba(255, 255, 255, 0.35), inset 0 -2px 4px rgba(79, 70, 229, 0.3);
        }

        .ios-glass-card {
            background: #ffffff !important;
            border: 1px solid rgba(226, 232, 240, 0.95) !important;
            box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.04), 0 4px 6px -4px rgba(0, 0, 0, 0.02) !important;
        }

        .dark .ios-glass-card {
            background: #0f172a !important;
            border: 1px solid rgba(51, 65, 85, 0.7) !important;
            box-shadow: 0 12px 24px -6px rgba(0, 0, 0, 0.45) !important;
        }

        .ios-glass-modal {
            background: #ffffff !important;
            border: 1px solid #e2e8f0 !important;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25) !important;
        }

        .dark .ios-glass-modal {
            background: #0f172a !important;
            border: 1px solid #334155 !important;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.75) !important;
        }

        .liquid-nav-btn {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            height: 100%;
            padding: 2px 0;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .liquid-nav-btn:active {
            transform: scale(0.92);
        }

        .liquid-icon-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 26px;
            font-size: 20px;
            color: #475569;
            transition: color 0.3s ease, transform 0.3s cubic-bezier(0.34, 1.5, 0.64, 1);
        }

        .dark .liquid-icon-wrap {
            color: #94a3b8;
        }

        .liquid-label {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: -0.01em;
            margin-top: 3px;
            color: #64748b;
            transition: color 0.3s ease, font-weight 0.2s ease;
        }

        .dark .liquid-label {
            color: #94a3b8;
        }

        .liquid-nav-btn.is-active .liquid-icon-wrap {
            color: #1a62ff !important;
            transform: translateY(-1.5px) scale(1.08);
        }

        .dark .liquid-nav-btn.is-active .liquid-icon-wrap {
            color: #818cf8 !important;
        }

        .liquid-nav-btn.is-active .liquid-label {
            color: #1a62ff !important;
            font-weight: 700;
        }

        .dark .liquid-nav-btn.is-active .liquid-label {
            color: #a5b4fc !important;
        }

        .liquid-badge {
            position: absolute;
            top: -2px;
            right: -8px;
            min-width: 17px;
            height: 17px;
            padding: 0 4px;
            border-radius: 9999px;
            background-color: #ef4444;
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #ffffff;
            box-shadow: 0 2px 5px rgba(239, 68, 68, 0.4);
            line-height: 1;
            z-index: 3;
        }

        .dark .liquid-badge {
            border-color: #0f172a;
        }
    </style>
</head>

        function playNotificationChime(type = 'wallet_credit', forcePreview = false) {
            if (!state.soundEnabled && !forcePreview) return;

            if ('vibrate' in navigator) {
                try { navigator.vibrate(type === 'excess_spent' ? [180, 90, 220] : [120, 60, 120]); } catch (e) { }
            }

            const volRatio = Math.max(0, Math.min(100, Number(state.soundVolume || 80))) / 100;
            if (volRatio <= 0.01) return;

            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                if (!sharedAudioCtx) sharedAudioCtx = new AudioCtx();
                if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume();

                const now = sharedAudioCtx.currentTime;
                const peakGain = 0.28 * volRatio;
                const isExcess = type === 'excess_spent';
                const notes = isExcess ? [659.25, 523.25] : [523.25, 783.99];
                const step = isExcess ? 0.14 : 0.11;
                const decay = isExcess ? 0.36 : 0.45;

                notes.forEach((freq, idx) => {
                    const osc = sharedAudioCtx.createOscillator();
                    const gain = sharedAudioCtx.createGain();
                    osc.type = isExcess ? 'triangle' : 'sine';
                    const startTime = now + idx * step;
                    osc.frequency.setValueAtTime(freq, startTime);
                    gain.gain.setValueAtTime(0.0001, startTime);
                    gain.gain.exponentialRampToValueAtTime(peakGain, startTime + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + decay);
                    osc.connect(gain);
                    gain.connect(sharedAudioCtx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + decay + 0.02);
                });
            } catch (err) { }
        }

        async function adjustWallet(userId, delta) {
            const { db, doc, runTransaction } = window.FB;
            const ref = doc(db, 'users', userId);
            const result = await runTransaction(db, async (tx) => {
                const snap = await tx.get(ref);
                if (!snap.exists()) throw new Error('User not found');
                let wallet = round2(snap.data().wallet);
                let excess = round2(snap.data().excessSpent);
                let excessCleared = 0;
                let excessAdded = 0;

                if (delta > 0) {
                    excessCleared = Math.min(excess, delta);
                    excess = round2(excess - excessCleared);
                    wallet = round2(wallet + (delta - excessCleared));
                } else if (delta < 0) {
                    const spend = -delta;
                    if (wallet >= spend) {
                        wallet = round2(wallet - spend);
                    } else {
                        excessAdded = round2(spend - wallet);
                        excess = round2(excess + excessAdded);
                        wallet = 0;
                    }
                }
                tx.update(ref, { wallet, excessSpent: excess });
                return { wallet, excess, excessCleared: round2(excessCleared), excessAdded };
            });

            const local = state.users.find(u => u.id === userId);
            if (local) { local.wallet = result.wallet; local.excessSpent = result.excess; }
            if (state.currentUser && state.currentUser.id === userId) {

                state.currentUser.excessSpent = result.excess;
                persistCurrentUser(state.currentUser);
            }
            return result;
        }

            const t = e.touches[0];

            const mainContent = document.getElementById('main-content');

                const absY = Math.abs(rawDiffY);
                if (absX < DIRECTION_LOCK_THRESHOLD && absY < DIRECTION_LOCK_THRESHOLD) return;

                if (absX >= absY) {
                    gestureMode = (gestureStartX < 44 && rawDiffX > 0) ? 'edge-back' : 'ignored';
                    return;
                }

                const mainContent = document.getElementById('main-content');
                if (isPtrAllowed() && mainContent && mainContent.scrollTop <= 0 && rawDiffY > 0) {
                    gestureMode = 'ptr';
                } else {

            if (gestureMode !== 'ptr') return;

                resetPtrVisuals();

            gestureCurrentY = t.clientY;
            const pullDistance = ptrPullDistance(rawDiffY);
            const ptrContainer = document.getElementById('ptr-container');
            const icon = document.getElementById('ptr-icon');
            const text = document.getElementById('ptr-text');

            if (ptrContainer) {
                const progress = Math.min(1, pullDistance / REFRESH_THRESHOLD);
                ptrContainer.style.opacity = progress.toString();
                ptrContainer.style.transform = `translateY(${pullDistance}px)`;

                if (pullDistance >= REFRESH_THRESHOLD) {

            const rawDiffY = gestureCurrentY - gestureStartY;
            const ptrContainer = document.getElementById('ptr-container');
            const icon = document.getElementById('ptr-icon');

        function resetPtrVisuals() {

        function softRender() {
            if (state.activeTab === 'add') {
                syncPersistentHeader();

            }
            const m = document.getElementById('main-content');
            const top = m ? m.scrollTop : 0;
            const ae = document.activeElement;

            const pos = ae && ae.selectionStart;
            const dir = state.slideDirection;
            state.slideDirection = 'no-anim';

        window.startAppListeners = function () {
            if (!window.FB || window.__listenersStarted) return;
            window.__listenersStarted = true;
            const { db, collection, onSnapshot, doc, setDoc, deleteDoc } = window.FB;

            window.activeUnsubscribers.push(onSnapshot(collection(db, 'users'), (snapshot) => {
                state.users = snapshot.docs.map(docSnap => docSnap.data());
                if (state.currentUser) {
                    const freshUser = state.users.find(u => u.id === state.currentUser.id);
                    if (freshUser) {
                        state.currentUser = freshUser;
                        persistCurrentUser(freshUser);
                    } else if (state.users.length > 0) {
                        forceLogoutDeletedUser();
                    }
                }
                initialSyncFlags.users = true;
                if (state.isDbLoading) checkInitialSyncComplete(); else softRender();
            }, () => {
                initialSyncFlags.users = true;
                checkInitialSyncComplete();
            }));

            window.activeUnsubscribers.push(onSnapshot(collection(db, 'settings'), (snapshot) => {
                snapshot.docs.forEach(docSnap => {
                    if (docSnap.id === 'app_settings') state.appSettings = docSnap.data();
                });
                if (!state.isDbLoading) softRender();
            }, () => { }));

            window.activeUnsubscribers.push(onSnapshot(collection(db, 'walletTransactions'), (snapshot) => {
                state.walletTransactions = snapshot.docs.map(docSnap => docSnap.data());
                if (!state.isDbLoading) softRender();
            }, () => { }));

            window.activeUnsubscribers.push(onSnapshot(collection(db, 'notifications'), (snapshot) => {
                const allNotifs = snapshot.docs.map(docSnap => docSnap.data());

                if (initialNotificationsLoaded && state.currentUser) {
                    const isAdmin = state.currentUser.role === 'admin';
                    allNotifs.forEach(n => {
                        if (!knownNotificationIds.has(n.id)) {
                            const isForMe = (isAdmin && n.recipientRole === 'admin') || (n.recipientId === state.currentUser.id);
                            if (isForMe && !n.read) {
                                const toastType = n.type === 'excess_spent' ? 'error' : 'success';
                                sendBrowserNotification(n.title, n.message, n.type);
                                playNotificationChime(n.type);
                                showToast(`${n.title}: ${n.message}`, toastType);
                            }
                        }
                    });
                }

                knownNotificationIds = new Set(allNotifs.map(n => n.id));
                initialNotificationsLoaded = true;
                state.notifications = allNotifs;
                if (!state.isDbLoading) softRender();
            }, () => { }));

            window.activeUnsubscribers.push(onSnapshot(collection(db, 'expenses'), async (snapshot) => {
                let allExpenses = snapshot.docs.map(docSnap => docSnap.data());

                if (state.appSettings && state.appSettings.autoDeleteEnabled && state.currentUser && state.currentUser.role === 'admin') {
                    const now = new Date();
                    const cutoffDate = new Date(now.getFullYear(), now.getMonth() - 2, now.getDate());
                    const expiredExpenses = allExpenses.filter(exp => exp.date && parseLocal(exp.date) < cutoffDate);

                    for (const exp of expiredExpenses) {
                        try {
                            const recycleItem = { ...exp, deletedAt: new Date().toISOString(), deletedBy: 'Auto-Delete System (2-Month Limit)' };
                            await setDoc(doc(db, 'recycleBin', exp.id), recycleItem);
                            await deleteDoc(doc(db, 'expenses', exp.id));
                        } catch (err) { }
                    }
                }

                state.expenses = allExpenses;
                initialSyncFlags.expenses = true;
                if (state.isDbLoading) checkInitialSyncComplete(); else softRender();
            }, () => {
                initialSyncFlags.expenses = true;
                checkInitialSyncComplete();
            }));

            window.activeUnsubscribers.push(onSnapshot(collection(db, 'recycleBin'), (snapshot) => {
                state.recycleBin = snapshot.docs.map(docSnap => docSnap.data());
                if (!state.isDbLoading) softRender();
            }, () => { }));

            window.activeUnsubscribers.push(onSnapshot(collection(db, 'userRecycleBin'), async (snapshot) => {
                let deletedUsers = snapshot.docs.map(docSnap => docSnap.data());
                const now = new Date();
                const stillPending = [];

                for (const item of deletedUsers) {
                    let expired = false;
                    if (item.deletedAt) {
                        const hoursDiff = (now.getTime() - new Date(item.deletedAt).getTime()) / (1000 * 60 * 60);
                        expired = hoursDiff >= 48;
                    }
                    if (expired && state.currentUser && state.currentUser.role === 'admin') {
                        try {
                            await deleteDoc(doc(db, 'userRecycleBin', item.userId));
                            await deleteDoc(doc(db, 'users', item.userId));
                            const userExps = state.expenses.filter(e => e.userId === item.userId);
                            for (const ue of userExps) {
                                await deleteDoc(doc(db, 'expenses', ue.id));
                            }
                        } catch (e) {
                            stillPending.push(item);
                        }
                        continue;
                    }
                    stillPending.push(item);
                }

                state.userRecycleBin = stillPending;
                if (!state.isDbLoading) softRender();
            }, () => { }));

            window.activeUnsubscribers.push(onSnapshot(collection(db, 'passwordRequests'), (snapshot) => {
                state.passwordRequests = snapshot.docs.map(docSnap => docSnap.data());
                if (!state.isDbLoading) softRender();
            }, () => { }));
        };

        function showToast(message, type = 'success', undoCallback = null) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');

            let bgStyle = 'bg-slate-900/95 text-white border-slate-700/80 shadow-slate-900/30';
            let icon = 'fa-circle-info text-indigo-400';

            if (type === 'success') {
                bgStyle = 'bg-emerald-600/95 text-white border-emerald-500/60 shadow-emerald-900/25';
                icon = 'fa-circle-check text-emerald-200';
            } else if (type === 'error') {
                bgStyle = 'bg-rose-600/95 text-white border-rose-500/60 shadow-rose-900/25';
                icon = 'fa-circle-exclamation text-rose-200';
            }

            toast.className = `${bgStyle} border px-4 py-3 rounded-2xl shadow-xl flex items-center justify-between text-xs sm:text-sm font-medium transform transition-all duration-300 translate-y-[20px] opacity-0 pointer-events-auto gap-3 backdrop-blur-xl`;

            const wantsUndo = undoCallback && (!state.currentUser || state.currentUser.role !== 'admin');
            const undoBtnHtml = wantsUndo
                ? `<button id="toast-undo-btn" class="px-2.5 py-1 bg-white text-slate-900 rounded-xl font-bold text-xs hover:bg-slate-100 transition shrink-0 shadow-sm">Undo</button>`
                : '';

            toast.innerHTML = `
                <div class="flex items-center space-x-2.5 min-w-0 flex-1">
                    <i class="fa-solid ${icon} text-base shrink-0"></i>
                    <span class="flex-1 break-words leading-tight">${escapeHtml(message)}</span>
                </div>
                ${undoBtnHtml}
            `;

            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-[20px]', 'opacity-0'));

            if (wantsUndo) {
                const undoBtn = toast.querySelector('#toast-undo-btn');
                if (undoBtn) {
                    undoBtn.onclick = () => {
                        undoCallback();
                        toast.classList.add('translate-y-[20px]', 'opacity-0');
                        setTimeout(() => toast.remove(), 300);
                    };
                }
            }

            setTimeout(() => {
                toast.classList.add('translate-y-[20px]', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function formatCurrency(amount) {

        function formatDate(dateString) {
            if (!dateString) return '';

        function formatTimestamp(isoString) {
            if (!isoString) return '';

        }

        function formatMonthName(yearMonth) {
            if (!yearMonth || yearMonth === 'All') return 'All Months';
            const [year, month] = yearMonth.split('-');

        }

        function getWalletTxnTheme(t) {
            const titleLower = (t.title || '').toLowerCase();

            const isShortage = t.type === 'shortage';
            const isUndo = t.type === 'undo_refund' || titleLower.includes('undo') || titleLower.includes('refund');
            const isExcessCleared = t.type === 'excess_cleared' || titleLower.includes('cleared excess') || subLower.includes('cleared ₹') || subLower.includes('reduced excess');

            if (isShortage) {
                return {
                    label: 'Shortage Deduction',
                    icon: 'fa-arrow-up-long rotate-45',
                    sign: '-',
                    cardAccent: '!border-l-rose-500',
                    iconBox: 'bg-rose-500/12 text-rose-600 dark:text-rose-400',
                    badge: 'bg-rose-50 dark:bg-rose-950/70 text-rose-700 dark:text-rose-300 border-rose-200/80 dark:border-rose-800/80',
                    subtitleColor: 'text-rose-600 dark:text-rose-400',
                    amountColor: 'text-rose-600 dark:text-rose-400'
                };
            }
            if (isUndo) {
                return {
                    label: isExcessCleared ? 'Undo + Excess Cleared' : 'Undo Expense',
                    icon: 'fa-rotate-left',
                    sign: '+',
                    cardAccent: '!border-l-sky-500',
                    iconBox: 'bg-sky-500/12 text-sky-600 dark:text-sky-400',
                    badge: 'bg-sky-50 dark:bg-sky-950/70 text-sky-700 dark:text-sky-300 border-sky-200/80 dark:border-sky-800/80',
                    subtitleColor: 'text-sky-600 dark:text-sky-400',
                    amountColor: 'text-sky-600 dark:text-sky-400'

                    label: 'Excess Cleared',

                    sign: '+',
                    cardAccent: '!border-l-amber-500',
                    iconBox: 'bg-amber-500/12 text-amber-600 dark:text-amber-400',

                    subtitleColor: 'text-amber-600 dark:text-amber-400',
                    amountColor: 'text-amber-600 dark:text-amber-400'
                };
            }
            return {

                icon: 'fa-arrow-down-long rotate-45',
                sign: '+',
                cardAccent: '!border-l-emerald-500',

        async function handleWalletAdd(e, userId) {
            e.preventDefault();
            const submitBtn = document.getElementById('wallet-submit-btn');
            if (submitBtn && submitBtn.disabled) return;

            const amountToAdd = round2(parseFloat(document.getElementById('wallet-add-amount').value));
            if (isNaN(amountToAdd) || amountToAdd === 0) {
                showToast('Please enter a valid amount.', 'error');
                return;
            }

            const user = state.users.find(u => u.id === userId);
            if (!user) return;

            if (submitBtn) submitBtn.disabled = true;

            try {
                const res = await adjustWallet(userId, amountToAdd);
                const { db, doc, setDoc } = window.FB;
                const walletPart = round2(amountToAdd - res.excessCleared);

                const txnId = 'txn_' + Date.now();
                let txnType = amountToAdd >= 0 ? 'topup' : 'shortage';
                let txnTitle = amountToAdd >= 0 ? 'Added Wallet Funds' : 'Shortage Money Adjustment';
                let txnSubtitle = '';

                if (amountToAdd > 0 && res.excessCleared > 0 && walletPart > 0) {
                    txnType = 'excess_cleared';
                    txnTitle = `Cleared Excess (${formatCurrency(res.excessCleared)}) & Added Wallet (${formatCurrency(walletPart)})`;
                    txnSubtitle = `Settled ${formatCurrency(res.excessCleared)} excess due + credited ${formatCurrency(walletPart)} to wallet`;
                } else if (amountToAdd > 0 && res.excessCleared > 0) {
                    txnType = 'excess_cleared';
                    txnTitle = 'Cleared Excess Spent Due';
                    txnSubtitle = `Settled ${formatCurrency(res.excessCleared)} excess spent due`;
                }

                await setDoc(doc(db, 'walletTransactions', txnId), {
                    id: txnId,
                    userId: userId,
                    type: txnType,
                    title: txnTitle,
                    subtitle: txnSubtitle,
                    amount: Math.abs(amountToAdd),
                    timestamp: new Date().toISOString(),
                    performedBy: state.currentUser.name
                });

                const notifTitle = amountToAdd > 0 ? 'Wallet Credited!' : 'Wallet Balance Adjusted';
                let notifMessage = amountToAdd > 0
                    ? `${state.currentUser.name} added ${formatCurrency(amountToAdd)} to your wallet. Available Balance: ${formatCurrency(res.wallet)}.`
                    : `${state.currentUser.name} adjusted your wallet by ${formatCurrency(amountToAdd)}. Available Balance: ${formatCurrency(res.wallet)}.`;

                if (amountToAdd > 0 && res.excessCleared > 0) {
                    notifMessage = `${state.currentUser.name} added ${formatCurrency(amountToAdd)} (${formatCurrency(res.excessCleared)} settled excess due). New Balance: ${formatCurrency(res.wallet)}.`;
                }

                await createAppNotification({
                    recipientId: userId,
                    recipientRole: 'user',
                    type: amountToAdd > 0 ? 'wallet_credit' : 'wallet_debit',
                    title: notifTitle,
                    message: notifMessage,
                    amount: Math.abs(amountToAdd),
                    triggeredBy: state.currentUser.name
                });

                closeModal();
                showToast(`Successfully processed ${formatCurrency(amountToAdd)} for ${user.name}!`, 'success');
            } catch (err) {
                if (submitBtn) submitBtn.disabled = false;
                showToast('Failed to update wallet. Please try again.', 'error');
            }
        }

            const pendingRequestsCount = state.passwordRequests.filter(r => r.status === 'pending').length;

            const usersBtn = document.getElementById('nav-btn-users');

                    badgeEl.classList.remove('hidden');

            if (!nav || !bubble) return;

            requestAnimationFrame(() => {
                nav.querySelectorAll('.liquid-nav-btn').forEach(btn => {
                    if (btn.id === activeTargetId) {
                        btn.classList.add('is-active');
                        bubble.style.width = `${btn.offsetWidth}px`;
                        bubble.style.transform = `translateX(${btn.offsetLeft}px)`;
                    } else {
                        btn.classList.remove('is-active');
                    }
                });
            });
        }

        function openNewExpenseTab() {
            state.editingExpenseId = null;
            state.tempBillData = null;
            state.tempFormCache = null;
            switchTab('add');
        }

        function switchTab(tab, keepEditState = false) {
            const prevIndex = tabOrder.indexOf(state.activeTab);
            if (tab === 'summary') {
                state.activeTab = (state.currentUser && state.currentUser.role === 'admin') ? 'admin' : 'analytics';
            } else {
                state.activeTab = tab;
            }
            const nextIndex = tabOrder.indexOf(state.activeTab);
            state.slideDirection = nextIndex >= prevIndex ? 'animate-slide-right' : 'animate-slide-left';

            if (!keepEditState) {
                state.editingExpenseId = null;
                state.tempBillData = null;
                state.tempFormCache = null;
            }

            syncPersistentHeader();
            syncPersistentNavbar();
            render();
        }

        function render() {
            const app = document.getElementById('app');
            if (!app) return;

            applyTheme();

            if (state.isDbLoading) {
                syncPersistentHeader();
                syncPersistentNavbar();
                app.innerHTML = renderDatabaseLoadingScreen();
                return;
            }

            const shouldPlayZoomEntrance = state.justFinishedLoading;
            if (state.justFinishedLoading) state.justFinishedLoading = false;

            if (!state.currentUser) {
                syncPersistentHeader();
                syncPersistentNavbar();
                app.innerHTML = state.authView === 'forgot' ? renderForgotPasswordPage() : renderLoginPage();
                return;
            }

            syncPersistentHeader();
            const showPtr = isPtrAllowed();

            app.innerHTML = `

                            <i id="ptr-icon" class="fa-solid fa-arrow-down"></i>
                            <span id="ptr-text">Pull to refresh</span>

                    ${renderActiveTabContent()}
                </main>

                <div id="add-fab-container">
                    ${state.activeTab !== 'add' ? fabButtonHtml() : ''}
                </div>
            `;

            if (shouldPlayZoomEntrance) triggerZoomOutEntrance();
            syncPersistentNavbar();
        }

        async function handleEditUser(e, userId) {
            e.preventDefault();
            const submitBtn = document.getElementById('edit-user-btn');
            if (submitBtn && submitBtn.disabled) return;

            const name = document.getElementById('edit-user-name').value.trim();
            const role = document.getElementById('edit-user-role').value;

            const user = state.users.find(u => u.id === userId);
            if (!user || !name) return;

            if (user.role === 'admin' && role !== 'admin' && state.users.filter(u => u.role === 'admin').length <= 1) {
                showToast('At least one administrator is required.', 'error');
                return;
            }

            if (submitBtn) submitBtn.disabled = true;

            try {
                const { db, doc, updateDoc } = window.FB;
                await updateDoc(doc(db, 'users', userId), { name, role });

                if (state.currentUser.id === userId) {
                    state.currentUser.name = name;
                    state.currentUser.role = role;
                    persistCurrentUser(state.currentUser);
                }
                closeModal();
                showToast('User updated successfully!', 'success');
            } catch (err) {
                if (submitBtn) submitBtn.disabled = false;
                showToast('Failed to update user.', 'error');
            }
        }

        async function handleAddNewUser(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('create-user-btn');
            if (submitBtn && submitBtn.disabled) return;

            const name = document.getElementById('new-user-name').value.trim();
            const username = document.getElementById('new-user-username').value.trim().toLowerCase();
            const password = document.getElementById('new-user-password').value;
            const confirmPassword = document.getElementById('new-user-confirm-password').value;
            const role = document.getElementById('new-user-role').value;

            if (!password || password.length < 4) {
                showToast('Password must be at least 4 characters.', 'error');
                return;
            }
            if (password !== confirmPassword) {
                showToast('Passwords do not match!', 'error');
                return;
            }
            if (state.users.some(u => u.username.toLowerCase() === username)) {
                showToast('Username already exists.', 'error');
                return;
            }

            if (submitBtn) submitBtn.disabled = true;

            try {
                const userId = 'usr_' + Date.now();
                const newUser = { id: userId, name, username, password, role, email: `${username}@clickfactory.com`, wallet: 0, excessSpent: 0 };
                const { db, doc, setDoc } = window.FB;
                await setDoc(doc(db, 'users', userId), newUser);
                closeModal();
                showToast(`User ${name} added successfully!`, 'success');
            } catch (err) {
                if (submitBtn) submitBtn.disabled = false;
                showToast('Failed to add user.', 'error');
            }
        }

        function confirmRemoveUser(userId) {
            const userName = uName(userId);
            const target = state.users.find(u => u.id === userId);
            if (target && target.role === 'admin' && state.users.filter(u => u.role === 'admin').length <= 1) {
                showToast('You cannot delete the last administrator.', 'error');
                return;
            }
            showConfirmModal(
                'Remove User',
                `Move user "${userName}" and their expenses to Deleted Users Bin? They will be permanently wiped after 48 hours unless restored.`,
                async () => {
                    const { db, doc, deleteDoc, setDoc } = window.FB;
                    const userToRemove = state.users.find(u => u.id === userId);
                    if (!userToRemove) return;
                    try {
                        const userExps = state.expenses
                            .filter(e => e.userId === userId)
                            .map(e => (e.billAttachment && String(e.billAttachment).startsWith('data:')) ? { ...e, billAttachment: null } : e);

                        await setDoc(doc(db, 'userRecycleBin', userId), {
                            userId: userToRemove.id,
                            name: userToRemove.name,
                            username: userToRemove.username,
                            password: userToRemove.password,
                            role: userToRemove.role,
                            email: userToRemove.email,
                            wallet: userToRemove.wallet || 0,
                            excessSpent: userToRemove.excessSpent || 0,
                            expenses: userExps,
                            deletedAt: new Date().toISOString()
                        });
                        await deleteDoc(doc(db, 'users', userId));
                        for (const ue of userExps) {
                            await deleteDoc(doc(db, 'expenses', ue.id));
                        }
                        showToast(`User ${userName} moved to Deleted Users Bin.`, 'success');
                    } catch (err) {
                        showToast('Failed to remove user (data may be too large).', 'error');
                    }
                }
            );
        }

        function renderUserAnalyticsTab() {
            const userExpenses = state.expenses.filter(e => e.userId === state.currentUser.id);
            const total = userExpenses.reduce((s, e) => s + Number(e.amount || 0), 0);
            const office = userExpenses.filter(e => e.category === 'Office').reduce((s, e) => s + Number(e.amount || 0), 0);
            const shoot = userExpenses.filter(e => e.category === 'Shoot').reduce((s, e) => s + Number(e.amount || 0), 0);

            const monthlyMap = {};
            userExpenses.forEach(exp => {
                const monthKey = exp.date ? exp.date.substring(0, 7) : 'Unknown';
                if (!monthlyMap[monthKey]) monthlyMap[monthKey] = { office: 0, shoot: 0, total: 0 };
                if (exp.category === 'Office') monthlyMap[monthKey].office += Number(exp.amount || 0);
                if (exp.category === 'Shoot') monthlyMap[monthKey].shoot += Number(exp.amount || 0);
                monthlyMap[monthKey].total += Number(exp.amount || 0);
            });
            const months = Object.keys(monthlyMap).sort().reverse();

            return `
                <div class="space-y-4 w-full max-w-2xl mx-auto">

                            <div class="bg-black/15 backdrop-blur-sm rounded-2xl p-3 min-w-0 border border-white/10"><span class="text-xs text-violet-200 truncate block">Shoot Expense</span><p class="font-bold text-sm sm:text-base break-all">${formatCurrency(shoot)}</p></div>

                        </div>
                        ${months.length === 0 ? `
                            <div class="ios-glass-card rounded-3xl p-8 text-center shadow-sm text-xs text-slate-400">No expenses recorded yet.</div>
                        ` : months.map(m => `
                            <div class="ios-glass-card rounded-3xl p-6 sm:p-7 shadow-sm space-y-3 w-full mt-3">
                                <div class="flex items-center justify-between">
                                    <span class="font-bold text-sm sm:text-base text-slate-900 dark:text-white truncate pr-2">${formatMonthName(m)}</span>
                                    <span class="font-bold text-base text-indigo-600 dark:text-indigo-400 shrink-0">${formatCurrency(monthlyMap[m].total)}</span>
                                </div>
                                <div class="flex justify-between text-xs sm:text-sm text-slate-500 dark:text-slate-400 pt-3 border-t border-slate-200/50 dark:border-slate-800">
                                    <span class="truncate pr-1">Office: ${formatCurrency(monthlyMap[m].office)}</span>
                                    <span class="truncate pl-1 text-right">Shoot: ${formatCurrency(monthlyMap[m].shoot)}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        async function handlePasswordChange(e) {

                showToast('New passwords do not match!', 'error');
                return;

            if (submitBtn) submitBtn.disabled = true;

            try {
                const { db, doc, updateDoc } = window.FB;
                await updateDoc(doc(db, 'users', me.id), { password: newPass });
                closeModal();

                showToast('Failed to update password.', 'error');
            }

        function downloadCSV(dataArray, filename) {
            if (dataArray.length === 0) {
                showToast('No records available to export.', 'error');
                return;
            }
            const headers = ['ID', 'User', 'Title', 'Category', 'Client & Place', 'Amount (INR)', 'Date', 'Notes', 'Has Bill'];
            const safe = v => {
                let s = String(v ?? '');
                if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
                return '"' + s.replace(/"/g, '""') + '"';
            };
            const lines = [
                headers.map(safe).join(','),
                ...dataArray.map(e => [e.id, e.userName, e.title, e.category, e.clientNamePlace, e.amount, e.date, e.notes, e.billAttachment ? 'Yes' : 'No'].map(safe).join(','))
            ];
            const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            showToast(`Exported ${dataArray.length} records!`, 'success');
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
