<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <link rel="icon" type="image/gif" href="https://clickfactoryphotography.com/wp-content/uploads/2022/04/crop-logo.gif">
    <link rel="apple-touch-icon" href="https://clickfactoryphotography.com/wp-content/uploads/2022/04/crop-logo.gif">
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Expense%20tracker%22%2C%22short_name%22%3A%22ExpenseTracker%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f172a%22%2C%22theme_color%22%3A%22%234f46e5%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fclickfactoryphotography.com%2Fwp-content%2Fuploads%2F2022%2F04%2Fcrop-logo.gif%22%2C%22sizes%22%3A%22192x192%20512x512%22%2C%22type%22%3A%22image%2Fgif%22%7D%5D%7D">

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {

                        }
                    }
                }
            }

    <style>
        *, ::before, ::after { box-sizing: border-box; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            margin: 0; padding: 0; width: 100vw;
            overflow-x: hidden; word-wrap: break-word; overflow-wrap: break-word;
            background-color: #0f172a;
        }
        input[type="date"], select { appearance: none; -webkit-appearance: none; }
        .app-container {
            width: 100%; max-width: 100%; min-height: 100vh;
            background-color: #f8fafc; display: flex; flex-direction: column;
            padding-top: max(env(safe-area-inset-top), 12px);
        }
        @media (min-width: 640px) {
            .app-container {
                max-width: 520px; min-height: 92vh; margin: 4vh auto;
                border-radius: 2.5rem; overflow: hidden;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
                border: 8px solid #1e293b; padding-top: 0;
            }
        }
        .logo-container img {
            width: auto; height: auto; max-width: 100%; max-height: 100%;
            object-fit: contain; object-position: center;
        }
        .custom-date-wrapper {
            position: relative; background: #f8fafc;
        }
        .dark .custom-date-wrapper {
            background: #1e293b;
        }
        .custom-date-wrapper input[type="date"] {
            position: relative; color: transparent; width: 100%;
        }
        .custom-date-wrapper input[type="date"]:focus,
        .custom-date-wrapper input[type="date"]:valid {
            color: inherit;
        }
        .custom-date-placeholder {
            position: absolute; left: 10px; top: 50%;
            transform: translateY(-50%); pointer-events: none;
            color: #94a3b8; font-size: 11px;
        }
        .custom-date-wrapper input[type="date"]:focus + .custom-date-placeholder,
        .custom-date-wrapper input[type="date"]:valid + .custom-date-placeholder {
            display: none;
        }
        /* Liquid Glass Navigation Effect */
        .liquid-glass-pill {
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.05) 60%, rgba(255, 255, 255, 0.1) 100%), rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.3), inset 0 -2px 4px rgba(0, 0, 0, 0.6);
        }
        .dark .liquid-glass-pill {
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.02) 60%, rgba(255, 255, 255, 0.08) 100%), rgba(2, 6, 23, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.15), inset 0 -2px 4px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 dark:text-slate-100 flex flex-col justify-center items-center h-full selection:bg-indigo-500 selection:text-white">

    <div id="app" class="app-container w-full flex flex-col relative dark:bg-slate-950 transition-colors duration-200">
        <!-- Loader during initialization with brand logo -->
        <div class="flex-1 flex flex-col items-center justify-center p-6 text-center animate-fadeIn">
            <div class="relative w-14 h-14 flex items-center justify-center mx-auto mb-6 logo-container">
                <div class="absolute inset-0 rounded-2xl bg-indigo-500/20 dark:bg-indigo-500/10 animate-ping"></div>
                <img src="https://clickfactoryphotography.com/wp-content/uploads/2022/04/crop-logo.gif" alt="Click Factory Logo" class="relative w-10 h-10 object-contain drop-shadow-md animate-pulse" onerror="this.src='https://placehold.co/40x40/4f46e5/ffffff?text=CF'">
            </div>
            
            <div class="flex items-center space-x-2 mb-3">
                <div class="w-2 h-2 rounded-full bg-indigo-600 animate-bounce [animation-delay:-0.3s]"></div>
                <div class="w-2 h-2 rounded-full bg-indigo-600 animate-bounce [animation-delay:-0.15s]"></div>
                <div class="w-2 h-2 rounded-full bg-indigo-600 animate-bounce"></div>
            </div>

            <h2 class="font-bold text-base text-slate-800 dark:text-white tracking-tight">Click Factory</h2>
            <p class="text-xs font-medium text-slate-500 dark:text-slate-400 mt-1">Loading Expense Tracker...</p>
        </div>
    </div>

    <!-- Notification Toast Container -->
    <div id="toast-container" class="fixed top-12 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none w-11/12 max-w-sm"></div>

    <!-- SDK Modular Imports via ESM CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, setDoc, doc, deleteDoc, updateDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref as storageRef, uploadString, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDguDaGIQ8dbwLoqbXKDD4ixfPg7y3VCpg",
            authDomain: "expensetracker-ec267.firebaseapp.com",
            projectId: "expensetracker-ec267",
            storageBucket: "expensetracker-ec267.firebasestorage.app",
            messagingSenderId: "789003178398",
            appId: "1:789003178398:web:1579e411ad728268c6468f"
        };

        const appInstance = initializeApp(firebaseConfig);
        const db = getFirestore(appInstance);
        const storage = getStorage(appInstance);

        window.FB = { db, storage, collection, getDocs, setDoc, doc, deleteDoc, updateDoc, onSnapshot, query, orderBy, storageRef, uploadString, getDownloadURL, deleteObject };

        async function initializeData() {
            try {
                const usersSnap = await getDocs(collection(db, 'users'));
                if (usersSnap.empty) {
                    const defaultUsers = [
                        { id: 'usr_adm', name: 'Admin Manager', username: 'admin', password: 'adminpassword', role: 'admin', email: 'admin@clickfactory.com', wallet: 0, excessSpent: 0 },
                        { id: 'usr_1', name: 'User One', username: 'user1', password: 'password', role: 'user', email: 'user1@clickfactory.com', wallet: 0, excessSpent: 0 },
                        { id: 'usr_2', name: 'User Two', username: 'user2', password: 'password', role: 'user', email: 'user2@clickfactory.com', wallet: 0, excessSpent: 0 }
                    ];
                    for (const u of defaultUsers) {
                        await setDoc(doc(db, 'users', u.id), u);
                    }
                    await setDoc(doc(db, 'settings', 'admin_pass'), { password: 'adminpassword' });
                }

                const settingsSnap = await getDocs(collection(db, 'settings'));
                if (settingsSnap.empty || !settingsSnap.docs.some(d => d.id === 'app_settings')) {
                    await setDoc(doc(db, 'settings', 'app_settings'), { autoDeleteEnabled: false, currentVersion: '1.1.2' });
                }
            } catch (err) {
                console.error("Initialization warning:", err);
            }
        }

        initializeData().then(() => {
            window.startAppListeners();
        });
    </script>

    <script>
        const LOCAL_STORAGE_KEY = 'click_factory_current_user_v23';
        const CURRENT_CLIENT_APP_VERSION = '1.1.2';

        let state = {
            currentUser: null,
            adminPassword: 'adminpassword',
            users: [],
            expenses: [],
            walletTransactions: [],
            recycleBin: [],
            userRecycleBin: [],
            passwordRequests: [],
            appSettings: { autoDeleteEnabled: false, currentVersion: '1.1.2' },
            activeTab: 'home',
            filterCategory: 'All',
            filterMonth: 'All',
            filterUser: 'All',
            filterStartDate: '',
            filterEndDate: '',
            showDateFilter: false,
            searchQuery: '',
            darkMode: true,
            editingExpenseId: null,
            tempBillData: null,
            tempFormCache: null,
            authView: 'login',
            lastClearedExpensesCache: null
        };

        const savedUser = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (savedUser) {
            try { state.currentUser = JSON.parse(savedUser); } catch(e) {}
        }

        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, false);

        document.addEventListener('touchend', (e) => {
            if (!state.currentUser) return;
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            const diffX = touchEndX - touchStartX;
            const diffY = Math.abs(touchEndX - touchStartY);

            if (touchStartX < 50 && diffX > 80 && diffY < 100) {
                if (['recycle', 'requests', 'userRecycle'].includes(state.activeTab)) {
                    switchTab('profile');
                }
            }
        }, false);

        window.startAppListeners = function() {
            const { db, collection, onSnapshot, doc, setDoc, deleteDoc } = window.FB;

            onSnapshot(collection(db, 'users'), (snapshot) => {
                state.users = snapshot.docs.map(docSnap => docSnap.data());
                if (state.currentUser) {
                    const freshUser = state.users.find(u => u.id === state.currentUser.id);
                    if (freshUser) {
                        state.currentUser = freshUser;
                        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(freshUser));
                    }
                }
                render();
            }, (err) => console.error("Users listener error:", err));

            onSnapshot(collection(db, 'settings'), (snapshot) => {
                snapshot.docs.forEach(docSnap => {
                    if (docSnap.id === 'app_settings') {
                        state.appSettings = docSnap.data();
                    }
                });
                render();
            }, (err) => console.error("Settings listener error:", err));

            onSnapshot(collection(db, 'walletTransactions'), (snapshot) => {
                state.walletTransactions = snapshot.docs.map(docSnap => docSnap.data());
                render();
            }, (err) => console.error("Transactions listener error:", err));

            onSnapshot(collection(db, 'expenses'), async (snapshot) => {
                let allExpenses = snapshot.docs.map(docSnap => docSnap.data());
                
                if (state.appSettings && state.appSettings.autoDeleteEnabled) {
                    const now = new Date();
                    const cutoffDate = new Date(now.getFullYear(), now.getMonth() - 2, now.getDate());
                    
                    let expiredExpenses = allExpenses.filter(exp => {
                        if (!exp.date) return false;
                        const expDate = new Date(exp.date);
                        return expDate < cutoffDate;
                    });

                    if (expiredExpenses.length > 0) {
                        for (const exp of expiredExpenses) {
                            try {
                                const recycleItem = { ...exp, deletedAt: new Date().toISOString(), deletedBy: 'Auto-Delete System (2-Month Limit)' };
                                await setDoc(doc(db, 'recycleBin', exp.id), recycleItem);
                                await deleteDoc(doc(db, 'expenses', exp.id));
                            } catch(err) {
                                console.error("Auto-delete sync error:", err);
                            }
                        }
                        return;
                    }
                }

                state.expenses = allExpenses;
                render();
            }, (err) => console.error("Expenses listener error:", err));

            onSnapshot(collection(db, 'recycleBin'), (snapshot) => {
                state.recycleBin = snapshot.docs.map(docSnap => docSnap.data());
                render();
            }, (err) => console.error("Recycle bin listener error:", err));

            onSnapshot(collection(db, 'userRecycleBin'), async (snapshot) => {
                let deletedUsers = snapshot.docs.map(docSnap => docSnap.data());
                const now = new Date();

                for (const item of deletedUsers) {
                    if (item.deletedAt) {
                        const deletedTime = new Date(item.deletedAt).getTime();
                        const hoursDiff = (now.getTime() - deletedTime) / (1000 * 60 * 60);
                        if (hoursDiff >= 48) {
                            try {
                                await deleteDoc(doc(db, 'userRecycleBin', item.userId));
                                await deleteDoc(doc(db, 'users', item.userId));
                                const userExps = state.expenses.filter(e => e.userId === item.userId);
                                for (const ue of userExps) {
                                    await deleteDoc(doc(db, 'expenses', ue.id));
                                }
                            } catch(e) {
                                console.error("Failed 48hr permanent user delete:", e);
                            }
                            return;
                        }
                    }
                }

                state.userRecycleBin = deletedUsers;
                render();
            }, (err) => console.error("User recycle bin listener error:", err));

            onSnapshot(collection(db, 'passwordRequests'), (snapshot) => {
                state.passwordRequests = snapshot.docs.map(docSnap => docSnap.data());
                render();
            }, (err) => console.error("Requests listener error:", err));
        };

        function showToast(message, type = 'success', undoCallback = null) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-600 text-white' : type === 'error' ? 'bg-rose-600 text-white' : 'bg-slate-800 text-white';
            const icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-info';
            
            toast.className = `${bgClass} px-4 py-3 rounded-2xl shadow-xl flex items-center justify-between text-sm font-medium transform transition-all duration-300 translate-y-[-20px] opacity-0 pointer-events-auto gap-3`;
            
            let undoBtnHtml = '';
            if (undoCallback) {
                undoBtnHtml = `<button id="toast-undo-btn" class="px-2.5 py-1 bg-white text-slate-900 rounded-xl font-bold text-xs hover:bg-slate-100 transition shrink-0">Undo</button>`;
            }

            toast.innerHTML = `<div class="flex items-center space-x-2.5 min-w-0 flex-1"><i class="fa-solid ${icon} text-lg shrink-0"></i><span class="flex-1 break-words">${message}</span></div>${undoBtnHtml}`;
            
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-[-20px]', 'opacity-0'), 10);

            if (undoCallback) {
                const undoBtn = document.getElementById('toast-undo-btn');
                if (undoBtn) {
                    undoBtn.onclick = () => {
                        undoCallback();
                        toast.classList.add('translate-y-[-20px]', 'opacity-0');
                        setTimeout(() => toast.remove(), 300);
                    };
                }
            }

            setTimeout(() => {
                toast.classList.add('translate-y-[-20px]', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 6000);
        }

        function formatCurrency(amount) {
            return '₹' + Number(amount).toLocaleString('en-IN');
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            return new Date(dateString).toLocaleDateString('en-IN', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function formatTimestamp(isoString) {
            if (!isoString) return '';
            const d = new Date(isoString);
            return d.toLocaleDateString('en-IN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function formatMonthName(yearMonth) {
            if (!yearMonth || yearMonth === 'All') return 'All Months';
            const [year, month] = yearMonth.split('-');
            return new Date(year, month - 1, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
        }

        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (!input || !icon) return;
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa-solid fa-eye-slash text-sm';
            } else {
                input.type = 'password';
                icon.className = 'fa-solid fa-eye text-sm';
            }
        }

        function updateFormCache() {
            const clientInput = document.getElementById('expense-client');
            const amountInput = document.getElementById('expense-amount');
            const titleInput = document.getElementById('expense-title');
            const dateInput = document.getElementById('expense-date');
            const notesInput = document.getElementById('expense-notes');
            const categoryInput = document.getElementById('expense-category');

            state.tempFormCache = {
                category: categoryInput ? categoryInput.value : 'Office',
                clientNamePlace: clientInput ? clientInput.value : '',
                amount: amountInput ? amountInput.value : '',
                title: titleInput ? titleInput.value : '',
                date: dateInput ? dateInput.value : new Date().toISOString().split('T')[0],
                notes: notesInput ? notesInput.value : ''
            };
        }

        async function toggleAutoDeleteSetting() {
            const newState = !state.appSettings.autoDeleteEnabled;
            const { db, doc, setDoc } = window.FB;
            try {
                await setDoc(doc(db, 'settings', 'app_settings'), { ...state.appSettings, autoDeleteEnabled: newState }, { merge: true });
                showToast(newState ? '2-Month Auto-Delete Enabled' : '2-Month Auto-Delete Disabled', 'success');
            } catch (err) {
                console.error("Failed to update setting:", err);
                showToast('Failed to update setting.', 'error');
            }
        }

        function confirmEmptyRecycleBin() {
            if (state.recycleBin.length === 0) {
                showToast('Recycle bin is already empty.', 'info');
                return;
            }
            showConfirmModal(
                'Empty Recycle Bin',
                'Are you sure you want to permanently delete all items in the Recycle Bin? This cannot be undone.',
                async () => {
                    const { db, doc, deleteDoc, storage, storageRef, deleteObject } = window.FB;
                    for (const item of state.recycleBin) {
                        try {
                            await deleteDoc(doc(db, 'recycleBin', item.id));
                            if (item.billAttachment && item.billAttachment.includes('firebasestorage')) {
                                await deleteObject(storageRef(storage, `bills/${item.id}.jpg`));
                            }
                        } catch(e) {}
                    }
                    showToast('Recycle Bin emptied successfully!', 'success');
                }
            );
        }

        function openUserWalletModal() {
            const user = state.currentUser;
            const userWallet = Number(user.wallet || 0);
            const userExcessSpent = Number(user.excessSpent || 0);
            const userTxns = state.walletTransactions
                .filter(t => t.userId === user.id)
                .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

            const root = document.getElementById('modal-root');
            root.innerHTML = `
                <div class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn">
                    <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 max-w-sm w-full border border-slate-200 dark:border-slate-800 shadow-2xl space-y-4 max-h-[90vh] flex flex-col">
                        <div class="flex items-center justify-between shrink-0">
                            <h3 class="font-bold text-base text-slate-900 dark:text-white flex items-center space-x-2">
                                <i class="fa-solid fa-wallet text-emerald-500"></i><span>Wallet & History</span>
                            </h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        
                        <div class="bg-slate-50 dark:bg-slate-800/50 p-4 rounded-2xl border border-slate-100 dark:border-slate-800 space-y-2 shrink-0">
                            <div>
                                <span class="text-[10px] text-slate-400 uppercase font-semibold block">Wallet Balance</span>
                                <span class="font-bold text-xl text-emerald-600 dark:text-emerald-400">${formatCurrency(userWallet)}</span>
                            </div>
                            ${userExcessSpent > 0 ? `
                            <div class="pt-2 border-t border-slate-200 dark:border-slate-700">
                                <span class="text-[10px] text-rose-500 uppercase font-semibold block">Excess Spent Due</span>
                                <span class="font-bold text-base text-rose-600 dark:text-rose-400">${formatCurrency(userExcessSpent)}</span>
                                <p class="text-[10px] text-slate-400 mt-1">Pending top-up settlement.</p>
                            </div>
                            ` : ''}
                        </div>

                        <div class="space-y-2 flex-1 overflow-y-auto pr-1">
                            <h4 class="text-xs font-semibold text-slate-500 uppercase tracking-wider px-1">Added Wallet & Excess/Shortage History</h4>
                            ${userTxns.length === 0 ? `
                                <div class="text-center py-6 text-xs text-slate-400">No transaction history yet.</div>
                            ` : userTxns.map(t => `
                                <div class="bg-slate-50 dark:bg-slate-800/40 p-3 rounded-2xl border border-slate-100 dark:border-slate-800/80 space-y-1">
                                    <div class="flex items-center justify-between text-xs">
                                        <span class="font-semibold text-slate-800 dark:text-slate-200">${escapeHtml(t.title)}</span>
                                        <span class="font-bold text-emerald-600 dark:text-emerald-400">+${formatCurrency(t.amount)}</span>
                                    </div>
                                    <div class="flex items-center justify-between text-[10px] text-slate-400">
                                        <span>${formatTimestamp(t.timestamp)}</span>
                                        <span class="italic">By ${escapeHtml(t.performedBy)}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <button onclick="closeModal()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-2xl shadow-md transition text-xs shrink-0">Close</button>
                    </div>
                </div>
            `;
        }

        function openAddWalletModal(userId, userName) {
            const userTxns = state.walletTransactions
                .filter(t => t.userId === userId)
                .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

            const root = document.getElementById('modal-root');
            root.innerHTML = `
                <div class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn">

        async function handleWalletAdd(e, userId) {
            e.preventDefault();
            const amountToAdd = parseFloat(document.getElementById('wallet-add-amount').value);
            if (isNaN(amountToAdd) || amountToAdd === 0) {
                showToast('Please enter a valid amount.', 'error');
                return;
            }

            const user = state.users.find(u => u.id === userId);
            if (!user) return;

            let currentWallet = Number(user.wallet || 0);
            let currentExcess = Number(user.excessSpent || 0);
            let remainingFunds = amountToAdd;
            let excessCleared = 0;

            if (amountToAdd > 0) {
                if (currentExcess > 0) {
                    if (remainingFunds >= currentExcess) {
                        excessCleared = currentExcess;
                        remainingFunds -= currentExcess;
                        currentExcess = 0;
                    } else {
                        excessCleared = remainingFunds;
                        currentExcess -= remainingFunds;
                        remainingFunds = 0;
                    }
                }
                currentWallet += remainingFunds;
            } else {
                currentWallet += amountToAdd;
                if (currentWallet < 0) {
                    currentExcess += Math.abs(currentWallet);
                    currentWallet = 0;
                }
            }

            const { db, doc, updateDoc, setDoc } = window.FB;
            await updateDoc(doc(db, 'users', userId), { 
                wallet: currentWallet,
                excessSpent: currentExcess 
            });

            const txnId = 'txn_' + Date.now();
            let txnTitle = amountToAdd >= 0 ? `Added Wallet Funds` : `Shortage Money Adjustment`;
            if (amountToAdd >= 0 && excessCleared > 0 && remainingFunds > 0) {
                txnTitle = `Cleared Excess (₹${excessCleared}) & Added Wallet (₹${remainingFunds})`;
            } else if (amountToAdd >= 0 && excessCleared > 0) {
                txnTitle = `Cleared Excess Spent Due`;
            }

            const txnData = {
                id: txnId,
                userId: userId,
                title: txnTitle,
                amount: Math.abs(amountToAdd),
                timestamp: new Date().toISOString(),
                performedBy: state.currentUser.name
            };
            await setDoc(doc(db, 'walletTransactions', txnId), txnData);

            closeModal();
            showToast(`Successfully processed ${formatCurrency(amountToAdd)} for ${user.name}!`, 'success');
        }

        function confirmClearUserHistory(userId, userName) {
            showConfirmModal(
                'Clear Transaction History',
                `Are you sure you want to clear all wallet history records for ${userName}?`,
                async () => {
                    const { db, doc, deleteDoc } = window.FB;
                    const userTxns = state.walletTransactions.filter(t => t.userId === userId);
                    for (const t of userTxns) {
                        try {
                            await deleteDoc(doc(db, 'walletTransactions', t.id));
                        } catch(err) {
                            console.error("Failed to delete txn:", err);
                        }
                    }
                    closeModal();
                    showToast(`Successfully cleared wallet history for ${userName}!`, 'success');
                }
            );
        }

        function confirmClearUserExpenses(userId, userName) {
            showConfirmModal(
                'Clear Expenses',
                `Are you sure you want to delete all expense records for ${userName}?`,
                async () => {
                    const { db, doc, deleteDoc, setDoc } = window.FB;
                    const userExpenses = state.expenses.filter(e => e.userId === userId);
                    
                    if (userExpenses.length === 0) {
                        showToast('No expenses found for this user.', 'info');
                        return;
                    }

                    state.lastClearedExpensesCache = { userId, expenses: userExpenses };

                    for (const exp of userExpenses) {
                        try {
                            await deleteDoc(doc(db, 'expenses', exp.id));
                        } catch(err) {
                            console.error("Failed to delete user expense:", err);
                        }
                    }

                    showToast(`Cleared expenses for ${userName}.`, 'success', async () => {
                        if (state.lastClearedExpensesCache && state.lastClearedExpensesCache.userId === userId) {
                            for (const exp of state.lastClearedExpensesCache.expenses) {
                                await setDoc(doc(db, 'expenses', exp.id), exp);
                            }
                            state.lastClearedExpensesCache = null;
                            showToast(`Restored all expenses for ${userName}!`, 'success');
                        }
                    });
                }
            );
        }

        async function requestAdminAuthCode() {
            const usernameInput = document.getElementById('forgot-username');
            const username = usernameInput ? usernameInput.value.trim().toLowerCase() : '';
            if (!username) {
                showToast('Please enter your username first.', 'error');
                return;
            }

            const user = state.users.find(u => u.username.toLowerCase() === username);
            if (!user) {
                showToast('Username not found in system.', 'error');
                return;
            }

            let existingReq = state.passwordRequests.find(r => r.username.toLowerCase() === username && r.status === 'pending');
            let code = existingReq ? existingReq.code : Math.floor(100000 + Math.random() * 900000).toString();
            const reqId = existingReq ? existingReq.id : 'req_' + Date.now();

            const reqObj = {
                id: reqId,
                username: user.username,
                name: user.name,
                code: code,
                status: 'pending',
                createdAt: existingReq ? existingReq.createdAt : new Date().toISOString()
            };

            const { db, doc, setDoc } = window.FB;
            await setDoc(doc(db, 'passwordRequests', reqId), reqObj);
            showToast('Code requested successfully! Contact Admin for your 6-digit code.', 'success');
        }

        async function handleForgotPasswordSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('forgot-username').value.trim().toLowerCase();
            const authCode = document.getElementById('forgot-auth-code').value.trim();
            const newPassword = document.getElementById('forgot-new-password').value;

            const user = state.users.find(u => u.username.toLowerCase() === username);
            if (!user) {
                showToast('Username not found.', 'error');
                return;
            }

            const req = state.passwordRequests.find(r => r.username.toLowerCase() === username && r.status === 'pending');
            if (!req || req.code !== authCode) {
                showToast('Invalid or unapproved code.', 'error');
                return;
            }

            if (!newPassword || newPassword.length < 4) {
                showToast('Password must be at least 4 characters.', 'error');
                return;
            }

            const { db, doc, updateDoc } = window.FB;
            user.password = newPassword;
            await updateDoc(doc(db, 'users', user.id), { password: newPassword });
            await updateDoc(doc(db, 'passwordRequests', req.id), { status: 'approved' });

            showToast('Password reset successfully! Please sign in.', 'success');
            setAuthView('login');
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim().toLowerCase();
            const password = document.getElementById('login-password').value;

            const foundUser = state.users.find(u => u.username.toLowerCase() === username && u.password === password);
            if (foundUser) {
                state.currentUser = foundUser;
                state.activeTab = 'home';
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(foundUser));
                showToast(`Welcome back, ${foundUser.name}!`, 'success');
                render();
            } else {
                showToast('Invalid username or password.', 'error');
            }
        }

            showConfirmModal(

                <div class="space-y-4 w-full max-w-full pb-8 pt-2">

        function handleBillUpload(event) {
            updateFormCache();
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(uploadEvent) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const maxDim = 800;

                    if (width > height && width > maxDim) {
                        height = Math.round((height * maxDim) / width);
                        width = maxDim;
                    } else if (height > maxDim) {
                        width = Math.round((width * maxDim) / height);
                        height = maxDim;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    state.tempBillData = canvas.toDataURL('image/jpeg', 0.8);
                    showToast('Bill attached successfully!', 'success');
                    render();
                };
                img.src = uploadEvent.target.result;
            };
            reader.readAsDataURL(file);
        }

        function takeSnapshot() {
            const videoElement = document.getElementById('camera-stream');
            const canvasElement = document.getElementById('camera-canvas');
            if (!videoElement) return;

            let width = videoElement.videoWidth || 640;
            let height = videoElement.videoHeight || 480;
            const maxDim = 800;

            if (width > height && width > maxDim) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
            } else if (height > maxDim) {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
            }

            canvasElement.width = width;
            canvasElement.height = height;
            canvasElement.getContext('2d').drawImage(videoElement, 0, 0, width, height);

            state.tempBillData = canvasElement.toDataURL('image/jpeg', 0.8);
            if (window.activeCameraStream) {
                window.activeCameraStream.getTracks().forEach(track => track.stop());
                window.activeCameraStream = null;
            }
            closeModal();
            showToast('Bill captured!', 'success');
            render();
        }

        async function handleExpenseSubmit(event) {
            event.preventDefault();
            const category = document.getElementById('expense-category').value;
            const amount = parseFloat(document.getElementById('expense-amount').value);
            const title = document.getElementById('expense-title').value.trim();
            const date = document.getElementById('expense-date').value;
            const clientNamePlace = category === 'Shoot' ? document.getElementById('expense-client').value.trim() : '';
            const notes = document.getElementById('expense-notes').value.trim();

            if (!title || isNaN(amount) || amount <= 0 || !date) {
                showToast('Please fill in all required fields.', 'error');
                return;
            }

            showToast('Processing expense & wallet balance...', 'info');
            const { db, storage, doc, setDoc, updateDoc, storageRef, uploadString, getDownloadURL } = window.FB;

            let expenseId = state.editingExpenseId || ('exp_' + Date.now());
            let billUrl = null;

            try {
                if (state.tempBillData !== null) {
                    if (state.tempBillData.startsWith('data:image')) {
                        try {
                            const fileRef = storageRef(storage, `bills/${expenseId}.jpg`);
                            await uploadString(fileRef, state.tempBillData, 'data_url');
                            billUrl = await getDownloadURL(fileRef);
                        } catch (storageErr) {
                            console.warn("Storage upload restricted or failed, falling back to direct base64 storage:", storageErr);
                            billUrl = state.tempBillData;
                        }
                    } else {
                        billUrl = state.tempBillData;
                    }
                } else if (state.editingExpenseId) {
                    const existing = state.expenses.find(e => e.id === expenseId);
                    billUrl = existing ? existing.billAttachment : null;
                }

                const currentUser = state.currentUser;
                let currentWallet = Number(currentUser.wallet || 0);
                let currentExcess = Number(currentUser.excessSpent || 0);

                if (!state.editingExpenseId) {
                    if (currentWallet >= amount) {
                        currentWallet -= amount;
                    } else {
                        const excess = amount - currentWallet;
                        currentWallet = 0;
                        currentExcess += excess;
                    }
                } else {
                    const oldExp = state.expenses.find(e => e.id === expenseId);
                    const oldAmount = oldExp ? Number(oldExp.amount) : 0;
                    const diff = amount - oldAmount;
                    if (diff > 0) {
                        if (currentWallet >= diff) {
                            currentWallet -= diff;
                        } else {
                            const excess = diff - currentWallet;
                            currentWallet = 0;
                            currentExcess += excess;
                        }
                    } else if (diff < 0) {
                        currentWallet += Math.abs(diff);
                    }
                }

                await updateDoc(doc(db, 'users', currentUser.id), {
                    wallet: currentWallet,
                    excessSpent: currentExcess
                });

                state.currentUser.wallet = currentWallet;
                state.currentUser.excessSpent = currentExcess;
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(state.currentUser));

                const expenseData = {
                    id: expenseId,
                    userId: currentUser.id,
                    userName: currentUser.name,
                    title,
                    amount,
                    category,
                    date,
                    clientNamePlace,
                    notes,
                    billAttachment: billUrl,
                    createdAt: state.editingExpenseId ? (state.expenses.find(e => e.id === expenseId)?.createdAt || new Date().toISOString()) : new Date().toISOString()
                };

                await setDoc(doc(db, 'expenses', expenseId), expenseData);

                state.editingExpenseId = null;
                state.tempBillData = null;
                state.tempFormCache = null;
                showToast('Expense saved & wallet updated!', 'success');
                switchTab('home');
            } catch (error) {
                console.error("Failed:", error);
                showToast('Failed to save. Please check connection.', 'error');
            }
        }

        async function undoDeleteUser(userId) {
            const { db, doc, deleteDoc, setDoc } = window.FB;
            const item = state.userRecycleBin.find(i => i.userId === userId);
            if (item) {
                const { deletedAt, userId: uid, name, username, password, role, email, wallet, excessSpent, expenses } = item;
                await setDoc(doc(db, 'users', uid), { id: uid, name, username, password, role, email, wallet: Number(wallet || 0), excessSpent: Number(excessSpent || 0) });
                if (expenses && expenses.length > 0) {
                    for (const exp of expenses) {
                        await setDoc(doc(db, 'expenses', exp.id), exp);
                    }
                }
                await deleteDoc(doc(db, 'userRecycleBin', userId));
                showToast(`User ${name} restored successfully!`, 'success');
            }
        }

        async function handleEditUser(e, userId) {
            e.preventDefault();
            const name = document.getElementById('edit-user-name').value.trim();
            const role = document.getElementById('edit-user-role').value;

            const user = state.users.find(u => u.id === userId);
            if (!user) return;

            const { db, doc, updateDoc } = window.FB;
            user.name = name;
            user.role = role;

            await updateDoc(doc(db, 'users', userId), { name, role });

            if (state.currentUser.id === userId) {
                state.currentUser.name = name;
                state.currentUser.role = role;
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(state.currentUser));
            }

            closeModal();
            showToast('User updated successfully!', 'success');
        }

        async function handleAddNewUser(e) {
            e.preventDefault();
            const name = document.getElementById('new-user-name').value.trim();
            const username = document.getElementById('new-user-username').value.trim().toLowerCase();
            const password = document.getElementById('new-user-password').value;
            const role = document.getElementById('new-user-role').value;

            if (state.users.some(u => u.username.toLowerCase() === username)) {
                showToast('Username already exists.', 'error');
                return;
            }

            const userId = 'usr_' + Date.now();
            const newUser = { id: userId, name, username, password, role, email: `${username}@clickfactory.com`, wallet: 0, excessSpent: 0 };

            const { db, doc, setDoc } = window.FB;
            await setDoc(doc(db, 'users', userId), newUser);

            closeModal();
            showToast(`User ${name} added successfully!`, 'success');
        }

        function confirmRemoveUser(userId, userName) {
            showConfirmModal(
                'Remove User',
                `Move user "${userName}" and their expenses to Deleted Users Bin? They will be permanently wiped after 48 hours unless restored.`,
                async () => {
                    const { db, doc, deleteDoc, setDoc } = window.FB;
                    const userToRemove = state.users.find(u => u.id === userId);
                    if (userToRemove) {
                        const userExps = state.expenses.filter(e => e.userId === userId);
                        const userRecycleItem = {
                            userId: userToRemove.id,
                            name: userToRemove.name,
                            username: userToRemove.username,
                            password: userToRemove.password,
                            role: userToRemove.role,
                            email: userToRemove.email,
                            wallet: userToRemove.wallet || 0,
                            excessSpent: userToRemove.excessSpent || 0,
                            expenses: userExps,
                            deletedAt: new Date().toISOString()
                        };

                        await setDoc(doc(db, 'userRecycleBin', userId), userRecycleItem);
                        await deleteDoc(doc(db, 'users', userId));
                        for (const ue of userExps) {
                            await deleteDoc(doc(db, 'expenses', ue.id));
                        }
                        showToast(`User ${userName} moved to Deleted Users Bin.`, 'success');
                    }
                }
            );
        }

        function renderUserAnalyticsTab() {
            const userExpenses = state.expenses.filter(e => e.userId === state.currentUser.id);
            const total = userExpenses.reduce((s, e) => s + e.amount, 0);
            const office = userExpenses.filter(e => e.category === 'Office').reduce((s, e) => s + e.amount, 0);
            const shoot = userExpenses.filter(e => e.category === 'Shoot').reduce((s, e) => s + e.amount, 0);

            const monthlyMap = {};
            userExpenses.forEach(exp => {
                const monthKey = exp.date ? exp.date.substring(0, 7) : 'Unknown';
                if (!monthlyMap[monthKey]) monthlyMap[monthKey] = { office: 0, shoot: 0, total: 0 };
                if (exp.category === 'Office') monthlyMap[monthKey].office += exp.amount;
                if (exp.category === 'Shoot') monthlyMap[monthKey].shoot += exp.amount;
                monthlyMap[monthKey].total += exp.amount;
            });
            const months = Object.keys(monthlyMap).sort().reverse();

            return `
                <div class="space-y-4 w-full max-w-full">
                    <div class="bg-gradient-to-br from-violet-600 to-indigo-700 rounded-3xl p-5 sm:p-6 text-white shadow-xl w-full">
                        <p class="text-violet-200 text-xs font-semibold uppercase tracking-wider">My Expense Summary</p>
                        <h2 class="text-2xl sm:text-3xl font-bold tracking-tight mt-0.5 break-all">${formatCurrency(total)}</h2>
                        <div class="grid grid-cols-2 gap-3 mt-4 pt-4 border-t border-white/15">
                            <div class="min-w-0"><span class="text-xs text-violet-200 truncate block">Office Expense</span><p class="font-bold text-sm sm:text-base break-all">${formatCurrency(office)}</p></div>
                            <div class="min-w-0"><span class="text-xs text-violet-200 truncate block">Shoot Expense</span><p class="font-bold text-sm sm:text-base break-all">${formatCurrency(shoot)}</p></div>
                        </div>
                    </div>

                    <div class="space-y-3 w-full">
                        <div class="flex items-center justify-between px-1 pt-3">
                            <h3 class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Monthly Breakdown</h3>
                            <button onclick="exportUserCSV('${state.currentUser.id}', '${state.currentUser.name}')" class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline flex items-center space-x-1 shrink-0"><i class="fa-solid fa-download"></i><span>Export CSV</span></button>
                        </div>
                        ${months.map(m => `
                            <div class="bg-white dark:bg-slate-900 rounded-2xl p-4.5 sm:p-5 border border-slate-200 dark:border-slate-800 shadow-sm space-y-2 w-full mt-3">
                                <div class="flex items-center justify-between">
                                    <span class="font-bold text-sm text-slate-900 dark:text-white truncate pr-2">${formatMonthName(m)}</span>
                                    <span class="font-bold text-sm text-indigo-600 dark:text-indigo-400 shrink-0">${formatCurrency(monthlyMap[m].total)}</span>
                                </div>
                                <div class="flex justify-between text-xs text-slate-500 dark:text-slate-400 pt-2 border-t border-slate-100 dark:border-slate-800">
                                    <span class="truncate pr-1">Office: ${formatCurrency(monthlyMap[m].office)}</span>
                                    <span class="truncate pl-1 text-right">Shoot: ${formatCurrency(monthlyMap[m].shoot)}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderProfileTab() {
            const isAdmin = state.currentUser.role === 'admin';
            const pendingRequestsCount = state.passwordRequests.filter(r => r.status === 'pending').length;
            const autoDeleteOn = state.appSettings && state.appSettings.autoDeleteEnabled;

            return `
                <div class="space-y-4 w-full max-w-full">
                    <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-7 border border-slate-200 dark:border-slate-800 shadow-sm text-center w-full">
                        <div class="w-16 h-16 bg-white dark:bg-slate-800 rounded-2xl p-2 flex items-center justify-center mx-auto mb-3 shadow-md border border-slate-200 dark:border-slate-700 overflow-hidden logo-container">
                            <img src="https://clickfactoryphotography.com/wp-content/uploads/2022/04/crop-logo.gif" alt="Click Factory Logo" class="w-full h-full object-contain" onerror="this.src='https://placehold.co/64x64/4f46e5/ffffff?text=CF'">
                        </div>
                        <h2 class="font-bold text-lg text-slate-900 dark:text-white truncate">${state.currentUser.name}</h2>
                        <p class="text-xs text-slate-500 dark:text-slate-400 mb-2 truncate">@${state.currentUser.username}</p>
                        <span class="inline-block px-3.5 py-1 rounded-full text-xs font-semibold ${isAdmin ? 'bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 border border-indigo-200' : 'bg-emerald-50 text-emerald-600 border border-emerald-200'}">
                            ${isAdmin ? 'Administrator' : 'Regular User'}
                        </span>
                    </div>

                    ${isAdmin ? `
                    <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 sm:p-6 border border-slate-200 dark:border-slate-800 shadow-sm space-y-4 w-full mt-3">
                        <h3 class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider px-1">Admin Management</h3>
                        
                        <div class="flex items-center justify-between py-2 px-1">
                            <div>
                                <h4 class="font-semibold text-xs text-slate-900 dark:text-white flex items-center space-x-2">
                                    <i class="fa-solid fa-clock-rotate-left text-indigo-500"></i>
                                    <span>2-Month Auto-Delete</span>
                                </h4>
                                <p class="text-[10px] text-slate-500 dark:text-slate-400 mt-0.5">Auto-delete expenses older than 2 months.</p>
                            </div>
                            <button onclick="toggleAutoDeleteSetting()" class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none ${autoDeleteOn ? 'bg-indigo-600' : 'bg-slate-300 dark:bg-slate-700'}">
                                <span class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow-lg ring-0 transition duration-200 ease-in-out ${autoDeleteOn ? 'translate-x-5' : 'translate-x-0'}"></span>
                            </button>
                        </div>

                        <div class="pt-3 border-t border-slate-100 dark:border-slate-800 space-y-1">
                            <h4 class="font-semibold text-xs text-slate-900 dark:text-white flex items-center space-x-2">
                                <i class="fa-solid fa-circle-info text-indigo-500"></i>
                                <span>System Version</span>
                            </h4>
                            <p class="text-[10px] text-slate-500 dark:text-slate-400">Running v${CURRENT_CLIENT_APP_VERSION} (Auto-syncs with cloud)</p>
                        </div>

                        <div class="space-y-2.5 pt-1 border-t border-slate-100 dark:border-slate-800">
                            <button onclick="switchTab('recycle')" class="w-full py-3 px-4 rounded-2xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-300 text-xs font-semibold transition flex items-center justify-between">
                                <span class="flex items-center space-x-2"><i class="fa-solid fa-trash-can text-amber-500"></i><span>Recycle Bin</span></span>
                                ${state.recycleBin.length > 0 ? `<span class="px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-600 text-[10px] font-bold">${state.recycleBin.length}</span>` : '<i class="fa-solid fa-chevron-right text-[10px] text-slate-400"></i>'}
                            </button>
                            <button onclick="switchTab('userRecycle')" class="w-full py-3 px-4 rounded-2xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-300 text-xs font-semibold transition flex items-center justify-between">
                                <span class="flex items-center space-x-2"><i class="fa-solid fa-user-slash text-rose-500"></i><span>Deleted Users Bin</span></span>
                                ${state.userRecycleBin.length > 0 ? `<span class="px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-600 text-[10px] font-bold">${state.userRecycleBin.length}</span>` : '<i class="fa-solid fa-chevron-right text-[10px] text-slate-400"></i>'}
                            </button>
                            <button onclick="switchTab('requests')" class="w-full py-3 px-4 rounded-2xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-300 text-xs font-semibold transition flex items-center justify-between">
                                <span class="flex items-center space-x-2"><i class="fa-solid fa-key text-amber-500"></i><span>Password Requests</span></span>
                                ${pendingRequestsCount > 0 ? `<span class="px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-600 text-[10px] font-bold">${pendingRequestsCount} Pending</span>` : '<i class="fa-solid fa-chevron-right text-[10px] text-slate-400"></i>'}
                            </button>
                            <button onclick="openChangePasswordModal()" class="w-full py-3 px-4 rounded-2xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-300 text-xs font-semibold transition flex items-center justify-between">
                                <span class="flex items-center space-x-2"><i class="fa-solid fa-shield-halved text-indigo-500"></i><span>Change Admin Password</span></span>
                                <i class="fa-solid fa-chevron-right text-[10px] text-slate-400"></i>
                            </button>
                        </div>
                    </div>
                    ` : ''}

                    <div class="text-center py-2 w-full space-y-1">
                        <p class="text-[11px] font-medium text-slate-400 dark:text-slate-500">Click Factory Expense Tracker</p>
                        <p class="text-[11px] font-medium text-slate-400 dark:text-slate-500">Software Developer & Owner: <span class="font-bold text-indigo-600">SATISH KUMAR</span></p>
                    </div>
                </div>
            `;
        }

        function openChangePasswordModal() {
            const root = document.getElementById('modal-root');
            root.innerHTML = `
                <div class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 max-w-sm w-full border border-slate-200 dark:border-slate-800 shadow-2xl space-y-4">
                        <div class="flex items-center justify-between">
                            <h3 class="font-bold text-base text-slate-900 dark:text-white">Change Admin Password</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <form onsubmit="handlePasswordChange(event)" class="space-y-3.5 w-full">
                            <div class="w-full">
                                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Current Password</label>
                                <div class="relative w-full">
                                    <input type="password" id="current-pass" required class="w-full px-4 pr-12 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm text-slate-900 dark:text-white">
                                    <button type="button" onclick="togglePasswordVisibility('current-pass', 'toggle-curr-pass-icon')" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 focus:outline-none">
                                        <i id="toggle-curr-pass-icon" class="fa-solid fa-eye text-sm"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="w-full">
                                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">New Password</label>
                                <div class="relative w-full">
                                    <input type="password" id="new-pass" required class="w-full px-4 pr-12 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm text-slate-900 dark:text-white">
                                    <button type="button" onclick="togglePasswordVisibility('new-pass', 'toggle-new-pass-icon')" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 focus:outline-none">
                                        <i id="toggle-new-pass-icon" class="fa-solid fa-eye text-sm"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="pt-2 w-full"><button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-2xl shadow-md transition text-sm">Update Password</button></div>
                        </form>
                    </div>
                </div>
            `;
        }

        async function handlePasswordChange(e) {
            e.preventDefault();
            const current = document.getElementById('current-pass').value;
            const newPass = document.getElementById('new-pass').value;

            const adminUser = state.users.find(u => u.role === 'admin');
            if (!adminUser || current !== adminUser.password) {
                showToast('Current password incorrect.', 'error');
                return;
            }

            if (!newPass || newPass.length < 4) {
                showToast('Password must be at least 4 characters.', 'error');
                return;
            }

            const { db, doc, updateDoc } = window.FB;
            adminUser.password = newPass;
            await updateDoc(doc(db, 'users', adminUser.id), { password: newPass });
            closeModal();
            showToast('Admin password updated successfully!', 'success');
        }

        function exportUserCSV(userId, userName) {
            downloadCSV(state.expenses.filter(e => e.userId === userId), `${userName.replace(/\s+/g, '_')}_expenses.csv`);
        }

        function exportFilteredCSV() {
            let filtered = state.expenses.filter(exp => {
                if (state.filterUser !== 'All' && exp.userId !== state.filterUser) return false;
                if (state.filterCategory !== 'All' && exp.category !== state.filterCategory) return false;
                if (state.filterMonth !== 'All' && !exp.date.startsWith(state.filterMonth)) return false;
                if (state.filterStartDate && exp.date < state.filterStartDate) return false;
                if (state.filterEndDate && exp.date > state.filterEndDate) return false;
                return true;
            });
            downloadCSV(filtered, 'filtered_expenses_report.csv');
        }

        function exportAllCSV() {
            downloadCSV(state.expenses, 'all_company_expenses.csv');
        }

        function downloadCSV(dataArray, filename) {
            if (dataArray.length === 0) {
                showToast('No records available to export.', 'error');
                return;
            }
            const headers = ['ID', 'User', 'Title', 'Category', 'Client & Place', 'Amount (INR)', 'Date', 'Notes', 'Has Bill'];
            const rows = dataArray.map(e => [
                e.id, `"${e.userName || ''}"`, `"${(e.title || '').replace(/"/g, '""')}"`, e.category,
                `"${(e.clientNamePlace || '').replace(/"/g, '""')}"`, e.amount, e.date, `"${(e.notes || '').replace(/"/g, '""')}"`, e.billAttachment ? 'Yes' : 'No'
            ]);
            const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
            const link = document.createElement('a');
            link.setAttribute('href', encodeURI(csvContent));
            link.setAttribute('download', filename);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast(`Exported ${dataArray.length} records!`, 'success');
        }

        function showConfirmModal(title, message, onConfirm) {
            const root = document.getElementById('modal-root');
            root.innerHTML = `
                <div class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 max-w-sm w-full border border-slate-200 dark:border-slate-800 shadow-sm shadow-2xl space-y-4">
                        <div class="w-12 h-12 rounded-2xl bg-rose-500/10 text-rose-600 flex items-center justify-center text-xl mx-auto"><i class="fa-solid fa-triangle-exclamation"></i></div>
                        <div class="text-center"><h3 class="font-bold text-base text-slate-900 dark:text-white mb-1">${escapeHtml(title)}</h3><p class="text-xs text-slate-500 dark:text-slate-400">${escapeHtml(message)}</p></div>
                        <div class="grid grid-cols-2 gap-3 pt-2">
                            <button onclick="closeModal()" class="py-3 px-4 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs font-semibold">Cancel</button>
                            <button id="modal-confirm-btn" class="py-3 px-4 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold shadow-md">Confirm</button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('modal-confirm-btn').onclick = () => { closeModal(); onConfirm(); };
        }

        function closeModal() {
            if (window.activeCameraStream) {
                window.activeCameraStream.getTracks().forEach(track => track.stop());
                window.activeCameraStream = null;
            }
            const root = document.getElementById('modal-root');
            if (root) root.innerHTML = '';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
