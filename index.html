    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },

                        brand: {
                            50: '#eef2ff',

                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca'
                        }

        // Immediately sync theme class before paint to avoid flash
        (function () {
            let savedTheme = 'system';
            try { savedTheme = localStorage.getItem('click_factory_theme_v1') || 'system'; } catch (e) { }
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = savedTheme === 'dark' || (savedTheme === 'system' && prefersDark);
            if (isDark) {
                document.documentElement.classList.add('dark');
                document.getElementById('meta-theme-color')?.setAttribute('content', '#020617');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('meta-theme-color')?.setAttribute('content', '#f8fafc');

    <style>
        *,

            }

        /* Mobile / touch hidden scrollbars */

<body
    class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 flex flex-col items-stretch h-full selection:bg-indigo-500 selection:text-white">

    <div id="modal-root" class="relative z-[60]"></div>

    <script>
        const LOCAL_STORAGE_KEY = 'click_factory_current_user_v23';
        const SESSION_COOKIE_KEY = 'cf_session_v23';
        const SESSION_IDB_NAME = 'click_factory_auth_db_v1';
        const SESSION_IDB_STORE = 'session';
        const THEME_STORAGE_KEY = 'click_factory_theme_v1';
        const SOUND_STORAGE_KEY = 'click_factory_sound_v1';
        const SOUND_VOL_STORAGE_KEY = 'click_factory_sound_vol_v1';
        const DOCK_ALPHA_STORAGE_KEY = 'click_factory_dock_alpha_v1';
        const FALLBACK_DB_KEY = 'click_factory_local_fallback_db_v1';
        const CURRENT_CLIENT_APP_VERSION = '1.1.3';

        function lsGet(key, fallback = null) {
            try { const v = localStorage.getItem(key); return v === null ? fallback : v; } catch (e) { return fallback; }
        }
        function lsSet(key, value) { try { localStorage.setItem(key, value); } catch (e) { } }
        function lsRemove(key) { try { localStorage.removeItem(key); } catch (e) { } }

        function setSessionCookie(value) {
            try {
                const maxAge = 60 * 60 * 24 * 365 * 5;
                document.cookie = `${SESSION_COOKIE_KEY}=${encodeURIComponent(value)}; path=/; max-age=${maxAge}; SameSite=Lax`;
            } catch (e) { }
        }

        function getSessionCookie() {
            try {
                const prefix = `${SESSION_COOKIE_KEY}=`;
                const parts = document.cookie.split(';');
                for (let part of parts) {
                    part = part.trim();
                    if (part.startsWith(prefix)) {
                        return decodeURIComponent(part.substring(prefix.length));
                    }
                }
            } catch (e) { }
            return null;
        }

        function clearSessionCookie() {
            try {
                document.cookie = `${SESSION_COOKIE_KEY}=; path=/; max-age=0; SameSite=Lax`;
            } catch (e) { }
        }

        function openSessionIdb() {
            return new Promise((resolve, reject) => {
                if (!window.indexedDB) {
                    reject(new Error('IndexedDB unavailable'));
                    return;
                }
                const req = window.indexedDB.open(SESSION_IDB_NAME, 1);
                req.onupgradeneeded = () => {
                    const db = req.result;
                    if (!db.objectStoreNames.contains(SESSION_IDB_STORE)) {
                        db.createObjectStore(SESSION_IDB_STORE);
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function saveSessionToIdb(userObj) {
            try {
                const db = await openSessionIdb();
                await new Promise((resolve, reject) => {
                    const tx = db.transaction(SESSION_IDB_STORE, 'readwrite');
                    tx.objectStore(SESSION_IDB_STORE).put(userObj, 'activeUser');
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
                db.close();
            } catch (e) { }
        }

        async function readSessionFromIdb() {
            try {
                const db = await openSessionIdb();
                const val = await new Promise((resolve, reject) => {
                    const tx = db.transaction(SESSION_IDB_STORE, 'readonly');
                    const req = tx.objectStore(SESSION_IDB_STORE).get('activeUser');
                    req.onsuccess = () => resolve(req.result || null);
                    req.onerror = () => reject(req.error);
                });
                db.close();
                return val;
            } catch (e) {
                return null;
            }
        }

        async function clearSessionFromIdb() {
            try {
                const db = await openSessionIdb();
                await new Promise((resolve, reject) => {
                    const tx = db.transaction(SESSION_IDB_STORE, 'readwrite');
                    tx.objectStore(SESSION_IDB_STORE).delete('activeUser');
                    tx.oncomplete = () => resolve();

        // ---------- LOCAL FALLBACK & CLOUD SYNC ADAPTER ----------
        function createLocalFallbackAdapter() {
            const defaultUsers = DEFAULT_SEED_USERS.map(u => ({ ...u }));

            let store = {
                users: [...defaultUsers],
                expenses: [],
                walletTransactions: [],
                notifications: [],
                recycleBin: [],
                userRecycleBin: [],
                passwordRequests: [],
                settings: [{
                    id: 'app_settings',
                    autoDeleteEnabled: false,
                    currentVersion: CURRENT_CLIENT_APP_VERSION,
                    googleDrive: { clientId: '', folderId: '', accessToken: '', connectedEmail: '' }
                }]
            };

            try {
                const raw = lsGet(FALLBACK_DB_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    store = { ...store, ...parsed };
                    if (!Array.isArray(store.users)) store.users = [];
                    defaultUsers.forEach(du => {
                        if (!store.users.some(u => (u.username || '').toLowerCase() === du.username)) {
                            store.users.push({ ...du });
                        }
                    });
                }
            } catch (e) { }

            const listeners = {};
            function saveStore() {
                try { lsSet(FALLBACK_DB_KEY, JSON.stringify(store)); } catch (e) { }
            }
            function emit(colName) {
                const list = listeners[colName] || [];
                const docs = (store[colName] || []).map(item => ({ id: item.id || item.userId, data: () => ({ ...item }) }));
                const snap = { docs, empty: docs.length === 0, metadata: { fromCache: false } };
                list.forEach(cb => { try { cb(snap); } catch (e) { } });
            }

            return {
                isLocalFallback: true,
                db: { _local: true },
                storage: null,
                collection: (db, name) => name,
                doc: (db, colName, id) => ({ colName, id }),
                getDocs: async (colName) => {
                    const docs = (store[colName] || []).map(item => ({ id: item.id || item.userId, data: () => ({ ...item }) }));
                    return { docs, empty: docs.length === 0 };
                },
                setDoc: async (ref, data, opts = {}) => {
                    const arr = store[ref.colName] || (store[ref.colName] = []);
                    const key = ref.colName === 'userRecycleBin' ? 'userId' : 'id';
                    const idx = arr.findIndex(x => x[key] === ref.id);
                    const merged = (opts.merge && idx >= 0) ? { ...arr[idx], ...data, [key]: ref.id } : { ...data, [key]: ref.id };
                    if (idx >= 0) arr[idx] = merged; else arr.push(merged);
                    saveStore();
                    emit(ref.colName);
                },
                updateDoc: async (ref, patch) => {
                    const arr = store[ref.colName] || [];
                    const key = ref.colName === 'userRecycleBin' ? 'userId' : 'id';
                    const idx = arr.findIndex(x => x[key] === ref.id);
                    if (idx >= 0) {
                        arr[idx] = { ...arr[idx], ...patch };
                        saveStore();
                        emit(ref.colName);
                    }
                },
                deleteDoc: async (ref) => {
                    const arr = store[ref.colName] || [];
                    const key = ref.colName === 'userRecycleBin' ? 'userId' : 'id';
                    store[ref.colName] = arr.filter(x => x[key] !== ref.id);
                    saveStore();
                    emit(ref.colName);
                },
                onSnapshot: (colName, onNext) => {
                    if (!listeners[colName]) listeners[colName] = [];
                    listeners[colName].push(onNext);
                    setTimeout(() => emit(colName), 0);
                    return () => {
                        listeners[colName] = (listeners[colName] || []).filter(fn => fn !== onNext);
                    };
                },
                runTransaction: async (db, fn) => {
                    const tx = {
                        get: async (ref) => {
                            const arr = store[ref.colName] || [];
                            const item = arr.find(x => x.id === ref.id);
                            return { exists: () => Boolean(item), data: () => ({ ...item }) };
                        },
                        update: (ref, patch) => {
                            const arr = store[ref.colName] || [];
                            const idx = arr.findIndex(x => x.id === ref.id);
                            if (idx >= 0) arr[idx] = { ...arr[idx], ...patch };
                        }
                    };
                    const res = await fn(tx);
                    saveStore();
                    emit('users');
                    return res;
                },
                storageRef: () => null,
                uploadString: async () => { },
                getDownloadURL: async () => '',
                deleteObject: async () => { }
            };
        }

        function playNotificationChime(type = 'wallet_credit', forcePreview = false) {
            if (!state.soundEnabled && !forcePreview) return;
            triggerHaptic(type === 'excess_spent' ? [180, 90, 220] : [120, 60, 120]);
            const volRatio = Math.max(0, Math.min(100, Number(state.soundVolume || 80))) / 100;
            if (volRatio <= 0.01) return;
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                if (!sharedAudioCtx) sharedAudioCtx = new AudioCtx();
                if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume();
                const now = sharedAudioCtx.currentTime;
                const peakGain = 0.25 * volRatio;
                const isExcess = type === 'excess_spent';
                const notes = isExcess ? [659.25, 523.25] : [523.25, 783.99];
                notes.forEach((freq, idx) => {
                    const osc = sharedAudioCtx.createOscillator();
                    const gain = sharedAudioCtx.createGain();
                    osc.type = isExcess ? 'triangle' : 'sine';
                    const startTime = now + idx * 0.12;
                    osc.frequency.setValueAtTime(freq, startTime);
                    gain.gain.setValueAtTime(0.0001, startTime);
                    gain.gain.exponentialRampToValueAtTime(peakGain, startTime + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.4);
                    osc.connect(gain);
                    gain.connect(sharedAudioCtx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.42);
                });
            } catch (err) { }
        }

        async function requestAdminAuthCode() {
            const usernameInput = document.getElementById('forgot-username');

                return;

            try {
                const existingReq = state.passwordRequests.find(r => (r.username || '').toLowerCase() === username && r.status === 'pending');

                const { db, doc, setDoc } = window.FB;
                await setDoc(doc(db, 'passwordRequests', reqId), {
                    id: reqId,
                    username: user.username,
                    name: user.name,
                    code,
                    status: 'pending',
                    createdAt: existingReq ? existingReq.createdAt : new Date().toISOString()
                });
                showToast('Code requested! Contact Admin for your 6-digit code.', 'success');
            } catch (err) {

        async function handleForgotPasswordSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('forgot-username').value.trim().toLowerCase();
            const authCode = document.getElementById('forgot-auth-code').value.trim();
            const newPassword = document.getElementById('forgot-new-password').value;
            const confirmPassword = document.getElementById('forgot-confirm-password').value;

            const user = state.users.find(u => (u.username || '').toLowerCase() === username);
            if (!user) {
                showToast('Username not found.', 'error');
                return;
            }
            const req = state.passwordRequests.find(r => (r.username || '').toLowerCase() === username && r.status === 'pending');
            if (!req || req.code !== authCode) {
                showToast('Invalid or unapproved code.', 'error');
                return;
            }
            if (!newPassword || newPassword.length < 4) {
                showToast('Password must be at least 4 characters.', 'error');
                return;
            }
            if (newPassword !== confirmPassword) {
                showToast('Passwords do not match.', 'error');
                return;

            try {
                const { db, doc, updateDoc } = window.FB;
                await updateDoc(doc(db, 'users', user.id), { password: newPassword });
                await updateDoc(doc(db, 'passwordRequests', req.id), { status: 'approved' });
                showToast('Password reset successfully! Please sign in.', 'success');
                setAuthView('login');
            } catch (err) {
                showToast('Password reset failed.', 'error');
            }
        }

        // ---------- WALLET & EXPENSE BALANCE ENGINE ----------
        async function adjustWallet(userId, delta) {
            const { db, doc, runTransaction } = window.FB;
            const ref = doc(db, 'users', userId);
            const result = await runTransaction(db, async (tx) => {
                const snap = await tx.get(ref);
                if (!snap.exists()) throw new Error('User not found');
                let wallet = round2(snap.data().wallet);
                let excess = round2(snap.data().excessSpent);
                let excessCleared = 0;
                let excessAdded = 0;

                if (delta > 0) {
                    excessCleared = Math.min(excess, delta);
                    excess = round2(excess - excessCleared);
                    wallet = round2(wallet + (delta - excessCleared));
                } else if (delta < 0) {
                    const spend = -delta;
                    if (wallet >= spend) {
                        wallet = round2(wallet - spend);
                    } else {
                        excessAdded = round2(spend - wallet);
                        excess = round2(excess + excessAdded);
                        wallet = 0;
                    }
                }
                tx.update(ref, { wallet, excessSpent: excess });
                return { wallet, excess, excessCleared: round2(excessCleared), excessAdded };
            });

            const local = state.users.find(u => u.id === userId);
            if (local) { local.wallet = result.wallet; local.excessSpent = result.excess; }
            if (state.currentUser && state.currentUser.id === userId) {
                state.currentUser.wallet = result.wallet;
                state.currentUser.excessSpent = result.excess;
                persistCurrentUser(state.currentUser);
            }
            return result;
        }

        async function refundExpenseToUserWallet(userId, amountToRefund, reasonTitle = 'Expense', category = '') {
            const refundAmt = round2(amountToRefund);
            if (!userId || refundAmt <= 0) return;

            const targetUser = state.users.find(u => u.id === userId);
            if (!targetUser || targetUser.role === 'admin' || targetUser.role === 'developer') return;

            const res = await adjustWallet(userId, refundAmt);
            const { db, doc, setDoc } = window.FB;
            const txnId = 'txn_' + Date.now() + '_' + Math.random().toString(36).substring(2, 5);
            const catLabel = category ? ` (${category})` : '';
            const walletPart = round2(refundAmt - res.excessCleared);
            let breakdownNote = `Added ${formatCurrency(walletPart)} back to wallet`;
            if (res.excessCleared > 0 && walletPart > 0) {
                breakdownNote = `Cleared ${formatCurrency(res.excessCleared)} Excess Due + Added ${formatCurrency(walletPart)} to Wallet`;
            } else if (res.excessCleared > 0) {
                breakdownNote = `Reduced Excess Spent Due by ${formatCurrency(res.excessCleared)}`;
            }

            await setDoc(doc(db, 'walletTransactions', txnId), {
                id: txnId,
                userId,
                type: 'undo_refund',
                title: `Undo Expense: ${reasonTitle}${catLabel}`,
                subtitle: breakdownNote,
                amount: refundAmt,
                timestamp: new Date().toISOString(),
                performedBy: state.currentUser ? state.currentUser.name : targetUser.name
            });
        }

        // ---------- GOOGLE DRIVE BILL UPLOAD (DEVELOPER-CONFIGURED, SILENT FOR USERS/ADMINS) ----------
        function getDriveConfig() {
            return (state.appSettings && state.appSettings.googleDrive) || { clientId: '', folderId: '', accessToken: '', connectedEmail: '' };
        }

        function isDriveReady() {
            const cfg = getDriveConfig();
            return Boolean(cfg && cfg.clientId && cfg.accessToken);
        }

        async function ensureDriveFolder(accessToken, folderId) {
            if (folderId && folderId.trim()) return folderId.trim();
            const q = encodeURIComponent("name='Click Factory Bills' and mimeType='application/vnd.google-apps.folder' and trashed=false");
            const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, {
                headers: { Authorization: `Bearer ${accessToken}` }
            });
            if (!searchRes.ok) throw new Error('Drive folder search failed');
            const searchData = await searchRes.json();
            if (searchData.files && searchData.files.length > 0) {
                return searchData.files[0].id;
            }
            const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
                method: 'POST',
                headers: {
                    Authorization: `Bearer ${accessToken}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    name: 'Click Factory Bills',
                    mimeType: 'application/vnd.google-apps.folder'
                })
            });
            if (!createRes.ok) throw new Error('Drive folder creation failed');
            const folder = await createRes.json();
            return folder.id;
        }

        async function uploadBillToGoogleDrive(dataUrl, fileName) {
            const cfg = getDriveConfig();
            if (!cfg.accessToken) throw new Error('Drive not connected');

            const targetFolderId = await ensureDriveFolder(cfg.accessToken, cfg.folderId);
            const base64Data = dataUrl.split(',')[1];
            const byteChars = atob(base64Data);
            const byteNumbers = new Array(byteChars.length);
            for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
            const blob = new Blob([new Uint8Array(byteNumbers)], { type: 'image/jpeg' });

            const metadata = {
                name: fileName,
                mimeType: 'image/jpeg',
                parents: [targetFolderId]
            };

            const form = new FormData();
            form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            form.append('file', blob);

            const uploadRes = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink', {
                method: 'POST',
                headers: { Authorization: `Bearer ${cfg.accessToken}` },
                body: form
            });

            if (!uploadRes.ok) throw new Error('Drive multipart upload failed');
            const fileObj = await uploadRes.json();

            await fetch(`https://www.googleapis.com/drive/v3/files/${fileObj.id}/permissions`, {
                method: 'POST',
                headers: {
                    Authorization: `Bearer ${cfg.accessToken}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ role: 'reader', type: 'anyone' })
            });

            return {
                driveFileId: fileObj.id,
                billUrl: `https://lh3.googleusercontent.com/d/${fileObj.id}=w1200`
            };
        }

        async function deleteBillFromGoogleDrive(driveFileId) {
            const cfg = getDriveConfig();
            if (!cfg.accessToken || !driveFileId) return;
            try {
                await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}`, {
                    method: 'DELETE',
                    headers: { Authorization: `Bearer ${cfg.accessToken}` }
                });
            } catch (e) { }

        async function handleSaveGoogleDriveConfig(e) {
            e.preventDefault();
            if (!isDeveloper()) return;
            const clientId = document.getElementById('gdrive-client-id').value.trim();
            const folderId = document.getElementById('gdrive-folder-id').value.trim();
            const existing = getDriveConfig();
            const { db, doc, setDoc } = window.FB;
            await setDoc(doc(db, 'settings', 'app_settings'), {
                ...state.appSettings,
                googleDrive: { ...existing, clientId, folderId }
            }, { merge: true });
            closeModal();
            showToast('Google Drive settings saved.', 'success');
        }

        function connectSharedGoogleDrive() {
            if (!isDeveloper()) return;
            const clientId = document.getElementById('gdrive-client-id').value.trim();
            const folderId = document.getElementById('gdrive-folder-id').value.trim();
            if (!clientId) {
                showToast('Enter your Google OAuth Client ID first.', 'error');
                return;
            }
            if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) {
                showToast('Google Identity script is still loading. Try again in a moment.', 'error');
                return;
            }
            const tokenClient = window.google.accounts.oauth2.initTokenClient({
                client_id: clientId,
                scope: 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email',
                callback: async (resp) => {
                    if (resp && resp.access_token) {
                        let email = 'Google Drive Connected';
                        try {
                            const infoRes = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                                headers: { Authorization: `Bearer ${resp.access_token}` }
                            });
                            if (infoRes.ok) {
                                const info = await infoRes.json();
                                if (info.email) email = info.email;
                            }
                        } catch (e) { }
                        const { db, doc, setDoc } = window.FB;
                        await setDoc(doc(db, 'settings', 'app_settings'), {
                            ...state.appSettings,
                            googleDrive: { clientId, folderId, accessToken: resp.access_token, connectedEmail: email }
                        }, { merge: true });
                        showToast('Google Drive connected for all users!', 'success');
                        openGoogleDriveConfigModal();
                    }
                }
            });
            tokenClient.requestAccessToken({ prompt: 'consent' });
        }

        async function disconnectSharedGoogleDrive() {
            if (!isDeveloper()) return;
            const existing = getDriveConfig();
            const { db, doc, setDoc } = window.FB;
            await setDoc(doc(db, 'settings', 'app_settings'), {
                ...state.appSettings,
                googleDrive: { ...existing, accessToken: '', connectedEmail: '' }

            showToast('Google Drive disconnected.', 'info');
            openGoogleDriveConfigModal();

        function syncPersistentNavbar() {
            const navWrapper = document.getElementById('persistent-nav-wrapper');
            if (!navWrapper) return;

            if (!state.currentUser || state.isDbLoading) {
                navWrapper.classList.add('hidden');

                    badgeEl.classList.add('hidden');
                }

            let activeTargetId = 'nav-btn-home';
            if (state.activeTab === 'home' || state.activeTab === 'notifications') activeTargetId = 'nav-btn-home';
            else if (state.activeTab === 'admin' || state.activeTab === 'analytics') activeTargetId = 'nav-btn-summary';
            else if ((state.activeTab === 'users' && isPriv) || (state.activeTab === 'wallet' && !isPriv)) activeTargetId = 'nav-btn-users';

        function openNewExpenseTab() {
            state.editingExpenseId = null;
            state.tempBillData = null;
            state.tempFormCache = null;
            switchTab('add');
        }

        function switchTab(tab, keepEditState = false) {
            const prevIndex = tabOrder.indexOf(state.activeTab);
            if (tab === 'summary') {
                state.activeTab = isAdminOrDev() ? 'admin' : 'analytics';
            } else {
                state.activeTab = tab;
            }
            const nextIndex = tabOrder.indexOf(state.activeTab);
            state.slideDirection = nextIndex >= prevIndex ? 'animate-slide-right' : 'animate-slide-left';

            if (!keepEditState) {
                state.editingExpenseId = null;
                state.tempBillData = null;
                state.tempFormCache = null;
            }

            syncPersistentHeader();
            syncPersistentNavbar();
            render();
        }

                syncPersistentNavbar();

        // ---------- HOME TAB & EXPENSE LIST ----------
        function getFilteredExpenses() {
            const isPriv = isAdminOrDev();
            return state.expenses.filter(exp => {
                if (!isPriv && exp.userId !== state.currentUser.id) return false;
                if (isPriv && state.filterUser !== 'All' && exp.userId !== state.filterUser) return false;
                if (state.filterCategory !== 'All' && exp.category !== state.filterCategory) return false;
                if (state.filterMonth !== 'All' && !(exp.date || '').startsWith(state.filterMonth)) return false;
                if (state.filterStartDate && exp.date < state.filterStartDate) return false;
                if (state.filterEndDate && exp.date > state.filterEndDate) return false;

                if (state.searchQuery.trim() !== '') {
                    const q = state.searchQuery.toLowerCase();
                    const matchTitle = (exp.title || '').toLowerCase().includes(q);
                    const matchNotes = exp.notes && exp.notes.toLowerCase().includes(q);
                    const matchUser = (exp.userName || '').toLowerCase().includes(q);
                    const matchClient = exp.clientNamePlace && exp.clientNamePlace.toLowerCase().includes(q);
                    if (!matchTitle && !matchNotes && !matchUser && !matchClient) return false;
                }
                return true;
            });
        }

                                    <span class="truncate">Shoot</span>

                        <div class="flex items-center space-x-2 w-full">

                        ${state.showDateFilter ? `
                        <div class="ios-glass-card p-2.5 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm space-y-1.5 w-full">

                        </div>

                        ${filtered.length === 0 ? `
                            <div class="ios-glass-card rounded-3xl p-8 text-center shadow-sm mt-3 w-full">
                                <div class="w-14 h-14 bg-slate-100 dark:bg-slate-800 text-slate-400 rounded-2xl flex items-center justify-center mx-auto mb-3 text-xl"><i class="fa-solid fa-receipt"></i></div>

                        ${sortedDates.map(dateKey => {

                const formattedDateHeader = parseLocal(dateKey).toLocaleDateString('en-US', {

                                                            <span class="italic text-slate-600 dark:text-slate-300 break-all">${escapeHtml(exp.userName)}</span>

                                                                <i class="fa-solid fa-location-dot shrink-0"></i>
                                                                <span class="break-words">Client/Place: ${escapeHtml(exp.clientNamePlace)}</span>
                                                            </div>
                                                        ` : ''}

                                                        ${exp.notes ? `<p class="text-xs text-slate-600 dark:text-slate-400 mt-2.5 bg-slate-50/80 dark:bg-slate-800/60 p-3 rounded-2xl border border-slate-200/60 dark:border-slate-700/60 break-words">${escapeHtml(exp.notes)}</p>` : ''}

                                                            <div>
                                                                ${exp.billAttachment ? `
                                                                    <button onclick="viewBillModal('${exp.id}')" class="inline-flex items-center space-x-1.5 px-3.5 py-1.5 rounded-xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 text-xs font-medium border border-indigo-200/60 hover:bg-indigo-100 transition">
                                                                        <i class="fa-solid fa-paperclip"></i><span>View Attached Bill</span>

                                                                ` : '<span class="text-[11px] text-slate-400 italic">No bill attached</span>'}

                                                            ${isOwner ? `
                                                                <div class="flex items-center space-x-1.5 shrink-0">
                                                                    ${!isPriv ? `
                                                                        <button onclick="confirmUndoExpense('${exp.id}')" class="px-2.5 h-8 rounded-xl bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 hover:bg-emerald-500/20 border border-emerald-500/20 transition flex items-center justify-center space-x-1 text-xs font-semibold" title="Undo Expense & Refund to Wallet">
                                                                            <i class="fa-solid fa-rotate-left"></i>
                                                                            <span>Undo</span>
                                                                        </button>
                                                                    ` : ''}
                                                                    <button onclick="startEditExpense('${exp.id}')" class="w-8 h-8 rounded-xl bg-slate-100/80 dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 hover:bg-indigo-50 hover:text-indigo-600 transition flex items-center justify-center text-xs" title="Edit"><i class="fa-solid fa-pen"></i></button>
                                                                    <button onclick="confirmDeleteExpense('${exp.id}')" class="w-8 h-8 rounded-xl bg-slate-100/80 dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 hover:bg-rose-50 hover:text-rose-600 transition flex items-center justify-center text-xs" title="Delete"><i class="fa-solid fa-trash"></i></button>
                                                                </div>
                                                            ` : ''}
                                                        </div>
                                                    </div>
                                                </div>

        function handleSearchInput(e) {
            state.searchQuery = e.target.value;
            const input = document.getElementById('search-input');
            const cursorPos = input ? input.selectionStart : 0;
            renderMainContentOnly();
            const newInput = document.getElementById('search-input');
            if (newInput) {
                newInput.focus();
                newInput.setSelectionRange(cursorPos, cursorPos);
            }
        }

        function clearSearch() { state.searchQuery = ''; renderMainContentOnly(); }
        function setFilterCategory(cat) { state.filterCategory = cat; renderMainContentOnly(); }
        function setFilterMonth(month) {
            state.filterMonth = month;
            if (month !== 'All') {
                state.filterStartDate = '';
                state.filterEndDate = '';
            }
            renderMainContentOnly();
        }
        function setFilterUser(userId) { state.filterUser = userId; renderMainContentOnly(); }
        function setFilterStartDate(date) { state.filterStartDate = date; state.filterMonth = 'All'; renderMainContentOnly(); }
        function setFilterEndDate(date) { state.filterEndDate = date; state.filterMonth = 'All'; renderMainContentOnly(); }
        function clearDateRange() { state.filterStartDate = ''; state.filterEndDate = ''; renderMainContentOnly(); }

        // ---------- ADD / EDIT EXPENSE & CAMERA / BILL UPLOAD ----------
        function updateFormCache() {
            const get = (id) => document.getElementById(id);
            state.tempFormCache = {
                category: get('expense-category') ? get('expense-category').value : 'Office',
                clientNamePlace: get('expense-client') ? get('expense-client').value : '',
                amount: get('expense-amount') ? get('expense-amount').value : '',
                title: get('expense-title') ? get('expense-title').value : '',
                date: get('expense-date') ? get('expense-date').value : todayStr(),
                notes: get('expense-notes') ? get('expense-notes').value : ''
            };
        }

        function catBtnClass(active) {
            const base = 'py-3.5 px-3 rounded-2xl border font-medium text-xs sm:text-sm flex items-center justify-center space-x-2 transition truncate';
            return active
                ? `${base} bg-indigo-600 text-white border-indigo-600 shadow-md`
                : `${base} bg-slate-50/80 dark:bg-slate-800/80 text-slate-700 dark:text-slate-300 border-slate-200/80 dark:border-slate-700`;
        }

        function setFormCategory(cat) {
            updateFormCache();
            document.getElementById('expense-category').value = cat;
            if (state.tempFormCache) state.tempFormCache.category = cat;
            document.getElementById('btn-cat-office').className = catBtnClass(cat === 'Office');
            document.getElementById('btn-cat-shoot').className = catBtnClass(cat === 'Shoot');
            const clientContainer = document.getElementById('client-input-container');
            if (clientContainer) clientContainer.classList.toggle('hidden', cat === 'Office');
        }

        function resizeImageToDataUrl(source, srcW, srcH) {
            const maxDim = 900;
            let width = srcW, height = srcH;
            if (width >= height && width > maxDim) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
            } else if (height > maxDim) {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            canvas.getContext('2d').drawImage(source, 0, 0, width, height);
            return canvas.toDataURL('image/jpeg', 0.82);
        }

        function handleBillUpload(event) {
            updateFormCache();
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (uploadEvent) {
                const img = new Image();
                img.onload = function () {
                    state.tempBillData = resizeImageToDataUrl(img, img.width, img.height);
                    showToast('Bill attached successfully!', 'success');
                    renderMainContentOnly();
                };
                img.onerror = () => showToast('Could not read that image.', 'error');
                img.src = uploadEvent.target.result;
            };
            reader.readAsDataURL(file);
        }

        function openCameraCaptureModal() {
            updateFormCache();
            const root = document.getElementById('modal-root');
            root.innerHTML = `
                <div class="fixed inset-0 z-[60] bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-4">
                    <div class="w-full max-w-md bg-slate-900 rounded-3xl overflow-hidden border border-slate-800 shadow-2xl flex flex-col">
                        <div class="p-4 bg-slate-800/80 flex items-center justify-between border-b border-slate-700">
                            <h3 class="font-bold text-sm text-white flex items-center space-x-2"><i class="fa-solid fa-camera text-indigo-400"></i><span>Capture Bill Receipt</span></h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <div class="relative bg-black flex-1 flex items-center justify-center min-h-[300px]">
                            <video id="camera-stream" autoplay playsinline class="w-full h-full object-cover max-h-[50vh]"></video>
                        </div>
                        <div class="p-5 bg-slate-900 flex items-center justify-around">
                            <button type="button" onclick="closeModal()" class="px-5 py-3 rounded-2xl bg-slate-800 text-slate-300 text-xs font-semibold">Cancel</button>
                            <button type="button" onclick="takeSnapshot()" class="w-14 h-14 rounded-full bg-indigo-600 hover:bg-indigo-700 text-white flex items-center justify-center shadow-lg text-xl"><i class="fa-solid fa-camera"></i></button>
                        </div>
                    </div>
                </div>
            `;
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showToast('Camera is not available on this device.', 'error');
                closeModal();
                return;
            }
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
                .then(stream => {
                    window.activeCameraStream = stream;
                    const v = document.getElementById('camera-stream');
                    if (v) v.srcObject = stream; else stream.getTracks().forEach(t => t.stop());
                })
                .catch(() => {
                    showToast('Unable to access device camera.', 'error');
                    closeModal();
                });
        }

        function takeSnapshot() {
            const videoElement = document.getElementById('camera-stream');
            if (!videoElement) return;
            state.tempBillData = resizeImageToDataUrl(videoElement, videoElement.videoWidth || 640, videoElement.videoHeight || 480);
            closeModal();
            showToast('Bill captured!', 'success');
            renderMainContentOnly();
        }

        function removeBillAttachment(event) {
            if (event) event.stopPropagation();
            updateFormCache();
            state.tempBillData = '';
            showToast('Bill removed.', 'info');
            renderMainContentOnly();
        }

        function previewCurrentTempBill() {
            let billToPreview = state.tempBillData;
            if ((billToPreview === null || billToPreview === undefined) && state.editingExpenseId) {
                const found = state.expenses.find(e => e.id === state.editingExpenseId);
                if (found) billToPreview = found.billAttachment;
            }
            if (!billToPreview) return;
            openBillPreviewModal(billToPreview, 'Attached Bill Preview');
        }

        function viewBillModal(expenseId) {
            const exp = state.expenses.find(e => e.id === expenseId) || state.recycleBin.find(e => e.id === expenseId);
            if (!exp || !exp.billAttachment) return;
            openBillPreviewModal(exp.billAttachment, `Bill Receipt: ${exp.title}`, exp.driveFileId);
        }

        function openBillPreviewModal(imgUrl, titleText, driveFileId = '') {
            const root = document.getElementById('modal-root');
            const isDev = isDeveloper();
            root.innerHTML = `
                <div class="fixed inset-0 z-[60] bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn">
                    <div class="ios-glass-modal rounded-3xl p-5 max-w-md w-full shadow-2xl space-y-4">
                        <div class="flex items-center justify-between gap-2">
                            <h3 class="font-bold text-sm text-slate-900 dark:text-white truncate">${escapeHtml(titleText)}</h3>

                        </div>
                        <div class="bg-slate-100/80 dark:bg-slate-800/80 rounded-2xl overflow-hidden flex items-center justify-center max-h-[60vh]">
                            <img src="${escapeHtml(imgUrl)}" alt="Bill" class="max-w-full max-h-[60vh] object-contain">
                        </div>
                        ${isDev && driveFileId ? `
                            <a href="https://drive.google.com/file/d/${escapeHtml(driveFileId)}/view" target="_blank" rel="noopener noreferrer" class="w-full py-2.5 bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 font-semibold rounded-2xl text-xs flex items-center justify-center gap-1.5 border border-indigo-200 dark:border-indigo-800">
                                <i class="fa-brands fa-google-drive"></i>
                                <span>Open in Google Drive</span>
                            </a>
                        ` : ''}
                        <button onclick="closeModal()" class="w-full py-3 bg-slate-200/90 dark:bg-slate-800/90 hover:bg-slate-300 text-slate-800 dark:text-slate-200 font-semibold rounded-2xl text-xs transition">Close</button>
                    </div>
                </div>
            `;
        }

        function renderAddEditTab() {

            let expense = {
                title: '', amount: '', category: 'Office', date: todayStr(),
                clientNamePlace: '', notes: '', billAttachment: null

                if (found) expense = { ...found };

                expense = { ...expense, ...state.tempFormCache };

                : expense.billAttachment;

                            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2.5">Amount (₹)</label>

        async function handleExpenseSubmit(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('expense-submit-btn');
            if (submitBtn && submitBtn.disabled) return;

            const category = document.getElementById('expense-category').value;
            const amount = round2(parseFloat(document.getElementById('expense-amount').value));
            const title = document.getElementById('expense-title').value.trim();
            const date = document.getElementById('expense-date').value;
            const clientNamePlace = category === 'Shoot' ? document.getElementById('expense-client').value.trim() : '';
            const notes = document.getElementById('expense-notes').value.trim();

            if (!title || isNaN(amount) || amount <= 0 || !date) {
                showToast('Please fill in all required fields.', 'error');
                return;
            }

            if (submitBtn) submitBtn.disabled = true;
            showToast('Saving expense...', 'info');
            const { db, doc, setDoc } = window.FB;

            const expenseId = state.editingExpenseId || ('exp_' + Date.now());
            const existingExp = state.editingExpenseId ? state.expenses.find(e => e.id === expenseId) : null;
            let billUrl = existingExp ? (existingExp.billAttachment || null) : null;
            let driveFileId = existingExp ? (existingExp.driveFileId || '') : '';
            let walletDelta = 0;
            let walletOwnerId = null;

            try {
                if (state.tempBillData === '') {
                    if (driveFileId) await deleteBillFromGoogleDrive(driveFileId);
                    billUrl = null;
                    driveFileId = '';
                } else if (state.tempBillData && state.tempBillData.startsWith('data:image')) {
                    if (navigator.onLine && isDriveReady()) {
                        try {
                            const safeFileName = `${date}_${title.replace(/[^a-zA-Z0-9_-]/g, '_')}_${expenseId}.jpg`;
                            const uploaded = await uploadBillToGoogleDrive(state.tempBillData, safeFileName);
                            billUrl = uploaded.billUrl;
                            driveFileId = uploaded.driveFileId;
                        } catch (driveErr) {
                            billUrl = state.tempBillData;
                        }
                    } else {
                        billUrl = state.tempBillData;
                    }
                }

                const expenseOwnerId = existingExp ? existingExp.userId : state.currentUser.id;
                const expenseOwnerName = existingExp ? existingExp.userName : state.currentUser.name;
                const ownerUser = state.users.find(u => u.id === expenseOwnerId) || state.currentUser;

                let walletResult = null;
                if (ownerUser.role !== 'admin' && ownerUser.role !== 'developer') {
                    const oldAmount = existingExp ? Number(existingExp.amount) : 0;
                    walletDelta = round2(-(amount - oldAmount));
                    if (walletDelta !== 0) {
                        walletOwnerId = ownerUser.id;
                        walletResult = await adjustWallet(walletOwnerId, walletDelta);
                    }
                }

                try {
                    await setDoc(doc(db, 'expenses', expenseId), {
                        id: expenseId,
                        userId: expenseOwnerId,
                        userName: expenseOwnerName,
                        title,
                        amount,
                        category,
                        date,
                        clientNamePlace,
                        notes,
                        billAttachment: billUrl,
                        driveFileId,
                        createdAt: existingExp ? existingExp.createdAt : new Date().toISOString()
                    });
                } catch (saveErr) {
                    if (walletOwnerId) {
                        try { await adjustWallet(walletOwnerId, -walletDelta); } catch (e) { }
                    }
                    throw saveErr;
                }

                if (walletResult && walletResult.excessAdded > 0) {
                    await createAppNotification({
                        recipientId: null,
                        recipientRole: 'admin',
                        type: 'excess_spent',
                        title: `Excess Spent Alert: ${ownerUser.name}`,
                        message: `${ownerUser.name} spent ${formatCurrency(walletResult.excessAdded)} over wallet balance on "${title}" (${category}). Total Excess Due: ${formatCurrency(walletResult.excess)}.`,
                        amount: walletResult.excessAdded,
                        triggeredBy: ownerUser.name
                    });
                }

                const wasEditing = Boolean(state.editingExpenseId);
                state.editingExpenseId = null;
                state.tempBillData = null;
                state.tempFormCache = null;
                showToast(wasEditing ? 'Expense updated successfully!' : 'Expense saved successfully!', 'success');
                switchTab('home');
            } catch (error) {
                showToast('Failed to save expense.', 'error');
                if (submitBtn) submitBtn.disabled = false;
            }
        }

        function startEditExpense(id) {
            const exp = state.expenses.find(e => e.id === id);
            if (!exp) return;
            state.editingExpenseId = id;
            state.tempBillData = exp.billAttachment || null;
            state.tempFormCache = {
                category: exp.category || 'Office',
                clientNamePlace: exp.clientNamePlace || '',
                amount: exp.amount || '',
                title: exp.title || '',
                date: exp.date || todayStr(),
                notes: exp.notes || ''
            };
            switchTab('add', true);
        }

        function cancelEdit() {
            state.editingExpenseId = null;
            state.tempBillData = null;
            state.tempFormCache = null;
            switchTab('home');
        }

        function confirmUndoExpense(id) {
            if (!state.currentUser || isAdminOrDev()) return;
            const exp = state.expenses.find(e => e.id === id);
            if (!exp) return;
            if (exp.userId !== state.currentUser.id) {
                showToast('Only the user who created this expense can undo it.', 'error');
                return;
            }
            showConfirmModal(
                'Undo Expense & Refund Wallet',
                `Undo "${exp.title}" and return ${formatCurrency(exp.amount)} back to your wallet?`,
                async () => {
                    const { db, doc, deleteDoc, setDoc } = window.FB;
                    try {
                        await setDoc(doc(db, 'recycleBin', id), {
                            ...exp,
                            deletedAt: new Date().toISOString(),
                            deletedBy: `${state.currentUser.name} (Undo & Refunded)`
                        });
                        await deleteDoc(doc(db, 'expenses', id));
                        await refundExpenseToUserWallet(exp.userId, exp.amount, exp.title, exp.category);
                        showToast(`Expense undone! ${formatCurrency(exp.amount)} returned to your wallet.`, 'success');
                    } catch (err) {
                        showToast('Failed to undo expense.', 'error');
                    }
                }
            );
        }

        function confirmDeleteExpense(id) {
            showConfirmModal(
                'Delete Expense',
                'Are you sure you want to move this expense to the Recycle Bin?',
                async () => {
                    const { db, doc, deleteDoc, setDoc } = window.FB;
                    const exp = state.expenses.find(e => e.id === id);
                    if (!exp) return;
                    try {
                        await setDoc(doc(db, 'recycleBin', id), {
                            ...exp,
                            deletedAt: new Date().toISOString(),
                            deletedBy: state.currentUser.name
                        });
                        await deleteDoc(doc(db, 'expenses', id));
                        showToast('Expense moved to Recycle Bin.', 'success');
                    } catch (err) {
                        showToast('Failed to delete expense.', 'error');
                    }
                }
            );
        }

        async function handleWalletAdd(e, userId) {
            e.preventDefault();
            const btn = document.getElementById('wallet-submit-btn');
            if (btn && btn.disabled) return;
            const amountToAdd = round2(parseFloat(document.getElementById('wallet-add-amount').value));
            if (isNaN(amountToAdd) || amountToAdd === 0) {
                showToast('Please enter a valid amount.', 'error');
                return;
            }
            const user = state.users.find(u => u.id === userId);
            if (!user) return;
            if (btn) btn.disabled = true;

            try {
                const res = await adjustWallet(userId, amountToAdd);
                const { db, doc, setDoc } = window.FB;
                const walletPart = round2(amountToAdd - res.excessCleared);

                const txnId = 'txn_' + Date.now();
                let txnType = amountToAdd >= 0 ? 'topup' : 'shortage';
                let txnTitle = amountToAdd >= 0 ? 'Added Wallet Funds' : 'Shortage Money Adjustment';
                let txnSubtitle = '';

                if (amountToAdd > 0 && res.excessCleared > 0 && walletPart > 0) {
                    txnType = 'excess_cleared';
                    txnTitle = `Cleared Excess (${formatCurrency(res.excessCleared)}) & Added Wallet (${formatCurrency(walletPart)})`;
                    txnSubtitle = `Settled ${formatCurrency(res.excessCleared)} excess due and credited ${formatCurrency(walletPart)} to wallet`;
                } else if (amountToAdd > 0 && res.excessCleared > 0) {
                    txnType = 'excess_cleared';
                    txnTitle = 'Cleared Excess Spent Due';
                    txnSubtitle = `Settled ${formatCurrency(res.excessCleared)} of outstanding excess spent`;
                }

                await setDoc(doc(db, 'walletTransactions', txnId), {
                    id: txnId,
                    userId,
                    type: txnType,
                    title: txnTitle,
                    subtitle: txnSubtitle,
                    amount: Math.abs(amountToAdd),
                    timestamp: new Date().toISOString(),
                    performedBy: state.currentUser.name
                });

                await createAppNotification({
                    recipientId: userId,
                    recipientRole: 'user',
                    type: amountToAdd > 0 ? 'wallet_credit' : 'wallet_debit',
                    title: amountToAdd > 0 ? 'Wallet Credited!' : 'Wallet Balance Adjusted',
                    message: `${state.currentUser.name} processed ${formatCurrency(amountToAdd)}. Available Balance: ${formatCurrency(res.wallet)}.`,
                    amount: Math.abs(amountToAdd),
                    triggeredBy: state.currentUser.name
                });

                closeModal();
                showToast(`Successfully processed ${formatCurrency(amountToAdd)} for ${user.name}!`, 'success');
            } catch (err) {
                showToast('Failed to update wallet.', 'error');
                if (btn) btn.disabled = false;
            }
        }

        function renderAdminTab() {
            const monthlyMap = {};
            state.expenses.forEach(exp => {
                const monthKey = exp.date ? exp.date.substring(0, 7) : 'Unknown';
                if (!monthlyMap[monthKey]) monthlyMap[monthKey] = { month: monthKey, office: 0, shoot: 0, total: 0, count: 0 };
                if (exp.category === 'Office') monthlyMap[monthKey].office += exp.amount;
                if (exp.category === 'Shoot') monthlyMap[monthKey].shoot += exp.amount;
                monthlyMap[monthKey].total += exp.amount;
                monthlyMap[monthKey].count += 1;

            const sortedMonths = Object.keys(monthlyMap).sort().reverse();

        async function undoDeleteUser(userId) {

            if (!item) return;
            const { userId: uid, name, username, password, role, email, wallet, excessSpent, expenses } = item;
            await setDoc(doc(db, 'users', uid), { id: uid, name, username, password, role, email, wallet: Number(wallet || 0), excessSpent: Number(excessSpent || 0) });
            if (expenses && expenses.length > 0) {

        async function handlePasswordChange(e) {

        // ---------- CSV + BOUND BILLS EXPORT ----------
        function exportUserCSV(userId) {
            const userName = uName(userId) || 'user';
            downloadCSV(state.expenses.filter(e => e.userId === userId), `${userName.replace(/\s+/g, '_')}_expenses.csv`);
        }

        function exportFilteredCSV() {
            downloadCSV(getFilteredExpenses(), 'filtered_expenses_report.csv');

        function exportAllCSV() {
            downloadCSV(state.expenses, 'all_company_expenses.csv');

        function buildCsvString(dataArray) {
            const headers = ['ID', 'User', 'Title', 'Category', 'Client & Place', 'Amount (INR)', 'Date', 'Notes', 'Has Bill', 'Bound Bill Link / File'];
            const safe = v => {
                let s = String(v ?? '');
                if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
                return '"' + s.replace(/"/g, '""') + '"';
            };
            const lines = [
                headers.map(safe).join(','),
                ...dataArray.map(e => {
                    const billRef = e.billAttachment
                        ? (e.billAttachment.startsWith('data:') ? `bills/${e.date}_${e.id}.jpg` : e.billAttachment)
                        : 'None';
                    return [e.id, e.userName, e.title, e.category, e.clientNamePlace, e.amount, e.date, e.notes, e.billAttachment ? 'Yes' : 'No', billRef].map(safe).join(',');
                })
            ];
            return '\ufeff' + lines.join('\r\n');
        }

        function triggerBlobDownload(blob, filename) {
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        async function downloadCSV(dataArray, filename) {
            if (!dataArray || dataArray.length === 0) {
                showToast('No records available to export.', 'error');
                return;
            }
            const csvText = buildCsvString(dataArray);
            const withBills = dataArray.filter(e => e.billAttachment);

            if (withBills.length > 0 && window.JSZip) {
                showToast('Bundling CSV with attached bills...', 'info');
                try {
                    const zip = new window.JSZip();
                    zip.file(filename, csvText);
                    const billsFolder = zip.folder('bills');

                    for (const exp of withBills) {
                        const billFileName = `${exp.date || 'bill'}_${exp.id}.jpg`;
                        if (exp.billAttachment.startsWith('data:image')) {
                            const b64 = exp.billAttachment.split(',')[1];
                            billsFolder.file(billFileName, b64, { base64: true });
                        } else {
                            try {
                                const res = await fetch(exp.billAttachment);
                                if (res.ok) {
                                    const blob = await res.blob();
                                    billsFolder.file(billFileName, blob);
                                }
                            } catch (e) { }
                        }
                    }

                    const zipBlob = await zip.generateAsync({ type: 'blob' });
                    triggerBlobDownload(zipBlob, filename.replace(/\.csv$/i, '_with_bills.zip'));
                    showToast(`Exported ${dataArray.length} records + ${withBills.length} bound bill(s)!`, 'success');
                    return;
                } catch (err) { }
            }

            const blob = new Blob([csvText], { type: 'text/csv;charset=utf-8' });
            triggerBlobDownload(blob, filename);
            showToast(`Exported ${dataArray.length} records!`, 'success');
        }

        // ---------- PULL-TO-REFRESH GESTURES ----------
        let ptrStartX = 0;
        let ptrStartY = 0;
        let ptrCurrentY = 0;
        let isPulling = false;
        let isRefreshing = false;
        let hasVibrated = false;
        let gestureAxis = null;

        const REFRESH_THRESHOLD = 60;
        const MAX_PULL_DISTANCE = 140;
        const DIRECTION_LOCK_THRESHOLD = 6;

        function ptrPullDistance(rawDiff) {
            if (rawDiff <= 0) return 0;
            return Math.min(MAX_PULL_DISTANCE, rawDiff * 0.42 * (1 - (rawDiff / (rawDiff + 280))));
        }

        document.addEventListener('touchstart', (e) => {
            if (!isPtrAllowed() || isRefreshing || !e.touches || !e.touches[0]) {
                isPulling = false;
                return;
            }
            const mainContent = document.getElementById('main-content');
            if (mainContent && mainContent.scrollTop <= 0) {
                ptrStartX = e.touches[0].clientX;
                ptrStartY = e.touches[0].clientY;
                ptrCurrentY = ptrStartY;
                isPulling = true;
                hasVibrated = false;
                gestureAxis = null;
            } else {
                isPulling = false;
            }
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            if (!isPulling || isRefreshing || !isPtrAllowed() || !e.touches || !e.touches[0]) return;
            const mainContent = document.getElementById('main-content');
            if (!mainContent || mainContent.scrollTop > 0) {
                isPulling = false;
                resetPtrVisuals();
                return;
            }
            const currentX = e.touches[0].clientX;
            const currentY = e.touches[0].clientY;
            const rawDiffX = currentX - ptrStartX;
            const rawDiffY = currentY - ptrStartY;

            if (!gestureAxis) {
                if (Math.abs(rawDiffX) > DIRECTION_LOCK_THRESHOLD || Math.abs(rawDiffY) > DIRECTION_LOCK_THRESHOLD) {
                    if (Math.abs(rawDiffX) >= Math.abs(rawDiffY) || rawDiffY <= 0) {
                        gestureAxis = 'cancelled';
                        isPulling = false;
                        resetPtrVisuals();
                        return;
                    }
                    gestureAxis = 'downward-pull';
                } else {
                    return;
                }
            }

            if (gestureAxis !== 'downward-pull' || rawDiffY <= 0) {
                resetPtrVisuals();
                return;
            }

            ptrCurrentY = currentY;
            const pullDistance = ptrPullDistance(rawDiffY);
            const ptrContainer = document.getElementById('ptr-container');
            const icon = document.getElementById('ptr-icon');
            const text = document.getElementById('ptr-text');

            if (ptrContainer) {
                ptrContainer.style.transition = 'none';
                ptrContainer.style.opacity = Math.min(1, pullDistance / REFRESH_THRESHOLD).toString();
                ptrContainer.style.transform = `translateY(${pullDistance}px)`;

                if (pullDistance >= REFRESH_THRESHOLD) {
                    if (icon) icon.style.transform = 'rotate(180deg)';
                    if (text) { text.textContent = 'Release to refresh'; text.style.color = '#4f46e5'; }
                    if (!hasVibrated) {
                        triggerHaptic(12);
                        hasVibrated = true;
                    }
                } else {
                    if (icon) icon.style.transform = `rotate(${(pullDistance / REFRESH_THRESHOLD) * 180}deg)`;
                    if (text) { text.textContent = 'Pull to refresh'; text.style.color = ''; }
                    hasVibrated = false;
                }
            }
        }, { passive: true });

        document.addEventListener('touchend', async () => {
            if (!isPulling || isRefreshing || !isPtrAllowed() || gestureAxis !== 'downward-pull') {
                isPulling = false;
                gestureAxis = null;
                resetPtrVisuals();
                return;
            }
            isPulling = false;
            const rawDiffY = ptrCurrentY - ptrStartY;
            const ptrContainer = document.getElementById('ptr-container');
            const icon = document.getElementById('ptr-icon');
            const text = document.getElementById('ptr-text');

            if (ptrContainer) {
                ptrContainer.style.transition = 'transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease';
            }

            if (rawDiffY > 0 && ptrPullDistance(rawDiffY) >= REFRESH_THRESHOLD) {
                isRefreshing = true;
                if (ptrContainer) { ptrContainer.style.transform = 'translateY(42px)'; ptrContainer.style.opacity = '1'; }
                if (icon) { icon.className = 'fa-solid fa-circle-notch is-spinning'; icon.style.transform = 'none'; }
                if (text) { text.textContent = 'Updating...'; text.style.color = '#4f46e5'; }
                await new Promise(r => setTimeout(r, 500));
                softRender();
                showToast('Data refreshed!', 'success');
                isRefreshing = false;
            }
            gestureAxis = null;
            resetPtrVisuals();
        });

        function resetPtrVisuals() {
            const ptrContainer = document.getElementById('ptr-container');
            const icon = document.getElementById('ptr-icon');
            const text = document.getElementById('ptr-text');
            if (ptrContainer) { ptrContainer.style.transform = 'translateY(-40px)'; ptrContainer.style.opacity = '0'; }
            if (icon) { icon.className = 'fa-solid fa-arrow-down'; icon.style.transform = 'rotate(0deg)'; }
            if (text) { text.textContent = 'Pull to refresh'; text.style.color = ''; }
            ptrStartX = 0; ptrStartY = 0; ptrCurrentY = 0; hasVibrated = false; gestureAxis = null;
        }

        window.addEventListener('resize', syncPersistentNavbar);
        window.addEventListener('orientationchange', () => setTimeout(syncPersistentNavbar, 100));

        async function bootApp() {
            applyTheme();
            applyDockTransparency(state.dockAlpha);
            await restoreSessionFromStorage();
            render();
            if (typeof window.startAppListeners === 'function') {
                window.startAppListeners();

        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', bootApp);
        } else {
            bootApp();
        }
    </script>
